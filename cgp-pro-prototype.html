<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CGP Pro — Outils d'aide au rendez-vous client</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#122b46;
    --navy-2:#1c3f63;
    --ink:#1a2330;
    --muted:#5b6b7c;
    --bg:#f4f6f8;
    --card:#ffffff;
    --border:#e1e6ec;
    --accent:#9c7a3c;
    --accent-2:#0f7a72;
    --danger:#b3422c;
    --radius:10px;
    --shadow:0 1px 3px rgba(20,30,50,0.08), 0 1px 2px rgba(20,30,50,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.4;
  }
  .container{max-width:960px;margin:0 auto;padding:28px 20px 60px;}
  a{color:inherit;}

  /* Topbar */
  .topbar{background:var(--navy);color:#fff;}
  .topbar-inner{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:1.15rem;font-weight:700;letter-spacing:.02em;text-decoration:none;color:#fff;}
  .brand-sub{font-size:.7rem;opacity:.75;font-weight:400;display:block;margin-top:-2px;}
  .topbar nav{display:flex;gap:18px;}
  .nav-link{text-decoration:none;color:#dfe7ef;font-size:.9rem;font-weight:600;}
  .nav-link:hover{color:#fff;}

  /* Home */
  .home-intro h1{font-size:1.5rem;margin:0 0 4px;}
  .home-intro p{color:var(--muted);margin:0 0 24px;}
  .category-section{margin-bottom:30px;}
  .category-title{font-size:1.05rem;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--navy);border-bottom:1px solid var(--border);padding-bottom:8px;}
  .cat-icon{font-size:1.2rem;}
  .tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .tool-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s, transform .15s;position:relative;}
  .tool-card:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:#c7d1dc;}
  .tool-card.soon{opacity:.6;cursor:default;}
  .tool-card.soon:hover{box-shadow:none;transform:none;}
  .tool-card .icon{font-size:1.5rem;margin-bottom:6px;}
  .tool-name{font-weight:700;font-size:.95rem;margin-bottom:4px;}
  .tool-desc-short{font-size:.8rem;color:var(--muted);}
  .badge-soon{display:inline-block;margin-top:8px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#eef1f5;color:var(--muted);padding:3px 8px;border-radius:20px;}

  /* Widget d'accueil "Actions à venir" (prochaines actions saisies dans l'historique des échanges) */
  .actions-list{display:flex;flex-direction:column;gap:8px;}
  .action-row{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius);padding:12px 16px;text-decoration:none;color:var(--ink);font-size:.85rem;flex-wrap:wrap;transition:box-shadow .15s;}
  .action-row:hover{box-shadow:var(--shadow);}
  .action-date{font-weight:700;color:var(--navy);flex:0 0 auto;min-width:150px;}
  .action-client{font-weight:600;flex:0 0 auto;}
  .action-texte{color:var(--muted);}
  .action-row.soon{border-left-color:var(--accent);}
  .action-row.overdue{border-left-color:var(--danger);background:#fdf3ef;}
  .action-row.overdue .action-date{color:var(--danger);}

  /* Calculator page */
  .back-link{display:inline-block;margin-bottom:14px;font-size:.85rem;color:var(--navy-2);text-decoration:none;font-weight:600;}
  .calc-page h1{font-size:1.4rem;margin:0 0 6px;}
  .tool-desc{color:var(--muted);margin:0 0 20px;font-size:.92rem;}
  .calc-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 20px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
  .field[hidden]{display:none !important;}
  .checkbox-inline{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;color:var(--ink);cursor:pointer;}
  .checkbox-inline input{width:auto;}
  .form-section-title{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px;grid-column:1/-1;}
  .form-section-title:first-child{margin-top:0;}

  /* Comparaison de scénarios (composant générique, plusieurs calculateurs) */
  .scenarios-wrap{display:flex;gap:16px;overflow-x:auto;padding-bottom:6px;margin-bottom:4px;}
  .scenario-col{flex:1 1 280px;min-width:260px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .scenario-col-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .scenario-badge{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.03em;color:#fff;padding:4px 10px;border-radius:20px;}
  .scenario-badge-A{background:#122b46;}
  .scenario-badge-B{background:#9c7a3c;}
  .scenario-badge-C{background:#0f7a72;}
  .btn-scenario-remove{background:none;border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:.72rem;font-weight:600;color:var(--danger);cursor:pointer;font-family:inherit;}
  .btn-scenario-remove:hover{border-color:var(--danger);}
  .scenario-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;}
  .compare-table-wrap{overflow-x:auto;margin-bottom:20px;}
  .compare-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .compare-table th, .compare-table td{padding:12px 16px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap;}
  .compare-table th:first-child, .compare-table td:first-child{text-align:left;font-weight:600;white-space:normal;color:var(--ink);}
  .compare-table thead th{background:var(--bg);}
  .compare-table tr:last-child td{border-bottom:none;}
  .compare-value{font-size:1.05rem;font-weight:800;color:var(--navy);}
  .compare-diff{font-size:.78rem;font-weight:700;margin-top:2px;}
  .compare-diff-positive{color:var(--accent-2);}
  .compare-diff-negative{color:var(--danger);}
  .compare-diff-neutral{color:var(--muted);font-weight:600;}
  .compare-summaries{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
  .compare-summary-item{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .compare-summary-item .summary-sentence{flex:1 1 320px;margin:0;}

  @media (max-width:760px){
    .scenario-col{min-width:85vw;}
  }

  /* Client selector inside a calculator */
  .client-select-bar{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px;}
  .client-select-bar .field{margin-bottom:0;flex:1 1 260px;}
  .client-select-bar .link-new-client{font-size:.82rem;font-weight:600;color:var(--navy-2);text-decoration:none;white-space:nowrap;padding-bottom:10px;}

  /* Clients section */
  .client-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;flex-wrap:wrap;}
  .client-card-name{font-weight:700;font-size:1rem;}
  .client-card-meta{font-size:.82rem;color:var(--muted);margin-top:3px;}
  .client-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .client-tag{font-size:.7rem;font-weight:700;background:#eef1f5;color:var(--navy-2);padding:3px 9px;border-radius:20px;}
  .page-header-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}

  /* Onglets de la fiche client (Fiche client / Historique des échanges) */
  .client-tabs{display:flex;gap:22px;border-bottom:1px solid var(--border);margin:18px 0 22px;}
  .client-tab-btn{background:none;border:none;padding:10px 2px;font-size:.9rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit;}
  .client-tab-btn:hover{color:var(--navy);}
  .client-tab-btn.active{color:var(--navy);border-bottom-color:var(--accent);}

  /* Historique des échanges */
  .hist-form{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:18px;}
  .hist-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;}
  .hist-card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
  .hist-badge{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;color:#fff;white-space:nowrap;}
  .hist-badge-rdv_physique{background:var(--navy);}
  .hist-badge-appel{background:var(--accent);}
  .hist-badge-email{background:var(--accent-2);}
  .hist-badge-visio{background:var(--navy-2);}
  .hist-date{font-size:.82rem;color:var(--muted);font-weight:600;}
  .hist-card-actions{margin-left:auto;display:flex;gap:6px;}
  .hist-notes{font-size:.88rem;color:var(--ink);line-height:1.55;margin:0 0 8px;white-space:pre-wrap;}
  .hist-next-action{font-size:.82rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:6px;}
  .hist-sims{font-size:.8rem;color:var(--muted);}
  .hist-sims a{color:var(--accent-2);font-weight:600;text-decoration:none;}

  /* Foyer / actifs (composants réutilisables fiche client + bilan) */
  .foyer-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;}
  .foyer-header .foyer-adultes{font-weight:700;font-size:1rem;color:var(--navy);}
  .foyer-header .foyer-meta{font-size:.82rem;color:var(--muted);margin-top:4px;}
  .foyer-header .foyer-enfants{font-size:.82rem;color:var(--ink);margin-top:6px;}
  .repeat-list{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .repeat-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .repeat-row input[type=text], .repeat-row input[type=number], .repeat-row input[type=date], .repeat-row select{width:auto;flex:1 1 130px;padding:8px 10px;font-size:.85rem;}
  .repeat-row .checkbox-inline{flex:0 0 auto;font-size:.8rem;font-weight:600;white-space:nowrap;}
  .repeat-row .btn-danger{flex:0 0 auto;}
  .subsection-title{font-weight:700;font-size:.9rem;color:var(--navy);margin:22px 0 10px;}
  .subsection-title:first-child{margin-top:0;}
  .recap-table-wrap{overflow-x:auto;margin-top:10px;}
  .recap-table{width:100%;border-collapse:collapse;font-size:.83rem;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .recap-table th, .recap-table td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap;}
  .recap-table th:first-child, .recap-table td:first-child{text-align:left;font-weight:600;}
  .recap-table thead th{background:var(--navy);color:#fff;font-weight:700;}
  .recap-table tfoot td{font-weight:800;background:var(--bg);color:var(--navy);}
  .recap-chart-wrap{max-width:340px;margin:20px auto 0;}

  /* Simulateur d'avis d'imposition : catégories de revenus dépliables */
  .revenu-cat-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;}
  .revenu-cat-block > summary{cursor:pointer;padding:12px 16px;list-style:none;display:flex;align-items:center;gap:8px;}
  .revenu-cat-block > summary::-webkit-details-marker{display:none;}
  .revenu-cat-block > summary::before{content:"▸";display:inline-block;transition:transform .15s;color:var(--accent);}
  .revenu-cat-block[open] > summary::before{transform:rotate(90deg);}
  .revenu-cat-block > summary label{font-size:.9rem;cursor:pointer;}
  .revenu-cat-body{padding:0 16px 16px;}

  /* Bilan patrimonial */
  .wizard-steps{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap;}
  .wizard-step{flex:1 1 120px;text-align:center;padding:8px 6px;border-radius:8px;font-size:.75rem;font-weight:700;background:#eef1f5;color:var(--muted);}
  .wizard-step.active{background:var(--navy);color:#fff;}
  .wizard-step.done{background:#dfece9;color:var(--accent-2);}
  .wizard-nav{display:flex;justify-content:space-between;margin-top:22px;}
  .synthesis-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;}
  .synthesis-card h3{margin:0 0 10px;font-size:1rem;color:var(--navy);}
  .synthesis-kf{display:flex;flex-wrap:wrap;gap:10px;}
  .synthesis-kf-item{flex:1 1 160px;background:var(--bg);border-radius:8px;padding:10px 12px;}
  .synthesis-kf-item .value{font-weight:800;font-size:1.05rem;color:var(--navy);}
  .synthesis-kf-item .label{font-size:.68rem;text-transform:uppercase;color:var(--muted);margin-top:2px;}
  .synthesis-open-link{display:inline-block;margin-top:10px;font-size:.8rem;font-weight:600;color:var(--navy-2);text-decoration:none;}

  /* Cabinet / settings */
  .logo-preview{max-width:160px;max-height:80px;border:1px solid var(--border);border-radius:8px;padding:6px;background:#fff;display:block;margin-bottom:8px;}
  .brand-logo{max-height:34px;max-width:120px;display:block;border-radius:4px;}

  /* Bandeau d'erreur de stockage (quota localStorage dépassé) */
  .storage-error-banner{position:fixed;top:0;left:0;right:0;z-index:9999;background:#fbeceb;border-bottom:2px solid #d9534f;color:#7a2320;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:.85rem;line-height:1.5;box-shadow:var(--shadow);}
  .storage-error-banner strong{color:#7a2320;}
  .storage-error-banner button{flex:none;background:none;border:1px solid #d9534f;color:#7a2320;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:.85rem;line-height:1;}
  .storage-error-banner button:hover{background:#d9534f;color:#fff;}
  body:has(.storage-error-banner) .topbar{margin-top:48px;}
  @media (max-width:700px){ .storage-error-banner{flex-direction:column;align-items:flex-start;} body:has(.storage-error-banner) .topbar{margin-top:88px;} }

  /* Legal footer */
  .backup-card{margin-top:20px;padding:22px;}
  .backup-title{font-size:1rem;margin:0 0 8px;color:var(--navy);}
  .backup-desc{margin:0 0 16px;}
  .backup-actions{display:flex;gap:10px;flex-wrap:wrap;}

  .legal-footer{max-width:960px;margin:0 auto;padding:18px 20px 40px;font-size:.72rem;color:var(--muted);text-align:center;line-height:1.5;}
  .legal-footer a{color:var(--navy-2);font-weight:600;text-decoration:none;}
  body.presenting .legal-footer{display:none;}

  /* Intérêts composés (Finary-style, thème clair) */
  .ic-layout{display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start;}
  @media (max-width:800px){ .ic-layout{grid-template-columns:1fr;} }
  .ic-inputs-card{padding:22px;}
  .ic-field{margin-bottom:22px;}
  .ic-field:last-child{margin-bottom:0;}
  .ic-field-label{display:flex;align-items:center;font-size:.85rem;font-weight:700;color:var(--ink);margin-bottom:9px;}
  .info-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#eef1f5;color:var(--muted);font-size:.68rem;font-weight:700;cursor:pointer;position:relative;margin-left:6px;flex:none;}
  .info-icon:hover, .info-icon.open{background:var(--navy);color:#fff;}
  .info-tooltip{display:none;position:absolute;bottom:135%;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 11px;border-radius:8px;font-size:.72rem;font-weight:400;line-height:1.4;width:210px;z-index:20;box-shadow:var(--shadow);text-align:left;}
  .info-tooltip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:var(--navy);}
  .info-icon.open .info-tooltip{display:block;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper-btn{width:38px;height:42px;flex:none;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--navy);font-size:1.15rem;font-weight:700;cursor:pointer;line-height:1;}
  .stepper-btn:hover{border-color:var(--navy);background:#f7f9fb;}
  .stepper .input-suffix{flex:1 1 auto;}
  .stepper input{text-align:center;}
  .ic-results-card{padding:28px 26px;}
  .ic-result{text-align:center;}
  .ic-final-value{font-size:2.8rem;font-weight:800;color:var(--navy);line-height:1.1;letter-spacing:-.01em;}
  .ic-final-sub{color:var(--muted);font-size:.92rem;margin-top:4px;margin-bottom:18px;}
  .ic-badges{display:flex;justify-content:center;gap:14px;margin-bottom:24px;flex-wrap:wrap;}
  .ic-badge{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font-size:.85rem;font-weight:700;color:var(--ink);}
  .ic-badge-dot{width:10px;height:10px;border-radius:50%;flex:none;}
  .ic-badge-dot.interets{background:var(--accent-2);}
  .ic-badge-dot.versements{background:var(--navy);}
  .ic-chart-wrap{max-width:100%;margin:8px 0 0;}
  .ic-sentence{margin-top:22px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;font-size:.9rem;color:var(--ink);line-height:1.55;}
  .ic-sentence strong{color:var(--navy);}
  body.presenting .ic-layout{grid-template-columns:1fr;}
  body.presenting .ic-results-card{border:none;box-shadow:none;padding:0;}
  body.presenting .ic-final-value{font-size:5.5rem;}
  body.presenting .ic-final-sub{font-size:1.15rem;}
  body.presenting .ic-badges{transform:scale(1.15);margin-top:6px;}
  body.presenting .ic-sentence{font-size:1.15rem;text-align:center;max-width:720px;margin:26px auto 0;}

  /* Revenus complémentaires (rente perpétuelle vs. capital épuisé sur durée choisie) */
  .revenus-comp-title{font-size:1rem;margin:0 0 6px;color:var(--navy);}
  .revenus-comp-intro{font-size:.85rem;color:var(--muted);margin:0 0 14px;line-height:1.5;}
  .revenus-comp-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .revenus-comp-tab{background:#fff;border:1px solid var(--border);border-radius:20px;padding:7px 16px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit;}
  .revenus-comp-tab:hover{border-color:var(--navy);color:var(--navy);}
  .revenus-comp-tab.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .revenus-comp-cols{display:flex;gap:16px;flex-wrap:wrap;}
  .revenus-comp-col{flex:1 1 260px;min-width:230px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;opacity:.6;}
  .revenus-comp-col.active{opacity:1;border-color:var(--navy);}
  .revenus-comp-value{font-size:1.6rem;font-weight:800;color:var(--navy);line-height:1.1;}
  .revenus-comp-value-sub{font-size:.8rem;font-weight:600;color:var(--muted);margin-left:4px;}
  .revenus-comp-label{font-size:.78rem;color:var(--muted);margin-top:4px;font-weight:600;}
  .revenus-comp-sentence{margin-top:12px;font-size:.85rem;color:var(--ink);line-height:1.5;}
  .revenus-comp-sentence strong{color:var(--navy);}
  .revenus-comp-duree-field{margin-top:14px;}
  .revenus-comp-duree-field label{display:block;font-size:.78rem;font-weight:700;color:var(--ink);margin-bottom:8px;}
  .revenus-comp-duree-row{display:flex;align-items:center;gap:12px;}
  .revenus-comp-duree-row input[type=range]{flex:1 1 auto;accent-color:var(--navy);}
  .revenus-comp-duree-input{flex:0 0 90px;}
  .revenus-comp-duree-input input{text-align:center;}
  .revenus-comp-chart-wrap{margin-top:16px;}
  body.presenting .revenus-comp-cols{max-width:820px;margin:0 auto;}
  body.presenting .revenus-comp-value{font-size:2.2rem;}
  .reference-panel{background:#fbf3e7;border:1px solid #eadfc7;border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;font-size:.85rem;color:#5b4a26;}
  .reference-panel h3{margin:0 0 8px;font-size:.9rem;color:#7a5b1c;}
  .reference-panel table{width:100%;border-collapse:collapse;margin-top:8px;}
  .reference-panel td{padding:5px 8px;border-bottom:1px solid #eadfc7;}
  .reference-panel td:nth-child(2){text-align:right;font-weight:700;white-space:nowrap;}

  /* Export complet "avis d'imposition" — garde-fous anti-confusion avec un document officiel obligatoires :
     bandeau + filigrane "SIMULATION" sur chaque page, aucune reprise d'éléments visuels administratifs.
     Typographie/mise en page soignées (cartes de synthèse, sections numérotées, tableaux zébrés) tout en

<script>
(function(){
  "use strict";

  /* ============================ Utilities ============================ */
  var euro = new Intl.NumberFormat("fr-FR", {style:"currency", currency:"EUR", maximumFractionDigits:0});
  var euro2 = new Intl.NumberFormat("fr-FR", {style:"currency", currency:"EUR", maximumFractionDigits:2});
  function pct(v, d){ d = (d===undefined?2:d); return v.toLocaleString("fr-FR", {minimumFractionDigits:d, maximumFractionDigits:d}) + " %"; }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function getLegalMention(){
    return "CGP Pro est un outil de simulation à but informatif : il ne remplace pas un conseil personnalisé et les résultats présentés sont indicatifs.";
  }

  /* ============================ Local storage ============================ */
  // Écriture protégée : si le stockage du navigateur est plein (quota dépassé) ou indisponible,
  // l'exception est interceptée et un bandeau visible et persistant prévient l'utilisateur au lieu
  // d'un échec silencieux qui laisserait croire que la donnée a bien été enregistrée alors qu'elle
  // vient d'être perdue.
  function persistToStorage(key, value){
    try{
      localStorage.setItem(key, value);
      return true;
    } catch(e){
      showStorageErrorBanner();
      return false;
    }
  }
  function showStorageErrorBanner(){
    if(document.getElementById("storageErrorBanner")) return;
    var banner = document.createElement("div");
    banner.id = "storageErrorBanner";
    banner.className = "storage-error-banner";
    banner.innerHTML =
      '<span>⚠ Échec de l\'enregistrement : l\'espace de stockage du navigateur est plein (ou indisponible). ' +
      'La dernière modification n\'a <strong>pas</strong> été sauvegardée. Libérez de la place — réduisez la taille du logo dans Paramètres, exportez puis supprimez d\'anciennes fiches — et réessayez.</span>' +
      '<button type="button" id="storageErrorDismiss" aria-label="Fermer">✕</button>';
    document.body.appendChild(banner);
    document.getElementById("storageErrorDismiss").addEventListener("click", function(){ banner.remove(); });
  }

  var STORAGE_KEY = "cgppro_simulations_v1";
  function getSimulations(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveSimulation(entry){
    var all = getSimulations();
    all.unshift(entry);
    return persistToStorage(STORAGE_KEY, JSON.stringify(all));
  }
  function deleteSimulation(id){
    var all = getSimulations().filter(function(s){ return s.id !== id; });
    return persistToStorage(STORAGE_KEY, JSON.stringify(all));
  }

  /* ============================ Clients ============================ */
  var CLIENTS_KEY = "cgppro_clients_v1";

  var STATUTS_COUPLE = [
    {value:"celibataire", label:"Célibataire"},
    {value:"marie", label:"Marié(e)"},
    {value:"pacse", label:"Pacsé(e)"},
    {value:"concubinage", label:"Concubinage"}
  ];
  var REGIMES_MARIAGE = [
    {value:"communaute", label:"Communauté (légale ou universelle)"},
    {value:"separation_biens", label:"Séparation de biens"}
  ];
  var REGIMES_PACS = [
    {value:"separation_patrimoines", label:"Séparation de patrimoines"},
    {value:"indivision", label:"Indivision"}
  ];
  var CATEGORIES_ACTIF = [
    {value:"usage", label:"Biens d'usage"},
    {value:"immobilier_locatif", label:"Immobilier locatif"},
    {value:"assurance_vie", label:"Assurance-vie"},
    {value:"epargne_retraite", label:"Épargne retraite et salariale"},
    {value:"epargne_long_terme", label:"Épargne long terme"},
    {value:"disponibilites", label:"Disponibilités"},
    {value:"autres", label:"Autres"}
  ];
  var MODES_DETENTION = [
    {value:"PP", label:"Pleine propriété"},
    {value:"NP", label:"Nue-propriété"},
    {value:"USF", label:"Usufruit"}
  ];
  function labelFromList(list, value){ var f = list.filter(function(o){ return o.value===value; })[0]; return f ? f.label : value; }

  var ECHANGE_TYPES = [
    {value:"rdv_physique", label:"RDV physique", icon:"🤝"},
    {value:"appel", label:"Appel téléphonique", icon:"📞"},
    {value:"email", label:"Email", icon:"✉️"},
    {value:"visio", label:"Visioconférence", icon:"💻"}
  ];
  function formatDateFr(isoDate){
    if(!isoDate) return "—";
    var d = new Date(isoDate + "T00:00:00");
    if(isNaN(d.getTime())) return "—";
    return d.toLocaleDateString("fr-FR", {year:"numeric", month:"long", day:"numeric"});
  }

  // Migration douce : complète en mémoire (sans réécriture immédiate du localStorage) les fiches créées
  // avant l'ajout du modèle foyer/actifs. Un ancien client sans "adultes" devient un foyer à un adulte
  // reprenant son prénom/nom/âge ; les actifs sans propriétaire assigné basculent sur l'adulte 1.
  function normalizeClient(c){
    if(!c.adultes || !c.adultes.length){
      c.adultes = [{prenom:c.prenom||"", nom:c.nom||"", age:(c.age!==undefined?c.age:null), profession:"", revenusPropres:0}];
    }
    if(!c.enfants) c.enfants = [];
    if(!c.actifs) c.actifs = [];
    c.actifs.forEach(function(a){ if(!a.proprietaire) a.proprietaire = "adulte1"; });
    if(!c.statutCouple) c.statutCouple = "celibataire";
    if(!c.revenusCategorises) c.revenusCategorises = defaultRevenusCategorises();
    if(!c.historique) c.historique = [];
    return c;
  }

  function getClients(){
    try{ return (JSON.parse(localStorage.getItem(CLIENTS_KEY)) || []).map(normalizeClient); }
    catch(e){ return []; }
  }
  function getClientById(id){ return getClients().filter(function(c){ return c.id === id; })[0] || null; }
  function saveClient(client){
    var all = getClients();
    var idx = all.findIndex(function(c){ return c.id === client.id; });
    if(idx >= 0){ all[idx] = client; } else { all.unshift(client); }
    return persistToStorage(CLIENTS_KEY, JSON.stringify(all));
  }
  function deleteClient(id){
    var all = getClients().filter(function(c){ return c.id !== id; });
    return persistToStorage(CLIENTS_KEY, JSON.stringify(all));
  }
  function clientFullName(c){
    var noms = (c.adultes||[]).map(function(a){ return (a.prenom||"")+" "+(a.nom||""); }).map(function(s){ return s.trim(); }).filter(Boolean);
    if(noms.length) return noms.join(" & ");

  }

  // Agrège les actifs d'un client en tableau croisé propriétaire × catégorie, avec totaux ligne/colonne.
  function computeRecapPatrimonial(client){
    var hasAdulte2 = !!(client.adultes && client.adultes[1]);
    var owners = hasAdulte2 ? ["adulte1","adulte2","indivision"] : ["adulte1","indivision"];
    var ownerLabels = {
      adulte1: (client.adultes[0] && client.adultes[0].prenom) || "Adulte 1",
      adulte2: hasAdulte2 ? ((client.adultes[1].prenom) || "Adulte 2") : "Adulte 2",
      indivision: "Indivision"
    };
    var actifs = client.actifs || [];
    var rows = CATEGORIES_ACTIF.map(function(cat){
      var row = {categorie: cat.label, values:{}, total:0};
      owners.forEach(function(o){
        var sum = actifs.filter(function(a){ return a.categorie===cat.value && a.proprietaire===o; })
          .reduce(function(s,a){ return s+(parseFloat(a.montant)||0); }, 0);
        row.values[o] = sum;
        row.total += sum;
      });
      return row;
    });
    var colTotals = {};
    owners.forEach(function(o){ colTotals[o] = rows.reduce(function(s,r){ return s+r.values[o]; }, 0); });
    var grandTotal = rows.reduce(function(s,r){ return s+r.total; }, 0);
    return {owners:owners, ownerLabels:ownerLabels, rows:rows, colTotals:colTotals, grandTotal:grandTotal};
  }

  /* ============================ Shared fiscal helpers ============================ */
  // Calcule un impôt par tranches marginales. brackets = [{upTo:N, rate:r}, ..., {upTo:Infinity, rate:r}]
  // upTo est la borne haute (exclusive du haut de tranche suivant), cumulative depuis 0.
  function computeBaremeProgressif(base, brackets){
    var impot = 0, precedent = 0;
    for(var i=0; i<brackets.length; i++){
      var b = brackets[i];
      if(base <= precedent) break;
      var trancheHaute = Math.min(base, b.upTo);
      impot += Math.max(0, trancheHaute - precedent) * b.rate;
      precedent = b.upTo;
    }
    return impot;
  }

  // Modèle canonique de la ventilation des revenus par catégorie fiscale — utilisé à la fois par le

  function defaultRevenusCategorises(){

  // Seuils/taux des abattements par catégorie de revenu, barème 2026 (revenus 2025) — voir referenceHTML
  // du Simulateur d'avis d'imposition pour les sources et le détail des articles du CGI.
  var ABATTEMENTS_CATEGORIES = {
    salairesPlancher:509, salairesPlafond:14555,
    pensionsPlancher:454, pensionsPlafond:4439,
    microFoncierTaux:0.30,
    microBicVenteTaux:0.71, microBicPrestationTaux:0.50, microBicPlancher:305,
    microBncTaux:0.34, microBncPlancher:305,
    dividendesAbattementBareme:0.40,
    pfuIrTaux:0.128, psTaux:0.172
  };

  // Calcule, à partir d'une ventilation de revenus par catégorie (modèle canonique ci-dessus), le revenu
  // net imposable total soumis au barème progressif, l'assiette et le montant du PFU/prélèvements sociaux
  // sur les revenus de capitaux (calculés séparément, ce sont deux impositions distinctes), et le détail
  // ligne à ligne pour affichage ("Revenus déclarés"). Fonction unique réutilisée par le Simulateur d'avis
  // d'imposition et par le calcul du statut TNS/bénéfice imposable pour le plafond PER (Bilan patrimonial).
  function computeRevenusCategorises(cat){
    var A = ABATTEMENTS_CATEGORIES;
    var lignes = [];
    var revenuNetImposableBareme = 0;
    var pfuAssiette = 0;
    var psSurCapitaux = 0;
    var netBicTns = 0, netBncTns = 0, netSalaires = 0, netPensions = 0;

    if(cat.salaires && cat.salaires.actif){
      var brutS = cat.salaires.montantBrut||0, netS;
      if(cat.salaires.fraisReels){
        netS = Math.max(0, brutS - (cat.salaires.montantFraisReels||0));
        lignes.push({label:"Revenus déclarés — Traitements et salaires (frais réels)", value: euro.format(netS) + " net (brut " + euro.format(brutS) + ")"});
      } else {
        var abatS = Math.min(A.salairesPlafond, Math.max(A.salairesPlancher, brutS*0.10));
        netS = Math.max(0, brutS - Math.min(abatS, brutS));
        lignes.push({label:"Revenus déclarés — Traitements et salaires (abattement 10%)", value: euro.format(netS) + " net (brut " + euro.format(brutS) + ")"});
      }
      revenuNetImposableBareme += netS;
      netSalaires = netS;
    }
    if(cat.pensions && cat.pensions.actif){
      var brutP = cat.pensions.montant||0;
      var abatP = Math.min(A.pensionsPlafond, Math.max(A.pensionsPlancher, brutP*0.10));
      var netP = Math.max(0, brutP - Math.min(abatP, brutP));
      revenuNetImposableBareme += netP;
      netPensions = netP;
      lignes.push({label:"Revenus déclarés — Pensions et retraites (abattement 10%)", value: euro.format(netP) + " net (brut " + euro.format(brutP) + ")"});
    }
    if(cat.fonciers && cat.fonciers.actif){
      var brutF = cat.fonciers.montantBrut||0, netF;
      if(cat.fonciers.regime === "micro"){
        netF = brutF*(1-A.microFoncierTaux);
        lignes.push({label:"Revenus déclarés — Revenus fonciers (micro-foncier, abattement 30%)", value: euro.format(netF) + " net (brut " + euro.format(brutF) + ")"});
      } else {
        netF = brutF - (cat.fonciers.charges||0);
        lignes.push({label:"Revenus déclarés — Revenus fonciers (régime réel)", value: euro.format(netF) + " net (brut " + euro.format(brutF) + " − charges " + euro.format(cat.fonciers.charges||0) + ")"});
      }
      revenuNetImposableBareme += netF;
    }
    if(cat.bic && cat.bic.actif){
      var brutBic = cat.bic.montantBrut||0, netBic;
      if(cat.bic.regime === "micro"){
        var tauxBic = cat.bic.typeActivite === "vente" ? A.microBicVenteTaux : A.microBicPrestationTaux;
        var abatBic = Math.max(A.microBicPlancher, brutBic*tauxBic);
        netBic = Math.max(0, brutBic - Math.min(abatBic, brutBic));
        lignes.push({label:"Revenus déclarés — BIC (micro-BIC, " + (cat.bic.typeActivite==="vente"?"71%":"50%") + ")", value: euro.format(netBic) + " net (brut " + euro.format(brutBic) + ")"});
      } else {
        netBic = Math.max(0, brutBic - (cat.bic.charges||0));
        lignes.push({label:"Revenus déclarés — BIC (régime réel)", value: euro.format(netBic) + " net (brut " + euro.format(brutBic) + " − charges " + euro.format(cat.bic.charges||0) + ")"});
      }
      revenuNetImposableBareme += netBic;
      netBicTns = netBic;
    }
    if(cat.bnc && cat.bnc.actif){
      var brutBnc = cat.bnc.montantBrut||0, netBnc;
      if(cat.bnc.regime === "micro"){
        var abatBnc = Math.max(A.microBncPlancher, brutBnc*A.microBncTaux);
        netBnc = Math.max(0, brutBnc - Math.min(abatBnc, brutBnc));
        lignes.push({label:"Revenus déclarés — BNC (micro-BNC, 34%)", value: euro.format(netBnc) + " net (brut " + euro.format(brutBnc) + ")"});
      } else {
        netBnc = Math.max(0, brutBnc - (cat.bnc.charges||0));
        lignes.push({label:"Revenus déclarés — BNC (déclaration contrôlée)", value: euro.format(netBnc) + " net (brut " + euro.format(brutBnc) + " − charges " + euro.format(cat.bnc.charges||0) + ")"});
      }
      revenuNetImposableBareme += netBnc;
      netBncTns = netBnc;
    }
    if(cat.rcm && cat.rcm.actif){
      var div = cat.rcm.dividendes||0, inte = cat.rcm.interets||0, totalRcm = div+inte;
      psSurCapitaux += totalRcm*A.psTaux;
      if(cat.rcm.optionBareme){
        var netDiv = div*(1-A.dividendesAbattementBareme);
        revenuNetImposableBareme += netDiv + inte;
        lignes.push({label:"Revenus déclarés — Capitaux mobiliers (option barème, dividendes abattus 40%)", value: euro.format(netDiv+inte) + " net (brut " + euro.format(totalRcm) + ")"});
      } else {
        pfuAssiette += totalRcm;
        lignes.push({label:"Revenus déclarés — Capitaux mobiliers (PFU 30%)", value: euro.format(totalRcm)});
      }
    }
    if(cat.plusValues && cat.plusValues.actif){
      var mtPv = cat.plusValues.montant||0;
      psSurCapitaux += mtPv*A.psTaux;
      if(cat.plusValues.optionBareme){
        revenuNetImposableBareme += mtPv;
        lignes.push({label:"Revenus déclarés — Plus-values mobilières (option barème)", value: euro.format(mtPv)});
      } else {
        pfuAssiette += mtPv;
        lignes.push({label:"Revenus déclarés — Plus-values mobilières (PFU 30%)", value: euro.format(mtPv)});
      }
    }

    var irPfu = pfuAssiette*A.pfuIrTaux;
    var totalPfuEtSocial = irPfu + psSurCapitaux;

    return {
      lignes: lignes,
      revenuNetImposableBareme: revenuNetImposableBareme,
      pfuAssiette: pfuAssiette,
      irPfu: irPfu,
      psSurCapitaux: psSurCapitaux,
      totalPfuEtSocial: totalPfuEtSocial,
      netBicTns: netBicTns,
      netBncTns: netBncTns,
      netSalaires: netSalaires,
      netPensions: netPensions,
      isTns: !!((cat.bic && cat.bic.actif) || (cat.bnc && cat.bnc.actif))
    };
  }

  // Fiscalité d'un rachat d'assurance-vie (PS + IR/PFU), régime des versements post-2017 (Art. 125-0 A CGI).
  // Partagée entre le calculateur "Fiscalité assurance-vie" et le comparateur "AV vs PER vs CTO".
  function computeFiscaliteAV(gains, anciennete, situationFamiliale, totalVersements, regimeChoisi, tmi){
    var ps = gains*0.172;
    var ir = 0, abattementApplique = 0, tauxAppliqueLabel = "";

    if(anciennete < 8){
      if(regimeChoisi === "pfu"){ ir = gains*0.128; tauxAppliqueLabel = "PFU 12,8 % sur la totalité des gains"; }
      else { ir = gains*(tmi/100); tauxAppliqueLabel = "Barème progressif à " + tmi + " % sur la totalité des gains"; }
    } else {
      var abattement = situationFamiliale === "couple" ? 9200 : 4600;
      abattementApplique = Math.min(abattement, gains);
      var gainsApresAbat = Math.max(0, gains-abattement);
      if(regimeChoisi === "bareme"){
        ir = gainsApresAbat*(tmi/100);
        tauxAppliqueLabel = "Barème progressif à " + tmi + " % sur les gains après abattement";
      } else {
        var propReduit = totalVersements>0 ? Math.min(1, 150000/totalVersements) : 1;
        var gainsReduit = gainsApresAbat*propReduit;
        var gainsNormal = gainsApresAbat-gainsReduit;
        ir = gainsReduit*0.075 + gainsNormal*0.128;
        tauxAppliqueLabel = gainsNormal>0
          ? "PFU 7,5 % jusqu'à 150 000 € de versements, 12,8 % au-delà, sur les gains après abattement"
          : "PFU taux réduit 7,5 % sur les gains après abattement (versements sous le seuil de 150 000 €)";
      }
    }
    return {ps:ps, ir:ir, total:ps+ir, abattementApplique:abattementApplique, tauxAppliqueLabel:tauxAppliqueLabel};
  }

        var revenuPondere = inputs.revenuNet + inputs.revenusLocatifs*0.7;
        var mensualiteMax = revenuPondere*(inputs.tauxEndettement/100) - inputs.chargesExistantes;

        if(mensualiteMax <= 0){
          return {
            keyFigures:[
              {label:"Mensualité maximale", value: euro.format(0)},
              {label:"Montant empruntable", value: euro.format(0)},
              {label:"Budget total d'achat possible", value: euro.format(Math.max(0, inputs.apport))}

        var r = inputs.tauxInteret/100/12;
        var n = inputs.dureeAnnees*12;
        var mensualiteAssurance = inputs.capitalEmprunte*(inputs.tauxAssurance/100/12);
        var mensualiteCredit = r>0 ? inputs.capitalEmprunte*r/(1-Math.pow(1+r,-n)) : inputs.capitalEmprunte/n;
        var mensualiteTotale = mensualiteCredit + mensualiteAssurance;

        // Échéancier mensuel complet, agrégé ensuite par année pour l'affichage.
        var solde = inputs.capitalEmprunte;
        var annees = [];
        var capitalAnnee = 0, interetsAnnee = 0;
        for(var m=1; m<=n; m++){
          var interetMois = solde*r;
          var capitalMois = mensualiteCredit - interetMois;
          solde = Math.max(0, solde - capitalMois);
          capitalAnnee += capitalMois;
          interetsAnnee += interetMois;
          if(m % 12 === 0 || m === n){
            annees.push({annee: Math.ceil(m/12), capitalRembourse: capitalAnnee, interetsPayes: interetsAnnee, resteDu: solde});

        var totalAssurance = mensualiteAssurance*n;
        var coutTotalCredit = totalInterets + totalAssurance;

        var details = annees.filter(function(a){ return a.annee % 5 === 0 || a.annee === annees.length; }).map(function(a){

    /* ---------- 9. Comparateur taux fixe vs variable ---------- */
    {
      id:"taux-fixe-variable", category:"financement", status:"ready", icon:"⚖️",
      name:"Comparateur taux fixe vs variable",
      desc:"Compare le coût total d'un prêt à taux fixe et d'un prêt à taux variable capé, selon une hypothèse d'évolution annuelle du taux (durée conservée, mensualité recalculée chaque année).",
      fields:[
        {id:"capitalEmprunte", label:"Capital emprunté", type:"number", suffix:"€", default:200000, step:1000},
        {id:"dureeAnnees", label:"Durée du prêt", type:"number", suffix:"ans", default:20, step:1},
        {id:"tauxFixe", label:"Taux fixe proposé", type:"number", suffix:"%", default:3.9, step:0.01},
        {id:"tauxVariableInitial", label:"Taux variable initial", type:"number", suffix:"%", default:3.3, step:0.01},
        {id:"variationAnnuelle", label:"Hypothèse de variation annuelle du taux variable", type:"number", suffix:"pt/an", default:0.3, step:0.05, help:"Hypothèse de votre choix (le marché peut aussi bien baisser) : le taux variable réel dépend de l'indice de référence (ex. Euribor), imprévisible."},
        {id:"tauxPlafondCap", label:"Taux plafond (cap)", type:"number", suffix:"%", default:5.3, step:0.1, help:"Plafond contractuel du taux variable (prêt \"capé\")."}
      ],
      compute:function(inputs){
        var n = inputs.dureeAnnees*12;
        var rFixe = inputs.tauxFixe/100/12;
        var mensualiteFixe = rFixe>0 ? inputs.capitalEmprunte*rFixe/(1-Math.pow(1+rFixe,-n)) : inputs.capitalEmprunte/n;
        var totalFixe = mensualiteFixe*n;

        // Prêt variable capé, révisé annuellement : mensualité recalculée chaque année sur le capital restant dû et la durée restante.
        var solde = inputs.capitalEmprunte;
        var totalVariable = 0;
        var mensualitesParAnnee = [];
        var tauxParAnnee = [];
        for(var annee=0; annee<inputs.dureeAnnees; annee++){
          var tauxAnnuel = Math.min(inputs.tauxPlafondCap, inputs.tauxVariableInitial + inputs.variationAnnuelle*annee);
          var rAnnee = tauxAnnuel/100/12;
          var moisRestants = n - annee*12;
          var mensualiteAnnee = rAnnee>0 ? solde*rAnnee/(1-Math.pow(1+rAnnee,-moisRestants)) : solde/moisRestants;
          mensualitesParAnnee.push(mensualiteAnnee);
          tauxParAnnee.push(tauxAnnuel);
          for(var m=0; m<12 && solde>0.01; m++){
            var interet = solde*rAnnee;
            var capitalRembourse = mensualiteAnnee - interet;
            solde = Math.max(0, solde - capitalRembourse);
            totalVariable += mensualiteAnnee;
          }
        }

        var ecart = totalVariable - totalFixe;

        return {
          keyFigures:[
            {label:"Coût total — taux fixe", value: euro.format(totalFixe)},
            {label:"Coût total — taux variable (hypothèse)", value: euro.format(totalVariable)},
            {label:"Écart (variable − fixe)", value: (ecart>=0?"+":"") + euro.format(ecart)}
          ],
          details:[
            {label:"Mensualité fixe (constante)", value: euro2.format(mensualiteFixe)},
            {label:"Mensualité variable — 1ère année", value: euro2.format(mensualitesParAnnee[0])},
            {label:"Mensualité variable — dernière année", value: euro2.format(mensualitesParAnnee[mensualitesParAnnee.length-1])},
            {label:"Taux variable atteint le plafond après", value: (tauxParAnnee.filter(function(t){return t<inputs.tauxPlafondCap;}).length) + " an(s)"}
          ],
          chart:{
            type:"line",
            labels: Array.from({length: inputs.dureeAnnees}, function(_,i){ return "An " + (i+1); }),
            datasets:[
              {label:"Mensualité taux fixe", data: mensualitesParAnnee.map(function(){ return Math.round(mensualiteFixe); }), borderColor:"#122b46", backgroundColor:"rgba(18,43,70,0.1)", tension:0},
              {label:"Mensualité taux variable (hypothèse)", data: mensualitesParAnnee.map(function(m){ return Math.round(m); }), borderColor:"#b3422c", backgroundColor:"rgba(179,66,44,0.1)", tension:0}
            ]
          },
          warnings:["Le taux variable réel dépend de l'évolution d'un indice de marché (ex. Euribor), qui ne peut pas être prédit : ceci est une simulation sous hypothèse, pas une prévision. Le taux fixe élimine ce risque mais part généralement d'un niveau plus élevé que le taux variable initial."]
        };
      }

    /* ---------- 12. Simulateur SCPI ---------- */
    {
      id:"scpi", category:"immobilier", status:"ready", icon:"🏢",
      name:"Simulateur SCPI",
      desc:"Projette le revenu (net de fiscalité en détention directe) d'un investissement en SCPI selon le mode de détention, à partir d'une hypothèse de taux de distribution.",
      fields:[
        {id:"montantInvesti", label:"Montant investi", type:"number", suffix:"€", default:100000, step:1000},
        {id:"tauxDistribution", label:"Taux de distribution annuel (hypothèse)", type:"number", suffix:"%", default:4.5, step:0.1, help:"Taux cible/historique de la SCPI : ce n'est jamais une garantie, il varie chaque année."},
        {id:"modeDetention", label:"Mode de détention", type:"select", default:"direct", options:[
          {value:"direct", label:"Détention directe (revenus fonciers)"},
          {value:"assurance-vie", label:"Via assurance-vie (unités de compte)"},
          {value:"credit", label:"À crédit (détention directe)"}
        ]},
        {id:"tmi", label:"Tranche marginale d'imposition (détention directe)", type:"number", suffix:"%", default:30, step:1, clientField:"tmi"},
        {id:"tauxCredit", label:"Taux du crédit (si achat à crédit)", type:"number", suffix:"%", default:3.9, step:0.01},
        {id:"dureeAnnees", label:"Durée de projection", type:"number", suffix:"ans", default:10, step:1}
      ],
      compute:function(inputs){
        var revenuAnnuelBrut = inputs.montantInvesti*inputs.tauxDistribution/100;
        var warnings = ["Le taux de distribution est une hypothèse (historique ou cible de la SCPI), non garantie : le rendement réel peut être inférieur, y compris négatif en cas de baisse de la valeur des parts. SCPI = placement long terme, peu liquide, avec risque de perte en capital."];

        if(inputs.modeDetention === "assurance-vie"){
          var cumulBrut = revenuAnnuelBrut*inputs.dureeAnnees;
          warnings.push("Au sein d'une assurance-vie, les revenus de SCPI ne sont pas fiscalisés annuellement : la fiscalité (PFU ou barème + prélèvements sociaux) ne s'applique qu'au rachat, sur les gains — voir le calculateur \"Fiscalité assurance-vie\".");
          return {
            keyFigures:[
              {label:"Revenu annuel brut estimé", value: euro.format(revenuAnnuelBrut)},
              {label:"Revenus cumulés sur " + inputs.dureeAnnees + " ans (non fiscalisés en détention)", value: euro.format(cumulBrut)},
              {label:"Revenu mensuel brut moyen", value: euro2.format(revenuAnnuelBrut/12)}
            ],
            details:[{label:"Montant investi", value: euro.format(inputs.montantInvesti)}],
            chart:null,
            warnings: warnings
          };
        }

        var revenuNetFiscal = revenuAnnuelBrut*(1-inputs.tmi/100-0.172);
        var cumulNet = revenuNetFiscal*inputs.dureeAnnees;

        if(inputs.modeDetention === "credit"){
          var r = inputs.tauxCredit/100/12;
          var n = inputs.dureeAnnees*12;
          var mensualiteCredit = r>0 ? inputs.montantInvesti*r/(1-Math.pow(1+r,-n)) : inputs.montantInvesti/n;
          var mensualiteCreditAnnuelle = mensualiteCredit*12;
          var cashflowAnnuelAvantImpot = revenuAnnuelBrut - mensualiteCreditAnnuelle;
          var cashflowAnnuelApresImpot = revenuNetFiscal - mensualiteCreditAnnuelle;
          warnings.push("Les intérêts d'emprunt sont en réalité déductibles des revenus fonciers (effet de levier fiscal), ce qui réduit l'impôt réel : non modélisé ici par simplification (impôt calculé comme en détention directe sans effet de levier).");
          return {
            keyFigures:[
              {label:"Cashflow mensuel avant impôt", value: euro2.format(cashflowAnnuelAvantImpot/12)},
              {label:"Cashflow mensuel après impôt (hors levier fiscal)", value: euro2.format(cashflowAnnuelApresImpot/12)},
              {label:"Mensualité de crédit", value: euro2.format(mensualiteCredit)}
            ],
            details:[
              {label:"Revenu annuel brut estimé", value: euro.format(revenuAnnuelBrut)},
              {label:"Revenu net de fiscalité (avant crédit)", value: euro.format(revenuNetFiscal)},
              {label:"Coût annuel du crédit", value: euro.format(mensualiteCreditAnnuelle)}
            ],
            chart:{
              type:"bar",
              labels:["Revenu annuel brut","Coût annuel du crédit","Cashflow net (hors levier fiscal)"],
              datasets:[{label:"€ / an", data:[Math.round(revenuAnnuelBrut), Math.round(mensualiteCreditAnnuelle), Math.round(cashflowAnnuelApresImpot)], backgroundColor:["#122b46","#b3422c","#0f7a72"]}]
            },
            warnings: warnings
          };
        }

        return {
          keyFigures:[
            {label:"Revenu net annuel estimé", value: euro.format(revenuNetFiscal)},
            {label:"Revenus nets cumulés sur " + inputs.dureeAnnees + " ans", value: euro.format(cumulNet)},
            {label:"Revenu net mensuel moyen", value: euro2.format(revenuNetFiscal/12)}
          ],
          details:[
            {label:"Revenu annuel brut estimé", value: euro.format(revenuAnnuelBrut)},
            {label:"Fiscalité appliquée (TMI + prélèvements sociaux 17,2%)", value: pct(inputs.tmi+17.2)},
            {label:"Montant investi", value: euro.format(inputs.montantInvesti)}
          ],
          chart:{
            type:"doughnut",
            labels:["Revenu net","Impôt et prélèvements sociaux"],
            datasets:[{data:[revenuNetFiscal, revenuAnnuelBrut-revenuNetFiscal], backgroundColor:["#0f7a72","#b3422c"]}]
          },
          warnings: warnings
        };
      }
    },

    /* ---------- 13. Comparateur LMNP vs location nue ---------- */
    {
      id:"lmnp-vs-nue", category:"immobilier", status:"ready", icon:"🛋️",
      name:"Comparateur LMNP vs location nue",
      desc:"Compare le revenu net décaissé entre location meublée (LMNP, micro-BIC ou réel avec amortissement) et location nue (micro-foncier ou réel), en retenant le régime le plus favorable pour chacune.",
      fields:[
        {id:"loyerAnnuelBrut", label:"Loyer annuel brut (hors charges)", type:"number", suffix:"€", default:12000, step:200},
        {id:"chargesAnnuelles", label:"Charges annuelles réelles (copro, entretien, assurance, gestion...)", type:"number", suffix:"€", default:2000, step:100},
        {id:"prixBienAmortissable", label:"Valeur amortissable du bien (hors terrain, LMNP réel)", type:"number", suffix:"€", default:170000, step:1000, help:"Environ 80-85% du prix d'achat (le terrain n'est pas amortissable)."},
        {id:"dureeAmortissementAns", label:"Durée d'amortissement retenue", type:"number", suffix:"ans", default:25, step:1},
        {id:"tmi", label:"Tranche marginale d'imposition", type:"number", suffix:"%", default:30, step:1, clientField:"tmi"}
      ],
      compute:function(inputs){
        var tauxGlobal = inputs.tmi/100 + 0.172;
        var amortissementAnnuel = inputs.prixBienAmortissable/inputs.dureeAmortissementAns;

        // LMNP micro-BIC : abattement forfaitaire de 50% (plafond de recettes non vérifié ici)
        var baseLmnpMicro = inputs.loyerAnnuelBrut*0.5;
        var impotLmnpMicro = baseLmnpMicro*tauxGlobal;
        var netLmnpMicro = inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - impotLmnpMicro;

        // LMNP réel : charges réelles + amortissement déductibles (non reportable en déficit au-delà du résultat, simplifié ici)
        var baseLmnpReel = Math.max(0, inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - amortissementAnnuel);
        var impotLmnpReel = baseLmnpReel*tauxGlobal;
        var netLmnpReel = inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - impotLmnpReel;

        // Nue micro-foncier : abattement forfaitaire de 30%
        var baseNueMicro = inputs.loyerAnnuelBrut*0.7;
        var impotNueMicro = baseNueMicro*tauxGlobal;
        var netNueMicro = inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - impotNueMicro;

        // Nue réel : charges réelles déductibles (pas d'amortissement en foncier)
        var baseNueReel = Math.max(0, inputs.loyerAnnuelBrut - inputs.chargesAnnuelles);
        var impotNueReel = baseNueReel*tauxGlobal;
        var netNueReel = inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - impotNueReel;

        var meilleurLmnp = netLmnpReel >= netLmnpMicro ? {net:netLmnpReel, regime:"réel (amortissement)", impot:impotLmnpReel} : {net:netLmnpMicro, regime:"micro-BIC (abattement 50%)", impot:impotLmnpMicro};
        var meilleurNue = netNueReel >= netNueMicro ? {net:netNueReel, regime:"réel", impot:impotNueReel} : {net:netNueMicro, regime:"micro-foncier (abattement 30%)", impot:impotNueMicro};

        return {
          keyFigures:[
            {label:"LMNP — net décaissé (meilleur régime)", value: euro.format(meilleurLmnp.net)},
            {label:"Location nue — net décaissé (meilleur régime)", value: euro.format(meilleurNue.net)},
            {label:"Écart en faveur du LMNP", value: (meilleurLmnp.net-meilleurNue.net>=0?"+":"") + euro.format(meilleurLmnp.net-meilleurNue.net)}
          ],
          details:[
            {label:"LMNP — régime le plus favorable", value: meilleurLmnp.regime},
            {label:"LMNP micro-BIC — net décaissé", value: euro.format(netLmnpMicro)},
            {label:"LMNP réel — net décaissé", value: euro.format(netLmnpReel)},
            {label:"Location nue — régime le plus favorable", value: meilleurNue.regime},
            {label:"Nue micro-foncier — net décaissé", value: euro.format(netNueMicro)},
            {label:"Nue réel — net décaissé", value: euro.format(netNueReel)},
            {label:"Amortissement annuel retenu (LMNP réel)", value: euro.format(amortissementAnnuel)}
          ],
          chart:{
            type:"bar",
            labels:["LMNP micro-BIC","LMNP réel","Nue micro-foncier","Nue réel"],
            datasets:[{label:"Net décaissé (€/an)", data:[netLmnpMicro,netLmnpReel,netNueMicro,netNueReel].map(Math.round), backgroundColor:["#9c7a3c","#122b46","#c9a87c","#0f7a72"]}]
          },
          warnings:["Comparaison simplifiée : ne modélise pas le report de déficit foncier/BIC sur les années suivantes, la CFE (LMNP), ni la reprise d'amortissement à la revente (le LMNP réel diffère l'impôt, il ne l'annule pas forcément à long terme). Amortissement en ligne droite simplifié (un seul taux, sans distinguer structure/mobilier/équipements)."]
        };
      }
    },
    /* ---------- 7. Plus-value immobilière ---------- */
    {
      id:"plus-value-immo", category:"immobilier", status:"ready", icon:"📈",
      name:"Plus-value immobilière",
      desc:"Calcule l'impôt sur la plus-value de cession (IR 19% + prélèvements sociaux 17,2% + surtaxe éventuelle), avec abattements pour durée de détention (exonération IR à 22 ans, PS à 30 ans).",
      fields:[
        {id:"prixVente", label:"Prix de vente", type:"number", suffix:"€", default:350000, step:1000},
        {id:"prixAchat", label:"Prix d'acquisition initial", type:"number", suffix:"€", default:200000, step:1000},
        {id:"fraisAcquisitionPct", label:"Frais d'acquisition (forfait, % du prix d'achat)", type:"number", suffix:"%", default:7.5, step:0.5, help:"7,5% forfaitaire usuel si les frais réels sont inconnus/inférieurs."},
        {id:"montantTravaux", label:"Travaux (montant réel, optionnel)", type:"number", suffix:"€", default:0, step:1000, help:"Ou forfait de 15% du prix d'achat si détention > 5 ans et sans factures : à saisir manuellement."},
        {id:"dureeDetention", label:"Durée de détention", type:"number", suffix:"ans", default:15, step:1},
        {id:"residencePrincipale", label:"Résidence principale du vendeur", type:"select", default:"non", options:[
          {value:"non", label:"Non (exonération non applicable)"},
          {value:"oui", label:"Oui (exonération totale)"}
        ]}
      ],
      compute:function(inputs){
        var warnings = ["Calcul simplifié (régime des particuliers, Art. 150 U à 150 VH et 1609 nonies G du CGI). Ne couvre pas les autres cas d'exonération (1re cession hors RP sous condition, retraités/invalides de condition modeste, terrains à bâtir spécifiques...). À valider avec un notaire avant toute décision."];

        if(inputs.residencePrincipale === "oui"){
          var plusValueIndicative = Math.max(0, inputs.prixVente - (inputs.prixAchat*(1+inputs.fraisAcquisitionPct/100) + inputs.montantTravaux));
          return {
            keyFigures:[
              {label:"Impôt total sur la plus-value", value: euro.format(0)},
              {label:"Plus-value brute", value: euro.format(plusValueIndicative)},
              {label:"Montant net après impôt", value: euro.format(inputs.prixVente)}
            ],
            details:[{label:"Motif", value:"Résidence principale : exonération totale (Art. 150 U II-1° CGI)"}],
            chart:null,
            warnings: warnings
          };
        }

        var prixAcquisitionMajore = inputs.prixAchat*(1+inputs.fraisAcquisitionPct/100) + inputs.montantTravaux;
        var plusValueBrute = Math.max(0, inputs.prixVente - prixAcquisitionMajore);

        function abattementIR(n){ if(n<6) return 0; if(n<22) return (n-5)*6; return 100; }
        function abattementPS(n){
          if(n<6) return 0;
          if(n<=21) return (n-5)*1.65;
          if(n===22) return 28;
          if(n<30) return 28 + (n-22)*9;
          return 100;
        }
        var n = inputs.dureeDetention;
        var gainsIR = plusValueBrute*(1-abattementIR(n)/100);
        var gainsPS = plusValueBrute*(1-abattementPS(n)/100);
        var impotIR = gainsIR*0.19;
        var prelevSociaux = gainsPS*0.172;

        // Surtaxe sur les plus-values élevées (Art. 1609 nonies G CGI), assise sur la plus-value imposable à l'IR.
        function computeSurtaxe(pv){
          if(pv<=50000) return 0;
          if(pv<=60000) return 0.02*pv - (60000-pv)*1/20;
          if(pv<=100000) return 0.02*pv;
          if(pv<=110000) return 0.03*pv - (110000-pv)*1/10;
          if(pv<=150000) return 0.03*pv;
          if(pv<=160000) return 0.04*pv - (160000-pv)*15/100;
          if(pv<=200000) return 0.04*pv;
          if(pv<=210000) return 0.05*pv - (210000-pv)*20/100;
          if(pv<=250000) return 0.05*pv;
          if(pv<=260000) return 0.06*pv - (260000-pv)*25/100;
          return 0.06*pv;
        }
        var surtaxe = computeSurtaxe(gainsIR);
        var totalImpot = impotIR + prelevSociaux + surtaxe;
        var net = inputs.prixVente - totalImpot;

        return {
          keyFigures:[
            {label:"Impôt total sur la plus-value", value: euro.format(totalImpot)},
            {label:"Plus-value brute", value: euro.format(plusValueBrute)},
            {label:"Montant net après impôt", value: euro.format(net)}
          ],
          details:[
            {label:"Prix d'acquisition majoré (frais + travaux)", value: euro.format(prixAcquisitionMajore)},
            {label:"Abattement pour durée de détention (IR)", value: pct(Math.min(100,abattementIR(n)), 1)},
            {label:"Abattement pour durée de détention (PS)", value: pct(Math.min(100,abattementPS(n)), 1)},
            {label:"Plus-value imposable à l'IR (19%)", value: euro.format(gainsIR)},
            {label:"Plus-value imposable aux PS (17,2%)", value: euro.format(gainsPS)},
            {label:"Impôt sur le revenu (19%)", value: euro.format(impotIR)},
            {label:"Prélèvements sociaux (17,2%)", value: euro.format(prelevSociaux)},
            {label:"Surtaxe plus-values élevées", value: euro.format(surtaxe)}
          ],
          chart:{
            type:"doughnut",
            labels:["Net perçu","Impôt sur le revenu","Prélèvements sociaux","Surtaxe"],
            datasets:[{data:[net, impotIR, prelevSociaux, surtaxe], backgroundColor:["#0f7a72","#b3422c","#9c7a3c","#5b6b7c"]}]
          },
          warnings: warnings
        };
      }
    },
