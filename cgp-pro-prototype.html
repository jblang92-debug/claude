      main.querySelectorAll("[data-remove-scenario]").forEach(function(btn){
        btn.addEventListener("click", function(){
          snapshotCurrentValues();
          scenarios = scenarios.filter(function(sc){ return sc.label !== btn.dataset.removeScenario; });
          document.getElementById("resultsArea").hidden = true;
          renderForm();
        });
      });

      calcFormEl.addEventListener("submit", function(e){ e.preventDefault(); computeAll(); });

      if(opts.prefill && opts.autoCompute){ computeAll(); }
    }

    function computeAll(){
      lastResults = {};
      scenarios.forEach(function(sc){
        var inputs = readInputs(tool.fields, sc.label + "_");
        lastResults[sc.label] = {inputs: inputs, result: tool.compute(inputs)};
      });
      renderResults();
    }

    function renderResults(){
      var resultsArea = document.getElementById("resultsArea");
      resultsArea.hidden = false;

      if(scenarios.length === 1){
        var r = lastResults.A.result;
        resultsArea.innerHTML =
          '<hr class="sep">' +
          '<div class="key-figures" id="keyFigures"></div>' +
          '<div class="chart-wrap tech-detail" id="chartWrap"><canvas id="resultChart"></canvas></div>' +
          '<div class="tech-detail" id="detailsArea"></div>' +
          '<div id="summaryArea"></div>' +
          '<div class="warnings" id="warningsArea"></div>' +
          actionsBarHTML();
        document.getElementById("keyFigures").innerHTML = r.keyFigures.map(function(k){
          return '<div class="key-figure"><div class="value">' + escapeHTML(k.value) + '</div><div class="label">' + escapeHTML(k.label) + '</div></div>';
        }).join("");
        var details = r.details || [];
        document.getElementById("detailsArea").innerHTML = details.length ?
          '<table class="details-table">' + details.map(function(d){ return '<tr><td>' + escapeHTML(d.label) + '</td><td>' + escapeHTML(d.value) + '</td></tr>'; }).join("") + '</table>' : '';
        document.getElementById("summaryArea").innerHTML = r.summaryHTML ? '<p class="summary-sentence">' + r.summaryHTML + '</p>' : '';
        document.getElementById("warningsArea").innerHTML = (r.warnings||[]).map(function(w){ return '<div class="warning">' + escapeHTML(w) + '</div>'; }).join("");
        renderChart(r.chart);
      } else {
        resultsArea.innerHTML =
          '<hr class="sep">' +
          '<div class="compare-keyfigures" id="compareKeyfigures"></div>' +
          '<div class="chart-wrap tech-detail" id="chartWrap"><canvas id="resultChart"></canvas></div>' +
          '<div class="compare-summaries" id="compareSummaries"></div>' +
          '<div class="warnings" id="warningsArea"></div>' +
          actionsBarHTML();
        renderCompareKeyfigures(tool, scenarios, lastResults);
        renderCompareChart(tool, scenarios, lastResults);
        document.getElementById("compareSummaries").innerHTML = scenarios.map(function(sc){
          var res = lastResults[sc.label].result;
          return res.summaryHTML ? '<div class="compare-summary-item"><span class="scenario-badge scenario-badge-' + sc.label + '">Scénario ' + sc.label + '</span><p class="summary-sentence">' + res.summaryHTML + '</p></div>' : '';
        }).join("");
        var allWarnings = [];
        scenarios.forEach(function(sc){ (lastResults[sc.label].result.warnings||[]).forEach(function(w){ if(allWarnings.indexOf(w)===-1) allWarnings.push(w); }); });
        document.getElementById("warningsArea").innerHTML = allWarnings.map(function(w){ return '<div class="warning">' + escapeHTML(w) + '</div>'; }).join("");
      }

      wireActionsBar();
    }

    function wireActionsBar(){
      document.getElementById("presentBtn").addEventListener("click", enterPresentationMode);
      document.getElementById("pdfBtn").addEventListener("click", function(){
        var clientName = document.getElementById("clientName").value.trim();
        if(scenarios.length > 1){ exportComparisonPDF(tool, scenarios, lastResults, clientName); }
        else { exportPDF(tool, lastResults.A.inputs, lastResults.A.result, clientName); }
      });
      document.getElementById("saveBtn").addEventListener("click", function(){
        if(!lastResults.A) return;
        var clientName = document.getElementById("clientName").value.trim();
        var entry = {
          id: "sim_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
          toolId: tool.id,
          toolName: tool.name,
          clientId: selectedClientId || null,
          clientName: clientName || "(sans nom)",
          timestamp: new Date().toISOString(),
          inputs: lastResults.A.inputs,
          keyFigures: lastResults.A.result.keyFigures
        };
        var msg = document.getElementById("saveMsg");
        if(saveSimulation(entry)){
          msg.textContent = "Simulation enregistrée ✓";
          setTimeout(function(){ msg.textContent = ""; }, 2500);
        }
      });
    }

    renderForm();
  }

  // Export PDF en mode comparaison (≥2 scénarios) : mêmes classes/mentions/charte que l'export PDF simple,
  // avec un tableau comparatif (une colonne par scénario, écart coloré textuellement vs A) et le graphique
  // de comparaison déjà affiché à l'écran.
  function exportComparisonPDF(tool, scenarios, lastResults, clientName){
    var reportEl = document.getElementById("printReport");
    var dateStr = new Date().toLocaleDateString("fr-FR", {year:"numeric", month:"long", day:"numeric"});
    var chartImg = "";
    var canvas = document.getElementById("resultChart");
    if(canvas && lastResults.A.result.chart){
      try{ chartImg = '<img src="' + canvas.toDataURL("image/png", 1.0) + '" class="print-chart">'; }
      catch(e){ chartImg = ""; }
    }

    var metrics = tool.compareMetrics || [];
    var rowsHTML;
    if(metrics.length){
      rowsHTML = metrics.map(function(m){
        var aVal = lastResults.A.result.extra ? lastResults.A.result.extra[m.key] : undefined;
        return '<tr><td>' + escapeHTML(m.label) + '</td>' + scenarios.map(function(sc){
          var e = lastResults[sc.label].result.extra;
          var val = e ? e[m.key] : undefined;
          if(val === undefined) return '<td>—</td>';
          var cell = escapeHTML(formatCompareValue(val, m.format));
          if(sc.label !== "A" && aVal !== undefined){ cell += ' (' + escapeHTML(formatCompareDiff(val-aVal, m.format)) + ')'; }
          return '<td>' + cell + '</td>';
        }).join("") + '</tr>';
      }).join("");
    } else {
      rowsHTML = lastResults.A.result.keyFigures.map(function(k, i){
        return '<tr><td>' + escapeHTML(k.label) + '</td>' + scenarios.map(function(sc){
          var kf = lastResults[sc.label].result.keyFigures[i];
          return '<td>' + escapeHTML(kf ? kf.value : "—") + '</td>';
        }).join("") + '</tr>';
      }).join("");
    }

    reportEl.innerHTML =
      printHeaderHTML(tool.name + " — Comparaison de scénarios") +
      '<div class="print-meta">' +
        (clientName ? '<div><strong>Client :</strong> ' + escapeHTML(clientName) + '</div>' : '') +
        '<div><strong>Date :</strong> ' + dateStr + '</div>' +
      '</div>' +
      '<div class="print-details"><h3>Comparaison des scénarios</h3><table class="print-compare-table"><thead><tr><th></th>' +
        scenarios.map(function(sc){ return '<th>Scénario ' + sc.label + '</th>'; }).join("") +
      '</tr></thead>' + rowsHTML + '</table></div>' +
      chartImg +
      '<div class="print-details"><h3>Paramètres saisis</h3><table class="print-compare-table"><thead><tr><th></th>' +
        scenarios.map(function(sc){ return '<th>Scénario ' + sc.label + '</th>'; }).join("") +
      '</tr></thead>' +
        tool.fields.map(function(f){
          return '<tr><td>' + escapeHTML(f.label) + '</td>' + scenarios.map(function(sc){
            return '<td>' + escapeHTML(formatInputForPrint(f, lastResults[sc.label].inputs[f.id])) + '</td>';
          }).join("") + '</tr>';
        }).join("") +
      '</table></div>' +
      '<div class="print-footer">' + escapeHTML(getLegalMention()) + '</div>';
    window.print();
  }

  /* ============================ Intérêts composés (rendu sur mesure, style Finary) ============================ */
  function mountInteretsComposes(opts){
    var tool = TOOLS_BY_ID["interets-composes"];
    var main = document.getElementById("main");
    var clients = getClients();
    var selectedClientId = opts.clientId && getClientById(opts.clientId) ? opts.clientId : "";
    var basePrefill = opts.prefill || (selectedClientId ? mapClientToInputs(getClientById(selectedClientId), tool) : {});

    // Même logique de scénarios A/B/C que mountComparableCalculator (prefill par scénario, valeurs vivantes
    // dans le DOM), adaptée au rendu sur mesure "steppers + recalcul instantané" de cet outil.
    var scenarios = [{label:"A", prefill: basePrefill}];
    var lastResults = {}; // label -> {inputs, result}

    // Section "Revenus complémentaires" (rente perpétuelle vs. décaissement sur durée choisie) — affichée
    // uniquement en vue à 1 scénario, sous le résultat du capital final déjà calculé.
    var revenusMode = "perpetuelle"; // "perpetuelle" | "epuisement"
    var dureeEpuisement = 20; // années, 10-40
    var revenusChartInstance = null;

    var clientOptionsHTML = '<option value="">— Aucun / autre —</option>' +
      clients.map(function(c){ return '<option value="' + c.id + '" ' + (c.id===selectedClientId?"selected":"") + '>' + escapeHTML(clientFullName(c)) + '</option>'; }).join("");

    function stepperField(f, prefillObj, idPrefix){
      var val = prefillObj && prefillObj[f.id] !== undefined ? prefillObj[f.id] : f.default;
      var id = "f_" + idPrefix + f.id;
      return '<div class="ic-field" data-field-wrap="' + f.id + '">' +
        '<div class="ic-field-label">' + escapeHTML(f.label) +
          '<span class="info-icon" tabindex="0">ⓘ<span class="info-tooltip">' + escapeHTML(f.info||"") + '</span></span>' +
        '</div>' +
        '<div class="stepper">' +
          '<button type="button" class="stepper-btn" data-step="-1" data-target="' + id + '">−</button>' +
          '<div class="input-suffix"><input type="number" id="' + id + '" value="' + escapeHTML(val) + '" step="' + f.step + '">' +
            '<span class="suffix">' + escapeHTML(f.suffix||"") + '</span></div>' +
          '<button type="button" class="stepper-btn" data-step="1" data-target="' + id + '">+</button>' +
        '</div>' +
      '</div>';
    }

    function snapshotCurrentValues(){
      scenarios.forEach(function(sc){
        var probe = document.getElementById("f_" + sc.label + "_" + tool.fields[0].id);
        if(!probe) return;
        var snap = {};
        tool.fields.forEach(function(f){ snap[f.id] = parseFloat(document.getElementById("f_" + sc.label + "_" + f.id).value) || 0; });
        sc.prefill = snap;
      });
    }

    function scenarioColumnHTML(sc){
      return '<div class="scenario-col ic-scenario-col" data-scenario="' + sc.label + '">' +
        '<div class="scenario-col-head"><span class="scenario-badge scenario-badge-' + sc.label + '">Scénario ' + sc.label + '</span>' +
          (sc.label!=="A" ? '<button type="button" class="btn-scenario-remove" data-remove-scenario="' + sc.label + '">✕ Retirer ce scénario</button>' : '') +
        '</div>' +
        tool.fields.map(function(f){ return stepperField(f, sc.prefill, sc.label + "_"); }).join("") +
      '</div>';
    }

    function actionsBarHTML(){
      return '<div class="actions-bar">' +
        '<div class="field client-field"><label for="clientName">Nom du client (optionnel)</label>' +
        '<input type="text" id="clientName" placeholder="ex. M. Dupont" value="' + (selectedClientId ? escapeHTML(clientFullName(getClientById(selectedClientId))) : "") + '"></div>' +
        '<div class="actions-buttons">' +
          '<button class="btn btn-outline" id="presentBtn" type="button">🖥 Mode présentation</button>' +
          '<button class="btn btn-outline" id="pdfBtn" type="button">⤓ Exporter en PDF</button>' +
          '<button class="btn btn-primary" id="saveBtn" type="button">💾 Enregistrer pour ce client</button>' +
        '</div>' +
        '<div class="save-msg" id="saveMsg"></div>' +
      '</div>';
    }

    // Calcule les deux modes de revenus complémentaires à partir du capital final et du taux annuel déjà
    // saisis dans le calculateur principal (aucune nouvelle saisie de taux).
    function computeRevenusComplementaires(capitalFinal, tauxAnnuel){
      var tauxMensuel = tauxAnnuel/100/12;
      var revenuPerpetuel = capitalFinal * (tauxAnnuel/100) / 12;
      var n = Math.max(1, Math.round(dureeEpuisement*12));
      var revenuEpuisement = tauxMensuel > 0
        ? capitalFinal * (tauxMensuel / (1 - Math.pow(1+tauxMensuel, -n)))
        : capitalFinal / n;
      return {revenuPerpetuel: revenuPerpetuel, revenuEpuisement: revenuEpuisement, tauxMensuel: tauxMensuel, n: n};
    }

    // Trajectoire année par année du capital restant sous le mode "épuisement" (pour le graphique).
    function capitalRestantSeries(capitalFinal, tauxMensuel, revenuEpuisement){
      var labels = ["0"], data = [Math.round(capitalFinal)];
      var capital = capitalFinal;
      for(var an=1; an<=dureeEpuisement; an++){
        for(var m=0; m<12; m++){ capital = capital*(1+tauxMensuel) - revenuEpuisement; }
        labels.push(String(an));
        data.push(Math.max(0, Math.round(capital)));
      }
      data[data.length-1] = 0; // force l'exact épuisement en fin de période (dérive d'arrondi sinon)
      return {labels: labels, data: data};
    }

    function revenusComplementairesHTML(){
      if(!lastResults.A) return "";
      var capitalFinal = Math.max(0, lastResults.A.result.extra.capitalFinal);
      var tauxAnnuel = lastResults.A.inputs.tauxAnnuel;
      var c = computeRevenusComplementaires(capitalFinal, tauxAnnuel);
      var perpActive = revenusMode === "perpetuelle";
      var epuisActive = revenusMode === "epuisement";

      return '<hr class="sep">' +
        '<h3 class="revenus-comp-title">Revenus complémentaires</h3>' +
        '<p class="revenus-comp-intro">À partir du capital final ci-dessus et du taux d\'intérêt annuel saisi (' + pct(tauxAnnuel) + '), deux façons d\'en tirer un revenu régulier :</p>' +
        '<div class="revenus-comp-tabs" role="tablist">' +
          '<button type="button" class="revenus-comp-tab' + (perpActive?" active":"") + '" data-revenus-mode="perpetuelle">Sans entamer le capital</button>' +
          '<button type="button" class="revenus-comp-tab' + (epuisActive?" active":"") + '" data-revenus-mode="epuisement">Capital consommé progressivement</button>' +
        '</div>' +
        '<div class="revenus-comp-cols">' +
          '<div class="revenus-comp-col' + (perpActive?" active":"") + '">' +
            '<div class="revenus-comp-value">' + escapeHTML(euro.format(c.revenuPerpetuel)) + '<span class="revenus-comp-value-sub">/mois</span></div>' +
            '<div class="revenus-comp-label">Rente perpétuelle — capital intact</div>' +
            (perpActive ? '<p class="revenus-comp-sentence">Avec ce capital, vous pouvez percevoir <strong>' + escapeHTML(euro.format(c.revenuPerpetuel)) + '</strong>/mois à vie sans jamais toucher au capital.</p>' : '') +
          '</div>' +
          '<div class="revenus-comp-col' + (epuisActive?" active":"") + '">' +
            '<div class="revenus-comp-value">' + escapeHTML(euro.format(c.revenuEpuisement)) + '<span class="revenus-comp-value-sub">/mois</span></div>' +
            '<div class="revenus-comp-label">Sur ' + dureeEpuisement + ' ans, jusqu\'à épuisement</div>' +
            (epuisActive ?
              '<div class="revenus-comp-duree-field">' +
                '<label for="revenusDureeRange">Durée d\'épuisement du capital</label>' +
                '<div class="revenus-comp-duree-row">' +
                  '<input type="range" id="revenusDureeRange" min="10" max="40" step="1" value="' + dureeEpuisement + '">' +
                  '<div class="input-suffix revenus-comp-duree-input"><input type="number" id="revenusDureeInput" min="10" max="40" step="1" value="' + dureeEpuisement + '"><span class="suffix">ans</span></div>' +
                '</div>' +
              '</div>' +
              '<p class="revenus-comp-sentence">En consommant votre capital sur <strong>' + dureeEpuisement + ' ans</strong>, vous pouvez percevoir <strong>' + escapeHTML(euro.format(c.revenuEpuisement)) + '</strong>/mois, jusqu\'à épuisement total du capital.</p>' +
              '<div class="chart-wrap revenus-comp-chart-wrap"><canvas id="revenusCompChart"></canvas></div>'
            : '') +
          '</div>' +
        '</div>';
    }

    function renderRevenusCompChart(){
      var canvas = document.getElementById("revenusCompChart");
      if(!canvas || typeof Chart === "undefined" || !lastResults.A) return;
      var capitalFinal = Math.max(0, lastResults.A.result.extra.capitalFinal);
      var tauxAnnuel = lastResults.A.inputs.tauxAnnuel;
      var c = computeRevenusComplementaires(capitalFinal, tauxAnnuel);
      var serie = capitalRestantSeries(capitalFinal, c.tauxMensuel, c.revenuEpuisement);

      if(revenusChartInstance){ revenusChartInstance.destroy(); }
      revenusChartInstance = new Chart(canvas.getContext("2d"), {
        type: "line",
        data: {
          labels: serie.labels,
          datasets: [{label:"Capital restant", data: serie.data, borderColor:"#9c7a3c", backgroundColor:"rgba(156,122,60,0.18)", fill:"origin", tension:0.2, pointRadius:0}]
        },
        options: {
          responsive:true,
          plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:function(ctx){ return "Capital restant : " + euro.format(ctx.parsed.y); } } } },
          scales:{
            x:{ grid:{display:false}, ticks:{ callback:function(v, index){ return index===0 ? "Aujourd'hui" : (serie.labels[index] + " ans"); } } },
            y:{ ticks:{ callback:function(v){ return euro.format(v); } } }
          }
        }
      });
    }

    // Bloc "Revenus complémentaires" pour l'export PDF : les deux modes avec leur phrase d'explication (pas
    // seulement l'onglet actif à l'écran), plus le graphique de décroissance du capital s'il est déjà rendu.
    function revenusComplementairesPrintHTML(){
      if(!lastResults.A) return "";
      var capitalFinal = Math.max(0, lastResults.A.result.extra.capitalFinal);
      var tauxAnnuel = lastResults.A.inputs.tauxAnnuel;
      var c = computeRevenusComplementaires(capitalFinal, tauxAnnuel);
      var chartImg = "";
      var canvas = document.getElementById("revenusCompChart");
      if(canvas){
        try{ chartImg = '<img src="' + canvas.toDataURL("image/png", 1.0) + '" class="print-chart">'; }
        catch(e){ chartImg = ""; }
      }
      return '<div class="print-details"><h3>Revenus complémentaires</h3><table>' +
          '<tr><td>Rente perpétuelle (sans entamer le capital)</td><td>' + escapeHTML(euro.format(c.revenuPerpetuel)) + '/mois</td></tr>' +
          '<tr><td>Capital consommé sur ' + dureeEpuisement + ' ans</td><td>' + escapeHTML(euro.format(c.revenuEpuisement)) + '/mois</td></tr>' +
        '</table>' +
        '<p class="print-summary">Avec ce capital, vous pouvez percevoir <strong>' + escapeHTML(euro.format(c.revenuPerpetuel)) + '</strong>/mois à vie sans jamais toucher au capital.</p>' +
        '<p class="print-summary">En consommant votre capital sur <strong>' + dureeEpuisement + ' ans</strong>, vous pouvez percevoir <strong>' + escapeHTML(euro.format(c.revenuEpuisement)) + '</strong>/mois, jusqu\'à épuisement total du capital.</p>' +
        chartImg +
      '</div>';
    }

    function wireRevenusComplementaires(){
      var section = document.getElementById("revenusCompSection");
      if(!section) return;
      section.querySelectorAll(".revenus-comp-tab").forEach(function(btn){
        btn.addEventListener("click", function(){
          revenusMode = btn.dataset.revenusMode;
          refreshRevenusComplementaires();
        });
      });
      var rangeEl = document.getElementById("revenusDureeRange");
      var numEl = document.getElementById("revenusDureeInput");
      if(rangeEl){
        rangeEl.addEventListener("input", function(){
          dureeEpuisement = Math.max(10, Math.min(40, parseInt(rangeEl.value,10)||20));
          refreshRevenusComplementaires();
        });
      }
      if(numEl){
        numEl.addEventListener("change", function(){
          var v = parseInt(numEl.value,10);
          dureeEpuisement = isNaN(v) ? 20 : Math.max(10, Math.min(40, v));
          refreshRevenusComplementaires();
        });
      }
      renderRevenusCompChart();
    }

    function refreshRevenusComplementaires(){
      var section = document.getElementById("revenusCompSection");
      if(!section) return;
      section.innerHTML = revenusComplementairesHTML();
      wireRevenusComplementaires();
    }

          '<div class="calc-form ic-inputs-card">' +
            tool.fields.map(function(f){ return stepperField(f, scenarios[0].prefill, "A_"); }).join("") +

        '<p class="tool-desc">' + escapeHTML(tool.desc) + '</p>' +
        '<div class="client-select-bar">' +
          '<div class="field"><label for="clientSelect">Client (pré-remplissage automatique' + (multi ? ' — scénario A' : '') + ')</label>' +
          '<select id="clientSelect">' + clientOptionsHTML + '</select></div>' +
          '<a href="#/clients/new" class="link-new-client">+ Nouveau client</a>' +

    function computeAllAndRender(){
      lastResults = {};
      scenarios.forEach(function(sc){
        var inputs = {};
        tool.fields.forEach(function(f){ inputs[f.id] = parseFloat(document.getElementById("f_" + sc.label + "_" + f.id).value) || 0; });
        lastResults[sc.label] = {inputs: inputs, result: tool.compute(inputs)};
      });
      renderResultsZone();

    function renderResultsZone(){

        zone.innerHTML =
          '<div class="ic-result">' +
            '<div class="ic-final-value" id="icFinalValue">' + escapeHTML(euro.format(r.extra.capitalFinal >= 0 ? r.extra.capitalFinal : 0)) + '</div>' +
            '<div class="ic-final-sub" id="icFinalSub">après ' + inp.horizonAnnees + ' an' + (inp.horizonAnnees>1?"s":"") + '</div>' +
            '<div class="ic-badges">' +
              '<div class="ic-badge"><span class="ic-badge-dot interets"></span><span id="icBadgeInterets">Intérêts : ' + escapeHTML(euro.format(r.extra.interetsGeneres)) + '</span></div>' +
              '<div class="ic-badge"><span class="ic-badge-dot versements"></span><span id="icBadgeVersements">Versements : ' + escapeHTML(euro.format(r.extra.totalVersements)) + '</span></div>' +
            '</div>' +
          '</div>' +
          '<div class="chart-wrap ic-chart-wrap" id="chartWrap"><canvas id="resultChart"></canvas></div>' +
          '<p class="ic-sentence" id="icSentence">' + r.summaryHTML + '</p>' +
          '<div id="revenusCompSection">' + revenusComplementairesHTML() + '</div>';
        renderChart(r.chart);
        wireRevenusComplementaires();
      } else {
        zone.innerHTML =
          '<div class="compare-keyfigures" id="compareKeyfigures"></div>' +
          '<div class="chart-wrap ic-chart-wrap" id="chartWrap"><canvas id="resultChart"></canvas></div>' +
          '<div class="compare-summaries" id="compareSummaries"></div>';
        renderCompareKeyfigures(tool, scenarios, lastResults);
        renderCompareChart(tool, scenarios, lastResults);
        document.getElementById("compareSummaries").innerHTML = scenarios.map(function(sc){
          return '<div class="compare-summary-item"><span class="scenario-badge scenario-badge-' + sc.label + '">Scénario ' + sc.label + '</span><p class="summary-sentence">' + lastResults[sc.label].result.summaryHTML + '</p></div>';
        }).join("");
      }
    }

    function wireEvents(){
      main.querySelectorAll(".stepper-btn").forEach(function(btn){
        btn.addEventListener("click", function(){
          var input = document.getElementById(btn.dataset.target);
          var step = parseFloat(input.step) || 1;
          var next = (parseFloat(input.value)||0) + step*parseFloat(btn.dataset.step);
          input.value = Math.max(0, Math.round(next*100)/100);
          computeAllAndRender();
        });
      });
      main.querySelectorAll(".ic-field input[type=number]").forEach(function(inp){
        inp.addEventListener("input", computeAllAndRender);
      });

      main.querySelectorAll(".info-icon").forEach(function(icon){
        icon.addEventListener("click", function(e){
          e.stopPropagation();
          var wasOpen = icon.classList.contains("open");
          main.querySelectorAll(".info-icon.open").forEach(function(i){ i.classList.remove("open"); });
          if(!wasOpen) icon.classList.add("open");
        });
      });

      document.getElementById("clientSelect").addEventListener("change", function(e){
        selectedClientId = e.target.value;
        var client = selectedClientId ? getClientById(selectedClientId) : null;
        var newPrefill = client ? mapClientToInputs(client, tool) : {};
        tool.fields.forEach(function(f){
          document.getElementById("f_A_" + f.id).value = newPrefill[f.id] !== undefined ? newPrefill[f.id] : f.default;
        });
        document.getElementById("clientName").value = client ? clientFullName(client) : "";
        computeAllAndRender();
      });

      var addBtn = document.getElementById("addScenarioBtn");
      if(addBtn){
        addBtn.addEventListener("click", function(){
          if(scenarios.length>=3) return;
          snapshotCurrentValues();
          var nextLabel = SCENARIO_LABELS[scenarios.length];
          scenarios.push({label: nextLabel, prefill: Object.assign({}, scenarios[0].prefill)});
          renderPage();
        });
      }
      main.querySelectorAll("[data-remove-scenario]").forEach(function(btn){
        btn.addEventListener("click", function(){
          snapshotCurrentValues();
          scenarios = scenarios.filter(function(sc){ return sc.label !== btn.dataset.removeScenario; });
          renderPage();
        });
      });

      document.getElementById("presentBtn").addEventListener("click", enterPresentationMode);
      document.getElementById("pdfBtn").addEventListener("click", function(){
        var clientName = document.getElementById("clientName").value.trim();
        if(scenarios.length > 1){ exportComparisonPDF(tool, scenarios, lastResults, clientName); }
        else { exportPDF(tool, lastResults.A.inputs, lastResults.A.result, clientName, revenusComplementairesPrintHTML()); }
      });
      document.getElementById("saveBtn").addEventListener("click", function(){
        if(!lastResults.A) return;
        var clientName = document.getElementById("clientName").value.trim();
        var entry = {
          id: "sim_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
          toolId: tool.id,
          toolName: tool.name,
          clientId: selectedClientId || null,
          clientName: clientName || "(sans nom)",
          timestamp: new Date().toISOString(),
          inputs: lastResults.A.inputs,
          keyFigures: lastResults.A.result.keyFigures
        };
        var msg = document.getElementById("saveMsg");
        if(saveSimulation(entry)){
          msg.textContent = "Simulation enregistrée ✓";
          setTimeout(function(){ msg.textContent = ""; }, 2500);
        }
      });
    }

    // Fermeture des info-bulles au clic extérieur : écouteur unique au niveau document, posé une seule fois
    // (indépendant des re-rendus de page déclenchés par l'ajout/retrait de scénarios).
    document.addEventListener("click", function(){ main.querySelectorAll(".info-icon.open").forEach(function(i){ i.classList.remove("open"); }); });

    renderPage();
  }

  // Identifiant fiscal FICTIF affiché sur l'export complet — jamais un format à 13 chiffres (celui du vrai
  // numéro fiscal), toujours préfixé "SIMU-" pour qu'aucune confusion avec un document officiel ne soit
  // possible. Dérivé de façon déterministe de l'id client pour rester stable d'un export à l'autre.
  function numeroFiscalFictif(client){
    var seed = (client && client.id) ? client.id : "anonyme-" + Date.now();
    var hash = 0;
    for(var i=0;i<seed.length;i++){ hash = (hash*31 + seed.charCodeAt(i)) >>> 0; }
    var digits = String(hash % 1000000000).padStart(9, "0");
    return "SIMU-" + digits;
  }

  // Plafond épargne retraite (PER) pour l'export complet de l'avis d'imposition : réutilise le calculateur
  // "Simulateur de plafond PER" existant (même compute(), aucune logique dupliquée). Priorité à une
  // simulation de plafond PER déjà enregistrée pour ce client ; à défaut, estimation directe à partir des
  // revenus déjà saisis dans cet avis (statut TNS déduit des BIC/BNC actifs, comme ailleurs dans l'app),
  // pour ne jamais bloquer l'export faute d'avoir pré-rempli l'autre calculateur.
  function estimatePlafondPerForAvis(avisInputs, client){
    var perTool = TOOLS_BY_ID["plafond-per"];
    if(!perTool || perTool.status !== "ready") return null;
    if(client){
      var sims = getSimulations().filter(function(s){ return s.clientId === client.id && s.toolId === "plafond-per"; });
      if(sims.length){
        return {result: perTool.compute(sims[0].inputs), source:"simulation", timestamp: sims[0].timestamp, isTns:null};
      }
    }
    var cat = avisInputs.revenusCategorises;
    var detail = (cat && hasAnyCategorieActive(cat)) ? computeRevenusCategorises(cat) : null;
    var isTns = detail ? detail.isTns : false;
    var perInputs = {};
    perTool.fields.forEach(function(f){ perInputs[f.id] = f.default; });
    perInputs.statutProfessionnel = isTns ? "tns" : "salarie";
    if(isTns){
      var benefice = detail.netBicTns + detail.netBncTns;
      if(benefice>0) perInputs.beneficeImposable = benefice;
    } else if(detail && detail.netSalaires>0){
      perInputs.revenuNetImposableN1 = detail.netSalaires;
    }
    return {result: perTool.compute(perInputs), source:"estimation", isTns: isTns};
  }

  // Export complet, façon avis d'imposition détaillé : reprend toutes les rubriques d'un vrai avis, avec les
  // garde-fous obligatoires (bandeau + filigrane "SIMULATION", aucun élément visuel officiel, numéro fiscal
  // fictif, mention de non-officialité en pied de page) — jamais destiné à se substituer à un vrai document.
  // Réutilise le même mécanisme (#printReport + window.print()) et les mêmes classes visuelles de base que
  // l'export PDF simple, pour rester cohérent.
  function exportAvisComplet(inputs, result, client, clientName){
    if(!result || !result.extra) return;
    var reportEl = document.getElementById("printReport");
    var dateStr = new Date().toLocaleDateString("fr-FR", {year:"numeric", month:"long", day:"numeric"});
    var profile = getCabinetProfile();
    var e = result.extra;
    var numFiscal = numeroFiscalFictif(client);
    var adresse = client && client.adresseFiscale ? client.adresseFiscale : "";
    var perEstimate = estimatePlafondPerForAvis(inputs, client);

    function row(label, value){ return '<tr><td>' + escapeHTML(label) + '</td><td>' + escapeHTML(value) + '</td></tr>'; }
    function tableHTML(rowsHTML){ return '<table>' + rowsHTML + '</table>'; }
    function section(num, title, bodyHTML){
      return '<div class="avis-section">' +
        '<div class="avis-section-head"><span class="avis-num">' + num + '</span><h2>' + escapeHTML(title) + '</h2></div>' +
        bodyHTML +
      '</div>';
    }
    function summaryItem(value, label){
      return '<div class="avis-summary-item"><div class="val">' + escapeHTML(value) + '</div><div class="lbl">' + escapeHTML(label) + '</div></div>';
    }

    var explicationParts = (e.parts + " part(s) — " +
      (e.imposeCommun ? "vous êtes marié(e) ou pacsé(e)" : "vous êtes imposé(e) seul(e)") +
      (e.parts > e.partsDeBase ? ", majorées des parts liées aux enfants à charge" : ""));

    var identiteHTML = '<div class="avis-identity">' +
      '<div><span class="lbl">Foyer fiscal</span><strong>' + escapeHTML(clientName || "—") + '</strong>' +
        (adresse ? '<br>' + escapeHTML(adresse) : '') +
      '</div>' +
      '<div><span class="lbl">Numéro fiscal (simulation)</span><strong>' + escapeHTML(numFiscal) + '</strong>' +
        '<br>Date de la simulation : ' + dateStr +
      '</div>' +
    '</div>';

    var perBodyHTML = '<div class="avis-per-body">' +
      (perEstimate ? (
        (perEstimate.source === "simulation"
          ? '<p class="print-freetext">Basé sur la simulation de plafond PER enregistrée le ' + new Date(perEstimate.timestamp).toLocaleDateString("fr-FR") + '.</p>'
          : '<p class="print-freetext">Estimation calculée à partir des revenus déjà saisis dans cet avis (statut ' +
            (perEstimate.isTns ? "travailleur non salarié, déduit de vos BIC/BNC déclarés" : "salarié par défaut — à ajuster si besoin via le Simulateur de plafond PER") +
            ').</p>') +
        rapportToolResultHTML(perEstimate.result)
      ) : '<p class="print-freetext">Calculateur de plafond PER non disponible.</p>') +
    '</div>';

    var html = '<div class="avis-complet-report">' +
      '<div class="avis-watermark">SIMULATION</div>' +
      '<div class="avis-banner">SIMULATION — Document non officiel à but pédagogique</div>' +
      printHeaderHTML("Simulation d'avis d'imposition — " + (clientName || "")) +

      '<div class="avis-summary">' +
        summaryItem(euro.format(e.revenuNetImposableBareme), "Revenu net imposable") +
        summaryItem(euro.format(e.irNet), "Impôt net (barème)") +
        summaryItem(euro.format(e.rfrEstime), "Revenu fiscal de référence") +
        summaryItem(euro.format(Math.abs(e.soldeNet)), e.soldeNet>=0 ? "Solde restant à payer" : "Solde à rembourser") +
      '</div>' +

      section("1", "Identification", identiteHTML) +

      section("2", "Revenus déclarés",
        e.revenuDetail ? tableHTML(e.revenuDetail.lignes.map(function(l){ return row(l.label.replace("Revenus déclarés — ",""), l.value); }).join(""))
          : '<p class="print-freetext">Ancien format de simulation (revenu net imposable global, sans détail par catégorie).</p>') +

      section("3", "Calcul du revenu net imposable", tableHTML(
        row("Revenu net imposable avant charges déductibles", euro.format(e.revenuNetImposableAvantCharges)) +
        row("Charges déductibles du revenu global", euro.format(e.chargesDeductibles)) +
        row("Revenu net imposable", euro.format(e.revenuNetImposableBareme))
      )) +

      section("4", "Parts et quotient familial", tableHTML(
        row("Nombre de parts retenues", explicationParts) +
        row("Quotient familial (revenu net imposable ÷ parts)", euro.format(e.qf))
      )) +

      section("5", "Impôt sur les revenus soumis au barème", tableHTML(
        row("Impôt avant plafonnement du quotient familial", euro.format(e.irAvantPlafonnement)) +
        row("Impôt sur la base de " + e.partsDeBase + " part(s) (sans les parts supplémentaires)", euro.format(e.irBase)) +
        row("Plafond de l'avantage lié aux parts supplémentaires", euro.format(e.plafondAvantage)) +
        row("Impôt après plafonnement du quotient familial", euro.format(e.irApresPlafonnement))
      )) +

      section("6", "Décote, réductions et crédits d'impôt", tableHTML(
        row("Décote", euro.format(e.decote)) +
        row("Crédits et réductions d'impôt déclarés", euro.format(e.creditsImpot))
      )) +

      section("7", "Impôt net et contributions sociales", tableHTML(
        row("Impôt net sur le revenu (barème)", euro.format(e.irNet)) +
        (e.revenuDetail && e.revenuDetail.totalPfuEtSocial>0 ? row("Prélèvement forfaitaire (PFU, part IR 12,8%) sur capitaux mobiliers/plus-values", euro.format(e.revenuDetail.irPfu)) : "") +
        (e.revenuDetail && e.revenuDetail.psSurCapitaux>0 ? row("Contributions sociales (17,2%) sur revenus du patrimoine", euro.format(e.revenuDetail.psSurCapitaux)) : "") +
        row("Total dû avant imputations", euro.format(e.totalDuAvantImputations))
      )) +

      section("8", "Retenue à la source et solde", tableHTML(
        row("Retenue à la source déjà prélevée", euro.format(e.retenueALaSource)) +
        row(e.soldeNet>=0 ? "Solde restant à payer" : "Solde à rembourser", euro.format(Math.abs(e.soldeNet)))
      )) +

      section("9", "Revenu fiscal de référence", tableHTML(
        row("RFR estimé", euro.format(e.rfrEstime))
      )) +

      section("10", "Votre situation", tableHTML(
        row("Tranche marginale d'imposition (TMI)", pct(e.tmi,0)) +
        (e.margeFoyer!==null ? row("Marge avant la tranche supérieure", euro.format(e.margeFoyer)) : row("Tranche marginale", "Déjà au taux maximal (45 %)"))
      )) +

      section("11", "Plafond épargne retraite (PER) disponible", perBodyHTML) +

      '<div class="print-footer avis-footer">Simulation réalisée par ' + escapeHTML(profile.nomCabinet || "CGP Pro") + ' à titre indicatif — ne constitue pas un document fiscal officiel et ne peut être utilisé comme justificatif.</div>' +
    '</div>';

    reportEl.innerHTML = html;
    window.print();
  }

  /* ============================ Simulateur d'avis d'imposition (rendu sur mesure) ============================ */
  // Interface dédiée : catégories de revenus dépliables (une par source fiscale), chacune avec ses propres
  // sous-champs et son régime (micro/réel, forfaitaire/frais réels, PFU/barème...). Ne passe pas par
  // mountCalculator/fieldHTML (système à plat) car chaque catégorie a une forme différente et doit pouvoir
  // se (dés)activer indépendamment ; suit néanmoins la même disposition générale (sélecteur client, zone de
  // résultats, actions Présentation/PDF/Enregistrer) que les autres outils pour rester cohérent.
  function mountAvisImposition(opts){
    var tool = TOOLS_BY_ID["avis-imposition"];
    var main = document.getElementById("main");
    var clients = getClients();
    var selectedClientId = opts.clientId && getClientById(opts.clientId) ? opts.clientId : "";

    function mergeCategorises(partial){
      var base = defaultRevenusCategorises();
      REVENU_CATEGORIES_META.forEach(function(m){
        if(partial && partial[m.id]) base[m.id] = Object.assign({}, base[m.id], partial[m.id]);
      });
      return base;
    }
    function stateFromInputs(inputs){
      var common = {
        chargesDeductibles: inputs.chargesDeductibles||0,
        creditsImpot: inputs.creditsImpot||0,
        retenueALaSource: inputs.retenueALaSource||0
      };
      if(inputs.revenusCategorises){
        return Object.assign({
          imposeCommun: inputs.imposeCommun !== undefined ? inputs.imposeCommun : true,
          nombreParts: inputs.nombreParts !== undefined ? inputs.nombreParts : 2,
          revenusCategorises: mergeCategorises(inputs.revenusCategorises)
        }, common);
      }
      // Compatibilité ascendante : simulation enregistrée avant la ventilation par catégorie.
      var cat = defaultRevenusCategorises();
      if(inputs.revenuNetImposable){
        cat.salaires = {actif:true, montantBrut: Math.round((inputs.revenuNetImposable||0)/0.9), fraisReels:false, montantFraisReels:0};
      }
      return Object.assign({
        imposeCommun: inputs.imposeCommun !== undefined ? inputs.imposeCommun : true,
        nombreParts: inputs.nombreParts !== undefined ? inputs.nombreParts : 2,
        revenusCategorises: cat
      }, common);
    }

    var client = selectedClientId ? getClientById(selectedClientId) : null;
    var state;
    if(opts.prefill){
      state = stateFromInputs(opts.prefill);
    } else if(client && hasAnyCategorieActive(client.revenusCategorises)){
      state = {
        imposeCommun: client.statutCouple === "marie" || client.statutCouple === "pacse",
        nombreParts: computePartsFiscalesEstimees(client),
        revenusCategorises: mergeCategorises(client.revenusCategorises),
        chargesDeductibles:0, creditsImpot:0, retenueALaSource:0
      };
    } else if(client){
      state = stateFromInputs(buildAvisImpositionInputsFromClient(client));
    } else {
      state = {imposeCommun:true, nombreParts:2, revenusCategorises: defaultRevenusCategorises(), chargesDeductibles:0, creditsImpot:0, retenueALaSource:0};
    }

    var clientOptionsHTML = '<option value="">— Aucun / autre —</option>' +
      clients.map(function(c){ return '<option value="' + c.id + '" ' + (c.id===selectedClientId?"selected":"") + '>' + escapeHTML(clientFullName(c)) + '</option>'; }).join("");

    /* ---- Corps de chaque catégorie (sous-champs propres à sa fiscalité) ---- */
    function amountFieldHTML(catId, field, label, value, step){
      return '<div class="field"><label>' + escapeHTML(label) + '</label><div class="input-suffix">' +
        '<input type="number" data-cat="' + catId + '" data-field="' + field + '" value="' + (value||0) + '" step="' + (step||100) + '">' +
        '<span class="suffix">€</span></div></div>';
    }
    function regimeSelectHTML(catId, options, value){
      return '<select data-cat="' + catId + '" data-field="regime">' + options.map(function(o){
        return '<option value="' + o.value + '" ' + (o.value===value?"selected":"") + '>' + escapeHTML(o.label) + '</option>';
      }).join("") + '</select>';
    }
    function catBodyHTML(meta, c){
      if(meta.id === "salaires"){
        return '<div class="form-grid">' +
          amountFieldHTML("salaires", "montantBrut", "Montant brut annuel (avant abattement)", c.montantBrut, 500) +
          '<div class="field"><label class="checkbox-inline"><input type="checkbox" data-cat="salaires" data-field="fraisReels" ' + (c.fraisReels?"checked":"") + '> Frais réels (au lieu de l\'abattement de 10%)</label></div>' +
          (c.fraisReels ? amountFieldHTML("salaires", "montantFraisReels", "Montant des frais réels", c.montantFraisReels, 100) : '') +
        '</div>';
      }
      if(meta.id === "pensions"){
        return '<div class="form-grid">' + amountFieldHTML("pensions", "montant", "Montant annuel brut (abattement 10% appliqué automatiquement)", c.montant, 500) + '</div>';
      }
      if(meta.id === "fonciers"){
        return '<div class="form-grid">' +
          '<div class="field"><label>Régime</label>' + regimeSelectHTML("fonciers", [{value:"micro",label:"Micro-foncier (abattement 30%, ≤ 15 000 €/an)"},{value:"reel",label:"Régime réel (charges déductibles)"}], c.regime) + '</div>' +
          amountFieldHTML("fonciers", "montantBrut", "Revenus fonciers bruts annuels", c.montantBrut, 500) +
          (c.regime==="reel" ? amountFieldHTML("fonciers", "charges", "Charges déductibles (travaux, intérêts d'emprunt...)", c.charges, 500) : '') +
        '</div>';
      }
      if(meta.id === "bic"){
        return '<div class="form-grid">' +
          '<div class="field"><label>Régime</label>' + regimeSelectHTML("bic", [{value:"micro",label:"Micro-BIC"},{value:"reel",label:"Régime réel"}], c.regime) + '</div>' +
          (c.regime==="micro" ? '<div class="field"><label>Type d\'activité</label><select data-cat="bic" data-field="typeActivite">' +
            '<option value="vente" ' + (c.typeActivite==="vente"?"selected":"") + '>Vente / hébergement (abattement 71%)</option>' +
            '<option value="prestation" ' + (c.typeActivite==="prestation"?"selected":"") + '>Prestations de services (abattement 50%)</option>' +
          '</select></div>' : '') +
          amountFieldHTML("bic", "montantBrut", "Chiffre d'affaires / recettes brutes annuelles", c.montantBrut, 500) +
          (c.regime==="reel" ? amountFieldHTML("bic", "charges", "Charges réelles déductibles", c.charges, 500) : '') +
        '</div>';
      }
      if(meta.id === "bnc"){
        return '<div class="form-grid">' +
          '<div class="field"><label>Régime</label>' + regimeSelectHTML("bnc", [{value:"micro",label:"Micro-BNC (abattement 34%)"},{value:"reel",label:"Déclaration contrôlée"}], c.regime) + '</div>' +
          amountFieldHTML("bnc", "montantBrut", "Recettes brutes annuelles", c.montantBrut, 500) +
          (c.regime==="reel" ? amountFieldHTML("bnc", "charges", "Charges réelles déductibles", c.charges, 500) : '') +
        '</div>';
      }
      if(meta.id === "rcm"){
        return '<div class="form-grid">' +
          amountFieldHTML("rcm", "dividendes", "Dividendes annuels", c.dividendes, 100) +
          amountFieldHTML("rcm", "interets", "Intérêts et autres produits à revenu fixe", c.interets, 100) +
          '<div class="field"><label class="checkbox-inline"><input type="checkbox" data-cat="rcm" data-field="optionBareme" ' + (c.optionBareme?"checked":"") + '> Option barème progressif (au lieu du PFU 30%)</label>' +
            '<div class="help">Option globale sur l\'ensemble des revenus de capitaux mobiliers et plus-values de l\'année. Abattement de 40% applicable aux seuls dividendes. Les prélèvements sociaux (17,2%) restent dus dans tous les cas.</div></div>' +
        '</div>';
      }
      if(meta.id === "plusValues"){
        return '<div class="form-grid">' +
          amountFieldHTML("plusValues", "montant", "Plus-values mobilières annuelles", c.montant, 500) +
          '<div class="field"><label class="checkbox-inline"><input type="checkbox" data-cat="plusValues" data-field="optionBareme" ' + (c.optionBareme?"checked":"") + '> Option barème progressif (au lieu du PFU 30%)</label>' +
            '<div class="help">Sans abattement pour durée de détention (cas des titres acquis avant 2018, non modélisé ici). Les prélèvements sociaux (17,2%) restent dus dans tous les cas.</div></div>' +
        '</div>';
      }
      return '';
    }
    function categoryBlockHTML(meta, c){
      return '<details class="revenu-cat-block" data-cat-block="' + meta.id + '" ' + (c.actif?"open":"") + '>' +
        '<summary><label><input type="checkbox" class="revenu-cat-actif" data-cat="' + meta.id + '" data-field="actif" ' + (c.actif?"checked":"") + '> <strong>' + escapeHTML(meta.label) + '</strong></label></summary>' +
        '<div class="revenu-cat-body" ' + (c.actif?"":"hidden") + '>' + catBodyHTML(meta, c) + '</div>' +
      '</details>';
    }

    main.innerHTML = '<div class="container calc-page">' +
      '<a href="#/" class="back-link">← Retour aux outils</a>' +
      '<h1>' + escapeHTML(tool.name) + '</h1>' +
      '<p class="tool-desc">' + escapeHTML(tool.desc) + '</p>' +
      '<div class="client-select-bar">' +
        '<div class="field"><label for="clientSelect">Client (pré-remplissage automatique)</label>' +
        '<select id="clientSelect">' + clientOptionsHTML + '</select></div>' +
        '<a href="#/clients/new" class="link-new-client">+ Nouveau client</a>' +
      '</div>' +
      '<div class="calc-form">' +
        '<div class="form-grid">' +
          '<div class="field"><label class="checkbox-inline"><input type="checkbox" id="ai_imposeCommun" ' + (state.imposeCommun?"checked":"") + '> Imposition commune (couple marié ou pacsé)</label>' +
            '<div class="help">Les concubins ne sont pas imposés en commun : décochez pour simuler chaque personne séparément.</div></div>' +
          '<div class="field"><label for="ai_nombreParts">Nombre de parts fiscales du foyer</label><input type="number" id="ai_nombreParts" value="' + state.nombreParts + '" step="0.5"></div>' +
        '</div>' +
        '<div class="subsection-title">Revenus déclarés par catégorie</div>' +
        '<div id="avisCategoriesWrap">' + REVENU_CATEGORIES_META.map(function(m){ return categoryBlockHTML(m, state.revenusCategorises[m.id]); }).join("") + '</div>' +
        '<div class="subsection-title">Éléments complémentaires (pour l\'export complet)</div>' +
        '<div class="form-grid">' +
          '<div class="field"><label for="ai_chargesDeductibles">Charges déductibles du revenu global</label><div class="input-suffix"><input type="number" id="ai_chargesDeductibles" value="' + state.chargesDeductibles + '" step="100"><span class="suffix">€</span></div></div>' +
          '<div class="field"><label for="ai_creditsImpot">Crédits et réductions d\'impôt</label><div class="input-suffix"><input type="number" id="ai_creditsImpot" value="' + state.creditsImpot + '" step="50"><span class="suffix">€</span></div></div>' +
          '<div class="field"><label for="ai_retenueALaSource">Retenue à la source déjà prélevée</label><div class="input-suffix"><input type="number" id="ai_retenueALaSource" value="' + state.retenueALaSource + '" step="50"><span class="suffix">€</span></div></div>' +
        '</div>' +
      '</div>' +
      (tool.referenceHTML ? '<div class="reference-panel tech-detail">' + tool.referenceHTML + '</div>' : '') +
      '<hr class="sep">' +
      '<div class="key-figures" id="keyFigures"></div>' +
      '<div class="tech-detail" id="detailsArea"></div>' +
      '<div id="summaryArea"></div>' +
      '<div class="warnings" id="warningsArea"></div>' +
      '<div class="actions-bar">' +
        '<div class="field client-field"><label for="clientName">Nom du client (optionnel)</label>' +
        '<input type="text" id="clientName" placeholder="ex. M. Dupont" value="' + (selectedClientId ? escapeHTML(clientFullName(getClientById(selectedClientId))) : "") + '"></div>' +
        '<div class="actions-buttons">' +
          '<button class="btn btn-outline" id="presentBtn" type="button">🖥 Mode présentation</button>' +
          '<button class="btn btn-outline" id="pdfBtn" type="button">⤓ Exporter en PDF</button>' +
          '<button class="btn btn-outline" id="pdfCompletBtn" type="button">📋 Exporter la simulation complète</button>' +
          '<button class="btn btn-primary" id="saveBtn" type="button">💾 Enregistrer pour ce client</button>' +
        '</div>' +
        '<div class="save-msg" id="saveMsg"></div>' +
      '</div>' +
    '</div>';

    var lastInputs = null, lastResult = null;

    function currentInputs(){
      return {
        imposeCommun: state.imposeCommun, nombreParts: state.nombreParts, revenusCategorises: state.revenusCategorises,
        chargesDeductibles: state.chargesDeductibles, creditsImpot: state.creditsImpot, retenueALaSource: state.retenueALaSource
      };
    }

    function recalc(){
      lastInputs = currentInputs();
      lastResult = tool.compute(lastInputs);
      document.getElementById("keyFigures").innerHTML = lastResult.keyFigures.map(function(k){
        return '<div class="key-figure"><div class="value">' + escapeHTML(k.value) + '</div><div class="label">' + escapeHTML(k.label) + '</div></div>';
      }).join("");
      var d = lastResult.details || [];
      document.getElementById("detailsArea").innerHTML = d.length ?
        '<table class="details-table">' + d.map(function(row){ return '<tr><td>' + escapeHTML(row.label) + '</td><td>' + escapeHTML(row.value) + '</td></tr>'; }).join("") + '</table>' : '';
      document.getElementById("summaryArea").innerHTML = lastResult.summaryHTML ? '<p class="summary-sentence">' + lastResult.summaryHTML + '</p>' : '';
      document.getElementById("warningsArea").innerHTML = (lastResult.warnings||[]).map(function(w){ return '<div class="warning">' + escapeHTML(w) + '</div>'; }).join("");
    }

    function renderCategoryBlock(meta){
      var block = main.querySelector('[data-cat-block="' + meta.id + '"]');
      var wasOpen = block.open;
      block.outerHTML = categoryBlockHTML(meta, state.revenusCategorises[meta.id]);
      var newBlock = main.querySelector('[data-cat-block="' + meta.id + '"]');
      newBlock.open = wasOpen || state.revenusCategorises[meta.id].actif;
      wireCategoryBlock(newBlock);
    }

    function wireCategoryBlock(block){
      var catId = block.getAttribute("data-cat-block");
      var actifCb = block.querySelector('.revenu-cat-actif');
      actifCb.addEventListener("click", function(e){ e.stopPropagation(); });
      actifCb.addEventListener("change", function(){
        state.revenusCategorises[catId].actif = actifCb.checked;
        renderCategoryBlock(REVENU_CATEGORIES_META.filter(function(m){ return m.id===catId; })[0]);
        recalc();
      });
      block.querySelectorAll("select[data-cat], input[type=checkbox][data-cat]:not(.revenu-cat-actif)").forEach(function(el){
        el.addEventListener("change", function(){
          var field = el.dataset.field;
          state.revenusCategorises[catId][field] = el.type === "checkbox" ? el.checked : el.value;
          renderCategoryBlock(REVENU_CATEGORIES_META.filter(function(m){ return m.id===catId; })[0]);
          recalc();
        });
      });
      block.querySelectorAll("input[type=number][data-cat]").forEach(function(el){
        el.addEventListener("input", function(){
          state.revenusCategorises[catId][el.dataset.field] = parseFloat(el.value)||0;
          recalc();
        });
      });
    }

    document.getElementById("ai_imposeCommun").addEventListener("change", function(e){ state.imposeCommun = e.target.checked; recalc(); });
    document.getElementById("ai_nombreParts").addEventListener("input", function(e){ state.nombreParts = parseFloat(e.target.value)||1; recalc(); });
    document.getElementById("ai_chargesDeductibles").addEventListener("input", function(e){ state.chargesDeductibles = parseFloat(e.target.value)||0; recalc(); });
    document.getElementById("ai_creditsImpot").addEventListener("input", function(e){ state.creditsImpot = parseFloat(e.target.value)||0; recalc(); });
    document.getElementById("ai_retenueALaSource").addEventListener("input", function(e){ state.retenueALaSource = parseFloat(e.target.value)||0; recalc(); });
    REVENU_CATEGORIES_META.forEach(function(meta){
      wireCategoryBlock(main.querySelector('[data-cat-block="' + meta.id + '"]'));
    });

    document.getElementById("clientSelect").addEventListener("change", function(e){
      selectedClientId = e.target.value;
      var newClient = selectedClientId ? getClientById(selectedClientId) : null;
      if(newClient && hasAnyCategorieActive(newClient.revenusCategorises)){
        state = {
          imposeCommun: newClient.statutCouple === "marie" || newClient.statutCouple === "pacse",
          nombreParts: computePartsFiscalesEstimees(newClient),
          revenusCategorises: mergeCategorises(newClient.revenusCategorises),
          chargesDeductibles:0, creditsImpot:0, retenueALaSource:0
        };
      } else if(newClient){
        state = stateFromInputs(buildAvisImpositionInputsFromClient(newClient));
      } else {
        state = {imposeCommun:true, nombreParts:2, revenusCategorises: defaultRevenusCategorises(), chargesDeductibles:0, creditsImpot:0, retenueALaSource:0};
      }
      document.getElementById("ai_imposeCommun").checked = state.imposeCommun;
      document.getElementById("ai_nombreParts").value = state.nombreParts;
      document.getElementById("ai_chargesDeductibles").value = state.chargesDeductibles;
      document.getElementById("ai_creditsImpot").value = state.creditsImpot;
      document.getElementById("ai_retenueALaSource").value = state.retenueALaSource;
      REVENU_CATEGORIES_META.forEach(renderCategoryBlock);
      document.getElementById("clientName").value = newClient ? clientFullName(newClient) : "";
      recalc();
    });

    document.getElementById("presentBtn").addEventListener("click", enterPresentationMode);
    document.getElementById("pdfBtn").addEventListener("click", function(){
      exportPDF(tool, lastInputs, lastResult, document.getElementById("clientName").value.trim());
    });
    document.getElementById("pdfCompletBtn").addEventListener("click", function(){
      var currentClient = selectedClientId ? getClientById(selectedClientId) : null;
      exportAvisComplet(lastInputs, lastResult, currentClient, document.getElementById("clientName").value.trim());
    });
    document.getElementById("saveBtn").addEventListener("click", function(){
      if(!lastResult) return;
      var clientName = document.getElementById("clientName").value.trim();
      var entry = {
        id: "sim_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
        toolId: tool.id,
        toolName: tool.name,
        clientId: selectedClientId || null,
        clientName: clientName || "(sans nom)",
        timestamp: new Date().toISOString(),
        inputs: lastInputs,
        keyFigures: lastResult.keyFigures
      };
      var msg = document.getElementById("saveMsg");
      if(saveSimulation(entry)){
        // Persiste aussi la ventilation par catégorie sur la fiche client (pas seulement dans l'historique),
        // pour le pré-remplissage automatique des futures ouvertures de cet outil et du rapport patrimonial.
        if(selectedClientId){
          var clientToUpdate = getClientById(selectedClientId);
          if(clientToUpdate){
            saveClient(Object.assign({}, clientToUpdate, {revenusCategorises: state.revenusCategorises, updatedAt: new Date().toISOString()}));
          }
        }
        msg.textContent = "Simulation enregistrée ✓";
        setTimeout(function(){ msg.textContent = ""; }, 2500);
      }
    });

    recalc();
  }

  /* ============================ Home view ============================ */
  // Rassemble les "prochaines actions" saisies dans l'historique des échanges de tous les clients, triées
  // par date la plus proche — alimente le widget d'accueil "Actions à venir".
  function collectActionsAVenir(){
    var actions = [];
    getClients().forEach(function(c){
      (c.historique||[]).forEach(function(e){
        if(e.prochaineActionDate){
          actions.push({clientId:c.id, clientName: clientFullName(c), date: e.prochaineActionDate, texte: e.prochaineActionTexte||""});
        }
      });
    });
    actions.sort(function(a,b){ return a.date.localeCompare(b.date); });
    return actions;
  }

  function actionsAVenirHTML(){
    var actions = collectActionsAVenir();
    if(!actions.length) return "";
    var todayStr = new Date().toISOString().slice(0,10);
    var in7Str = new Date(Date.now()+7*86400000).toISOString().slice(0,10);
    return '<section class="category-section actions-a-venir">' +
      '<h2 class="category-title"><span class="cat-icon">📌</span>Actions à venir</h2>' +
      '<div class="actions-list">' +
        actions.map(function(a){
          var urgency = a.date < todayStr ? "overdue" : (a.date <= in7Str ? "soon" : "");
          return '<a class="action-row ' + urgency + '" href="#/clients/' + a.clientId + '/historique">' +
            '<span class="action-date">' + formatDateFr(a.date) + '</span>' +
            '<span class="action-client">' + escapeHTML(a.clientName) + '</span>' +
            (a.texte ? '<span class="action-texte">' + escapeHTML(a.texte) + '</span>' : '') +
          '</a>';
        }).join("") +
      '</div>' +
    '</section>';
  }

  /* ============================ History view ============================ */
  function renderHistorique(){
    var main = document.getElementById("main");
    main.innerHTML = '<div class="container historique">' +
      '<a href="#/" class="back-link">← Retour aux outils</a>' +

    var sims = getSimulations();

    function draw(filter){
      var list = document.getElementById("simList");
      var filtered = filter ? sims.filter(function(s){ return s.clientName.toLowerCase().indexOf(filter.toLowerCase()) !== -1; }) : sims;
      if(!filtered.length){ list.innerHTML = '<p class="empty">Aucune simulation enregistrée.</p>'; return; }
      list.innerHTML = filtered.map(function(s){
        var kf = (s.keyFigures||[]).map(function(k){ return escapeHTML(k.label) + ' : <strong>' + escapeHTML(k.value) + '</strong>'; }).join(" · ");
        return '<div class="sim-row">' +

            '<div class="sim-client">' + escapeHTML(s.clientName) + '</div>' +

            '<div class="sim-kf">' + kf + '</div>' +
          '</div>' +
          '<div class="sim-actions">' +
            '<button class="btn btn-outline btn-sm" data-open="' + s.id + '">Ouvrir</button>' +
            '<button class="btn btn-danger btn-sm" data-del="' + s.id + '">Supprimer</button>' +
          '</div>' +
        '</div>';
      }).join("");

      list.querySelectorAll("[data-open]").forEach(function(b){
        b.addEventListener("click", function(){

          if(sim) location.hash = "#/calc/" + sim.toolId + "/" + sim.id;
        });
      });
      list.querySelectorAll("[data-del]").forEach(function(b){

            deleteSimulation(b.dataset.del);
