<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>CGP Pro — Outils d'aide au rendez-vous client</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --navy:#122b46;
    --navy-2:#1c3f63;
    --ink:#1a2330;
    --muted:#5b6b7c;
    --bg:#f4f6f8;
    --card:#ffffff;
    --border:#e1e6ec;
    --accent:#9c7a3c;
    --accent-2:#0f7a72;
    --danger:#b3422c;
    --radius:10px;
    --shadow:0 1px 3px rgba(20,30,50,0.08), 0 1px 2px rgba(20,30,50,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.4;
  }
  .container{max-width:960px;margin:0 auto;padding:28px 20px 60px;}
  a{color:inherit;}

  /* Topbar */
  .topbar{background:var(--navy);color:#fff;}
  .topbar-inner{max-width:960px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;}
  .brand{font-size:1.15rem;font-weight:700;letter-spacing:.02em;text-decoration:none;color:#fff;}
  .brand-sub{font-size:.7rem;opacity:.75;font-weight:400;display:block;margin-top:-2px;}
  .topbar nav{display:flex;gap:18px;}
  .nav-link{text-decoration:none;color:#dfe7ef;font-size:.9rem;font-weight:600;}
  .nav-link:hover{color:#fff;}

  /* Home */
  .home-intro h1{font-size:1.5rem;margin:0 0 4px;}
  .home-intro p{color:var(--muted);margin:0 0 24px;}
  .category-section{margin-bottom:30px;}
  .category-title{font-size:1.05rem;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--navy);border-bottom:1px solid var(--border);padding-bottom:8px;}
  .cat-icon{font-size:1.2rem;}
  .tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
  .tool-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:box-shadow .15s, transform .15s;position:relative;}
  .tool-card:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:#c7d1dc;}
  .tool-card.soon{opacity:.6;cursor:default;}
  .tool-card.soon:hover{box-shadow:none;transform:none;}
  .tool-card .icon{font-size:1.5rem;margin-bottom:6px;}
  .tool-name{font-weight:700;font-size:.95rem;margin-bottom:4px;}
  .tool-desc-short{font-size:.8rem;color:var(--muted);}
  .badge-soon{display:inline-block;margin-top:8px;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#eef1f5;color:var(--muted);padding:3px 8px;border-radius:20px;}

  /* Calculator page */
  .back-link{display:inline-block;margin-bottom:14px;font-size:.85rem;color:var(--navy-2);text-decoration:none;font-weight:600;}
  .calc-page h1{font-size:1.4rem;margin:0 0 6px;}
  .tool-desc{color:var(--muted);margin:0 0 20px;font-size:.92rem;}
  .calc-form{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 20px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
  .field[hidden]{display:none !important;}
  .reference-panel{background:#fbf3e7;border:1px solid #eadfc7;border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;font-size:.85rem;color:#5b4a26;}
  .reference-panel h3{margin:0 0 8px;font-size:.9rem;color:#7a5b1c;}
  .reference-panel table{width:100%;border-collapse:collapse;margin-top:8px;}
  .reference-panel td{padding:5px 8px;border-bottom:1px solid #eadfc7;}
  .reference-panel td:nth-child(2){text-align:right;font-weight:700;white-space:nowrap;}
  .reference-panel td:last-child{text-align:right;font-size:.75rem;color:#8a7038;white-space:nowrap;font-weight:400;}
  .reference-panel .ref-note{margin-top:10px;font-size:.78rem;font-style:italic;}
  .field label{font-size:.82rem;font-weight:600;color:var(--muted);}
  .input-suffix{position:relative;display:flex;align-items:center;}
  .input-suffix input{width:100%;}
  .input-suffix .suffix{position:absolute;right:12px;font-size:.85rem;color:var(--muted);pointer-events:none;}
  input[type=number], input[type=text], select{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;
    font-size:.95rem;background:#fff;color:var(--ink);font-family:inherit;
  }
  input[type=number]{padding-right:44px;}
  .help{font-size:.75rem;color:#8a97a6;}
  .btn{border:none;border-radius:8px;padding:11px 18px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-2);}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--border);}
  .btn-outline:hover{border-color:var(--navy);}
  .btn-danger{background:#fff;color:var(--danger);border:1px solid #edd3cd;}
  .btn-sm{padding:6px 12px;font-size:.8rem;}

  .sep{border:none;border-top:1px solid var(--border);margin:26px 0;}

  /* Results */
  .key-figures{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
  .key-figure{flex:1 1 200px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;}
  .key-figure:first-child{background:var(--navy);color:#fff;border-color:var(--navy);}
  .key-figure .value{font-size:1.7rem;font-weight:800;}
  .key-figure .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;margin-top:6px;opacity:.85;}
  .chart-wrap{max-width:520px;margin:10px auto 28px;}
  .details-table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
  .details-table tr td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.87rem;}
  .details-table tr:last-child td{border-bottom:none;}
  .details-table td:last-child{text-align:right;font-weight:700;color:var(--navy);}
  .warnings{margin-top:16px;}
  .warning{background:#fbf3e7;border:1px solid #eadfc7;color:#7a5b1c;padding:10px 14px;border-radius:8px;font-size:.8rem;margin-bottom:8px;}

  .actions-bar{margin-top:26px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;}
  .client-field{max-width:320px;}
  .actions-buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .save-msg{font-size:.82rem;color:var(--accent-2);font-weight:700;margin-top:8px;min-height:1.2em;}

  /* Historique */
  .sim-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;flex-wrap:wrap;}
  .sim-client{font-weight:700;}
  .sim-tool{font-size:.8rem;color:var(--muted);margin-top:2px;}
  .sim-kf{font-size:.8rem;margin-top:6px;color:var(--ink);}
  .sim-actions{display:flex;gap:8px;}
  .empty{color:var(--muted);font-size:.9rem;}

  /* Presentation mode */
  #presentBar{position:fixed;top:14px;right:14px;z-index:1000;}
  body.presenting .topbar,
  body.presenting .back-link,
  body.presenting .calc-form,
  body.presenting .tech-detail,
  body.presenting .actions-bar,
  body.presenting .tool-desc,
  body.presenting .sep{display:none !important;}
  body.presenting{background:#fff;}
  body.presenting .container{max-width:100%;padding:40px 24px;}
  body.presenting .key-figures{flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:26px;}
  body.presenting .key-figure{width:100%;max-width:520px;padding:34px;}
  body.presenting .key-figure .value{font-size:4rem;}
  body.presenting .key-figure .label{font-size:1.05rem;}
  body.presenting .calc-page h1{text-align:center;font-size:2rem;}

  /* Print */
  .print-report{display:none;}
  @media print{
    body > *:not(.print-report){display:none !important;}
    .print-report{display:block !important;}
    .print-header h1{margin:0;font-size:1.3rem;}
    .print-sub{color:#555;font-size:1.05rem;margin-bottom:14px;}
    .print-meta{font-size:.9rem;margin-bottom:16px;}
    .print-keyfigures{display:flex;gap:16px;margin-bottom:18px;}
    .print-kf{border:1px solid #ccc;border-radius:8px;padding:12px;flex:1;text-align:center;}
    .print-kf-value{font-size:1.3rem;font-weight:800;}
    .print-kf-label{font-size:.72rem;text-transform:uppercase;color:#555;margin-top:4px;}
    .print-chart{max-width:480px;display:block;margin:0 auto 18px;}
    .print-details table, .print-inputs table{width:100%;border-collapse:collapse;font-size:.85rem;margin-bottom:18px;}
    .print-details td, .print-inputs td{padding:6px 8px;border-bottom:1px solid #ddd;}
    .print-footer{font-size:.72rem;color:#777;margin-top:20px;border-top:1px solid #ddd;padding-top:10px;}
  }

  @media (max-width:600px){
    .key-figure .value{font-size:1.4rem;}
    .actions-buttons{flex-direction:column;}
    .actions-buttons .btn{width:100%;}
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">CGP Pro<span class="brand-sub">Outils d'aide au rendez-vous client</span></a>
      <nav>
        <a href="#/" class="nav-link">Accueil</a>
        <a href="#/historique" class="nav-link">Historique clients</a>
      </nav>
    </div>
  </header>

  <main id="main"></main>

  <div id="presentBar" hidden>
    <button id="exitPresentBtn" class="btn btn-outline">✕ Quitter le mode présentation</button>
  </div>

  <div id="printReport" class="print-report"></div>

<script>
(function(){
  "use strict";

  /* ============================ Utilities ============================ */
  var euro = new Intl.NumberFormat("fr-FR", {style:"currency", currency:"EUR", maximumFractionDigits:0});
  var euro2 = new Intl.NumberFormat("fr-FR", {style:"currency", currency:"EUR", maximumFractionDigits:2});
  function pct(v, d){ d = (d===undefined?2:d); return v.toLocaleString("fr-FR", {minimumFractionDigits:d, maximumFractionDigits:d}) + " %"; }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ============================ Local storage ============================ */
  var STORAGE_KEY = "cgppro_simulations_v1";
  function getSimulations(){
    try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveSimulation(entry){
    var all = getSimulations();
    all.unshift(entry);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  }
  function deleteSimulation(id){
    var all = getSimulations().filter(function(s){ return s.id !== id; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  }

  /* ============================ Shared fiscal helpers ============================ */
  // Calcule un impôt par tranches marginales. brackets = [{upTo:N, rate:r}, ..., {upTo:Infinity, rate:r}]
  // upTo est la borne haute (exclusive du haut de tranche suivant), cumulative depuis 0.
  function computeBaremeProgressif(base, brackets){
    var impot = 0, precedent = 0;
    for(var i=0; i<brackets.length; i++){
      var b = brackets[i];
      if(base <= precedent) break;
      var trancheHaute = Math.min(base, b.upTo);
      impot += Math.max(0, trancheHaute - precedent) * b.rate;
      precedent = b.upTo;
    }
    return impot;
  }

  // Fiscalité d'un rachat d'assurance-vie (PS + IR/PFU), régime des versements post-2017 (Art. 125-0 A CGI).
  // Partagée entre le calculateur "Fiscalité assurance-vie" et le comparateur "AV vs PER vs CTO".
  function computeFiscaliteAV(gains, anciennete, situationFamiliale, totalVersements, regimeChoisi, tmi){
    var ps = gains*0.172;
    var ir = 0, abattementApplique = 0, tauxAppliqueLabel = "";

    if(anciennete < 8){
      if(regimeChoisi === "pfu"){ ir = gains*0.128; tauxAppliqueLabel = "PFU 12,8 % sur la totalité des gains"; }
      else { ir = gains*(tmi/100); tauxAppliqueLabel = "Barème progressif à " + tmi + " % sur la totalité des gains"; }
    } else {
      var abattement = situationFamiliale === "couple" ? 9200 : 4600;
      abattementApplique = Math.min(abattement, gains);
      var gainsApresAbat = Math.max(0, gains-abattement);
      if(regimeChoisi === "bareme"){
        ir = gainsApresAbat*(tmi/100);
        tauxAppliqueLabel = "Barème progressif à " + tmi + " % sur les gains après abattement";
      } else {
        var propReduit = totalVersements>0 ? Math.min(1, 150000/totalVersements) : 1;
        var gainsReduit = gainsApresAbat*propReduit;
        var gainsNormal = gainsApresAbat-gainsReduit;
        ir = gainsReduit*0.075 + gainsNormal*0.128;
        tauxAppliqueLabel = gainsNormal>0
          ? "PFU 7,5 % jusqu'à 150 000 € de versements, 12,8 % au-delà, sur les gains après abattement"
          : "PFU taux réduit 7,5 % sur les gains après abattement (versements sous le seuil de 150 000 €)";
      }
    }
    return {ps:ps, ir:ir, total:ps+ir, abattementApplique:abattementApplique, tauxAppliqueLabel:tauxAppliqueLabel};
  }

  /* ============================ Categories ============================ */
  var CATEGORIES = [
    {id:"financement", name:"Financement & crédit", icon:"🏦"},
    {id:"immobilier", name:"Immobilier locatif", icon:"🏠"},
    {id:"epargne", name:"Épargne & fiscalité", icon:"💶"},
    {id:"retraite", name:"Retraite", icon:"👴"},
    {id:"transmission", name:"Transmission & patrimoine", icon:"📜"}
  ];

  /* ============================ Calculators ============================ */
  // Chaque outil "ready" fournit : fields (formulaire générique) + compute(inputs) -> résultats.
  // Les outils "soon" ne sont que des tuiles d'architecture pour les versions suivantes.
  var TOOLS = [

    /* ---------- 1. Capacité d'emprunt ---------- */
    {
      id:"capacite-emprunt", category:"financement", status:"ready", icon:"🏦",
      name:"Capacité d'emprunt",
      desc:"Calcule la mensualité maximale et le montant empruntable à partir des revenus, charges, taux et durée saisis (taux d'endettement 35% par défaut).",
      fields:[
        {id:"revenuNet", label:"Revenus nets mensuels du foyer", type:"number", suffix:"€", default:3000, step:50},
        {id:"revenusLocatifs", label:"Revenus locatifs perçus (optionnel)", type:"number", suffix:"€", default:0, step:50, help:"Pondérés à 70% dans le calcul, comme le font la plupart des banques."},
        {id:"chargesExistantes", label:"Mensualités de crédits en cours", type:"number", suffix:"€", default:0, step:10},
        {id:"tauxEndettement", label:"Taux d'endettement maximum", type:"number", suffix:"%", default:35, step:0.5},
        {id:"tauxInteret", label:"Taux d'intérêt annuel du prêt", type:"number", suffix:"%", default:3.8, step:0.01},
        {id:"tauxAssurance", label:"Taux d'assurance emprunteur annuel", type:"number", suffix:"%", default:0.34, step:0.01},
        {id:"dureeAnnees", label:"Durée du prêt", type:"number", suffix:"ans", default:25, step:1},
        {id:"apport", label:"Apport personnel (optionnel)", type:"number", suffix:"€", default:0, step:1000}
      ],
      compute:function(inputs){
        var revenuPondere = inputs.revenuNet + inputs.revenusLocatifs*0.7;
        var mensualiteMax = revenuPondere*(inputs.tauxEndettement/100) - inputs.chargesExistantes;

        if(mensualiteMax <= 0){
          return {
            keyFigures:[
              {label:"Mensualité maximale", value: euro.format(0)},
              {label:"Montant empruntable", value: euro.format(0)},
              {label:"Budget total d'achat possible", value: euro.format(Math.max(0, inputs.apport))}
            ],
            details:[
              {label:"Revenu pondéré retenu", value: euro.format(revenuPondere)},
              {label:"Charges déjà présentes", value: euro.format(inputs.chargesExistantes)}
            ],
            chart:null,
            warnings:["Le taux d'endettement maximum est déjà atteint ou dépassé par les charges existantes : aucune capacité d'emprunt supplémentaire avec ces paramètres."]
          };
        }

        var r = inputs.tauxInteret/100/12;
        var n = inputs.dureeAnnees*12;
        var ta = inputs.tauxAssurance/100/12;
        var facteurCredit = r>0 ? r/(1-Math.pow(1+r,-n)) : 1/n;
        var denom = facteurCredit + ta;
        var capital = mensualiteMax/denom;
        var mensualiteAssurance = capital*ta;
        var mensualiteCredit = mensualiteMax - mensualiteAssurance;
        var coutTotalCredit = mensualiteMax*n - capital;
        var budgetTotal = capital + (inputs.apport||0);

        return {
          keyFigures:[
            {label:"Mensualité maximale", value: euro.format(mensualiteMax)},
            {label:"Montant empruntable", value: euro.format(capital)},
            {label:"Budget total d'achat possible", value: euro.format(budgetTotal)}
          ],
          details:[
            {label:"Mensualité crédit (hors assurance)", value: euro2.format(mensualiteCredit)},
            {label:"Mensualité assurance emprunteur", value: euro2.format(mensualiteAssurance)},
            {label:"Coût total du crédit (intérêts + assurance)", value: euro.format(coutTotalCredit)},
            {label:"Durée retenue", value: inputs.dureeAnnees + " ans (" + n + " mensualités)"},
            {label:"Revenu pondéré retenu", value: euro.format(revenuPondere)}
          ],
          chart:{
            type:"doughnut",
            labels:["Crédit (hors assurance)","Assurance emprunteur"],
            datasets:[{data:[mensualiteCredit, mensualiteAssurance], backgroundColor:["#122b46","#9c7a3c"]}]
          },
          warnings:[]
        };
      }
    },

    /* ---------- 5. Prêt immobilier — tableau d'amortissement ---------- */
    {
      id:"pret-amortissement", category:"financement", status:"ready", icon:"📅",
      name:"Prêt immobilier — tableau d'amortissement",
      desc:"Calcule la mensualité et l'échéancier annuel complet (capital remboursé / intérêts payés / capital restant dû) d'un prêt à taux fixe et échéances constantes.",
      fields:[
        {id:"capitalEmprunte", label:"Capital emprunté", type:"number", suffix:"€", default:200000, step:1000},
        {id:"tauxInteret", label:"Taux d'intérêt annuel (hors assurance)", type:"number", suffix:"%", default:3.8, step:0.01},
        {id:"tauxAssurance", label:"Taux d'assurance emprunteur annuel", type:"number", suffix:"%", default:0.34, step:0.01, help:"Calculé ici sur le capital initial constant (convention la plus répandue)."},
        {id:"dureeAnnees", label:"Durée du prêt", type:"number", suffix:"ans", default:25, step:1}
      ],
      compute:function(inputs){
        var r = inputs.tauxInteret/100/12;
        var n = inputs.dureeAnnees*12;
        var mensualiteAssurance = inputs.capitalEmprunte*(inputs.tauxAssurance/100/12);
        var mensualiteCredit = r>0 ? inputs.capitalEmprunte*r/(1-Math.pow(1+r,-n)) : inputs.capitalEmprunte/n;
        var mensualiteTotale = mensualiteCredit + mensualiteAssurance;

        // Échéancier mensuel complet, agrégé ensuite par année pour l'affichage.
        var solde = inputs.capitalEmprunte;
        var annees = [];
        var capitalAnnee = 0, interetsAnnee = 0;
        for(var m=1; m<=n; m++){
          var interetMois = solde*r;
          var capitalMois = mensualiteCredit - interetMois;
          solde = Math.max(0, solde - capitalMois);
          capitalAnnee += capitalMois;
          interetsAnnee += interetMois;
          if(m % 12 === 0 || m === n){
            annees.push({annee: Math.ceil(m/12), capitalRembourse: capitalAnnee, interetsPayes: interetsAnnee, resteDu: solde});
            capitalAnnee = 0; interetsAnnee = 0;
          }
        }
        var totalInterets = annees.reduce(function(s,a){ return s+a.interetsPayes; }, 0);
        var totalAssurance = mensualiteAssurance*n;
        var coutTotalCredit = totalInterets + totalAssurance;

        var details = annees.filter(function(a){ return a.annee % 5 === 0 || a.annee === annees.length; }).map(function(a){
          return {label:"Reste dû fin d'année " + a.annee, value: euro.format(a.resteDu)};
        });
        details.push({label:"Total intérêts payés", value: euro.format(totalInterets)});
        details.push({label:"Total assurance payée", value: euro.format(totalAssurance)});

        return {
          keyFigures:[
            {label:"Mensualité totale (crédit + assurance)", value: euro2.format(mensualiteTotale)},
            {label:"Coût total du crédit (intérêts + assurance)", value: euro.format(coutTotalCredit)},
            {label:"Coût total du prêt (capital + coût du crédit)", value: euro.format(inputs.capitalEmprunte + coutTotalCredit)}
          ],
          details: details,
          chart:{
            type:"bar",
            labels: annees.map(function(a){ return "An " + a.annee; }),
            datasets:[
              {label:"Capital remboursé", data: annees.map(function(a){ return Math.round(a.capitalRembourse); }), backgroundColor:"#122b46", stack:"s"},
              {label:"Intérêts payés", data: annees.map(function(a){ return Math.round(a.interetsPayes); }), backgroundColor:"#b3422c", stack:"s"}
            ],
            options:{scales:{x:{stacked:true}, y:{stacked:true}}}
          },
          warnings:["Échéancier à mensualité et taux constants (hors modulation, remboursement anticipé ou taux variable). Assurance calculée sur le capital initial : certains contrats la calculent sur le capital restant dû, ce qui réduit son coût total."]
        };
      }
    },

    /* ---------- 9. Comparateur taux fixe vs variable ---------- */
    {
      id:"taux-fixe-variable", category:"financement", status:"ready", icon:"⚖️",
      name:"Comparateur taux fixe vs variable",
      desc:"Compare le coût total d'un prêt à taux fixe et d'un prêt à taux variable capé, selon une hypothèse d'évolution annuelle du taux (durée conservée, mensualité recalculée chaque année).",
      fields:[
        {id:"capitalEmprunte", label:"Capital emprunté", type:"number", suffix:"€", default:200000, step:1000},
        {id:"dureeAnnees", label:"Durée du prêt", type:"number", suffix:"ans", default:20, step:1},
        {id:"tauxFixe", label:"Taux fixe proposé", type:"number", suffix:"%", default:3.9, step:0.01},
        {id:"tauxVariableInitial", label:"Taux variable initial", type:"number", suffix:"%", default:3.3, step:0.01},
        {id:"variationAnnuelle", label:"Hypothèse de variation annuelle du taux variable", type:"number", suffix:"pt/an", default:0.3, step:0.05, help:"Hypothèse de votre choix (le marché peut aussi bien baisser) : le taux variable réel dépend de l'indice de référence (ex. Euribor), imprévisible."},
        {id:"tauxPlafondCap", label:"Taux plafond (cap)", type:"number", suffix:"%", default:5.3, step:0.1, help:"Plafond contractuel du taux variable (prêt \"capé\")."}
      ],
      compute:function(inputs){
        var n = inputs.dureeAnnees*12;
        var rFixe = inputs.tauxFixe/100/12;
        var mensualiteFixe = rFixe>0 ? inputs.capitalEmprunte*rFixe/(1-Math.pow(1+rFixe,-n)) : inputs.capitalEmprunte/n;
        var totalFixe = mensualiteFixe*n;

        // Prêt variable capé, révisé annuellement : mensualité recalculée chaque année sur le capital restant dû et la durée restante.
        var solde = inputs.capitalEmprunte;
        var totalVariable = 0;
        var mensualitesParAnnee = [];
        var tauxParAnnee = [];
        for(var annee=0; annee<inputs.dureeAnnees; annee++){
          var tauxAnnuel = Math.min(inputs.tauxPlafondCap, inputs.tauxVariableInitial + inputs.variationAnnuelle*annee);
          var rAnnee = tauxAnnuel/100/12;
          var moisRestants = n - annee*12;
          var mensualiteAnnee = rAnnee>0 ? solde*rAnnee/(1-Math.pow(1+rAnnee,-moisRestants)) : solde/moisRestants;
          mensualitesParAnnee.push(mensualiteAnnee);
          tauxParAnnee.push(tauxAnnuel);
          for(var m=0; m<12 && solde>0.01; m++){
            var interet = solde*rAnnee;
            var capitalRembourse = mensualiteAnnee - interet;
            solde = Math.max(0, solde - capitalRembourse);
            totalVariable += mensualiteAnnee;
          }
        }

        var ecart = totalVariable - totalFixe;

        return {
          keyFigures:[
            {label:"Coût total — taux fixe", value: euro.format(totalFixe)},
            {label:"Coût total — taux variable (hypothèse)", value: euro.format(totalVariable)},
            {label:"Écart (variable − fixe)", value: (ecart>=0?"+":"") + euro.format(ecart)}
          ],
          details:[
            {label:"Mensualité fixe (constante)", value: euro2.format(mensualiteFixe)},
            {label:"Mensualité variable — 1ère année", value: euro2.format(mensualitesParAnnee[0])},
            {label:"Mensualité variable — dernière année", value: euro2.format(mensualitesParAnnee[mensualitesParAnnee.length-1])},
            {label:"Taux variable atteint le plafond après", value: (tauxParAnnee.filter(function(t){return t<inputs.tauxPlafondCap;}).length) + " an(s)"}
          ],
          chart:{
            type:"line",
            labels: Array.from({length: inputs.dureeAnnees}, function(_,i){ return "An " + (i+1); }),
            datasets:[
              {label:"Mensualité taux fixe", data: mensualitesParAnnee.map(function(){ return Math.round(mensualiteFixe); }), borderColor:"#122b46", backgroundColor:"rgba(18,43,70,0.1)", tension:0},
              {label:"Mensualité taux variable (hypothèse)", data: mensualitesParAnnee.map(function(m){ return Math.round(m); }), borderColor:"#b3422c", backgroundColor:"rgba(179,66,44,0.1)", tension:0}
            ]
          },
          warnings:["Le taux variable réel dépend de l'évolution d'un indice de marché (ex. Euribor), qui ne peut pas être prédit : ceci est une simulation sous hypothèse, pas une prévision. Le taux fixe élimine ce risque mais part généralement d'un niveau plus élevé que le taux variable initial."]
        };
      }
    },

    /* ---------- 12. Simulateur SCPI ---------- */
    {
      id:"scpi", category:"immobilier", status:"ready", icon:"🏢",
      name:"Simulateur SCPI",

      fields:[

        {id:"modeDetention", label:"Mode de détention", type:"select", default:"direct", options:[
          {value:"direct", label:"Détention directe (revenus fonciers)"},

      ],
      compute:function(inputs){
        var revenuAnnuelBrut = inputs.montantInvesti*inputs.tauxDistribution/100;
        var warnings = ["Le taux de distribution est une hypothèse (historique ou cible de la SCPI), non garantie : le rendement réel peut être inférieur, y compris négatif en cas de baisse de la valeur des parts. SCPI = placement long terme, peu liquide, avec risque de perte en capital."];

        if(inputs.modeDetention === "assurance-vie"){
          var cumulBrut = revenuAnnuelBrut*inputs.dureeAnnees;
          warnings.push("Au sein d'une assurance-vie, les revenus de SCPI ne sont pas fiscalisés annuellement : la fiscalité (PFU ou barème + prélèvements sociaux) ne s'applique qu'au rachat, sur les gains — voir le calculateur \"Fiscalité assurance-vie\".");
          return {
            keyFigures:[
              {label:"Revenu annuel brut estimé", value: euro.format(revenuAnnuelBrut)},
              {label:"Revenus cumulés sur " + inputs.dureeAnnees + " ans (non fiscalisés en détention)", value: euro.format(cumulBrut)},

          var n = inputs.dureeAnnees*12;
          var mensualiteCredit = r>0 ? inputs.montantInvesti*r/(1-Math.pow(1+r,-n)) : inputs.montantInvesti/n;
          var mensualiteCreditAnnuelle = mensualiteCredit*12;
          var cashflowAnnuelAvantImpot = revenuAnnuelBrut - mensualiteCreditAnnuelle;
          var cashflowAnnuelApresImpot = revenuNetFiscal - mensualiteCreditAnnuelle;
          warnings.push("Les intérêts d'emprunt sont en réalité déductibles des revenus fonciers (effet de levier fiscal), ce qui réduit l'impôt réel : non modélisé ici par simplification (impôt calculé comme en détention directe sans effet de levier).");
          return {
            keyFigures:[
              {label:"Cashflow mensuel avant impôt", value: euro2.format(cashflowAnnuelAvantImpot/12)},
              {label:"Cashflow mensuel après impôt (hors levier fiscal)", value: euro2.format(cashflowAnnuelApresImpot/12)},
              {label:"Mensualité de crédit", value: euro2.format(mensualiteCredit)}
            ],
            details:[
              {label:"Revenu annuel brut estimé", value: euro.format(revenuAnnuelBrut)},
              {label:"Revenu net de fiscalité (avant crédit)", value: euro.format(revenuNetFiscal)},
              {label:"Coût annuel du crédit", value: euro.format(mensualiteCreditAnnuelle)}
            ],
            chart:{
              type:"bar",
              labels:["Revenu annuel brut","Coût annuel du crédit","Cashflow net (hors levier fiscal)"],
              datasets:[{label:"€ / an", data:[Math.round(revenuAnnuelBrut), Math.round(mensualiteCreditAnnuelle), Math.round(cashflowAnnuelApresImpot)], backgroundColor:["#122b46","#b3422c","#0f7a72"]}]
            },
            warnings: warnings
          };
        }

        return {
          keyFigures:[
            {label:"Revenu net annuel estimé", value: euro.format(revenuNetFiscal)},
            {label:"Revenus nets cumulés sur " + inputs.dureeAnnees + " ans", value: euro.format(cumulNet)},
            {label:"Revenu net mensuel moyen", value: euro2.format(revenuNetFiscal/12)}
          ],
          details:[
            {label:"Revenu annuel brut estimé", value: euro.format(revenuAnnuelBrut)},
            {label:"Fiscalité appliquée (TMI + prélèvements sociaux 17,2%)", value: pct(inputs.tmi+17.2)},
            {label:"Montant investi", value: euro.format(inputs.montantInvesti)}
          ],
          chart:{
            type:"doughnut",
            labels:["Revenu net","Impôt et prélèvements sociaux"],
            datasets:[{data:[revenuNetFiscal, revenuAnnuelBrut-revenuNetFiscal], backgroundColor:["#0f7a72","#b3422c"]}]
          },
          warnings: warnings
        };
      }
    },

    /* ---------- 13. Comparateur LMNP vs location nue ---------- */
    {
      id:"lmnp-vs-nue", category:"immobilier", status:"ready", icon:"🛋️",
      name:"Comparateur LMNP vs location nue",
      desc:"Compare le revenu net décaissé entre location meublée (LMNP, micro-BIC ou réel avec amortissement) et location nue (micro-foncier ou réel), en retenant le régime le plus favorable pour chacune.",
      fields:[
        {id:"loyerAnnuelBrut", label:"Loyer annuel brut (hors charges)", type:"number", suffix:"€", default:12000, step:200},
        {id:"chargesAnnuelles", label:"Charges annuelles réelles (copro, entretien, assurance, gestion...)", type:"number", suffix:"€", default:2000, step:100},
        {id:"prixBienAmortissable", label:"Valeur amortissable du bien (hors terrain, LMNP réel)", type:"number", suffix:"€", default:170000, step:1000, help:"Environ 80-85% du prix d'achat (le terrain n'est pas amortissable)."},
        {id:"dureeAmortissementAns", label:"Durée d'amortissement retenue", type:"number", suffix:"ans", default:25, step:1},
        {id:"tmi", label:"Tranche marginale d'imposition", type:"number", suffix:"%", default:30, step:1}
      ],
      compute:function(inputs){
        var tauxGlobal = inputs.tmi/100 + 0.172;
        var amortissementAnnuel = inputs.prixBienAmortissable/inputs.dureeAmortissementAns;

        // LMNP micro-BIC : abattement forfaitaire de 50% (plafond de recettes non vérifié ici)
        var baseLmnpMicro = inputs.loyerAnnuelBrut*0.5;
        var impotLmnpMicro = baseLmnpMicro*tauxGlobal;
        var netLmnpMicro = inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - impotLmnpMicro;

        // LMNP réel : charges réelles + amortissement déductibles (non reportable en déficit au-delà du résultat, simplifié ici)
        var baseLmnpReel = Math.max(0, inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - amortissementAnnuel);
        var impotLmnpReel = baseLmnpReel*tauxGlobal;
        var netLmnpReel = inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - impotLmnpReel;

        // Nue micro-foncier : abattement forfaitaire de 30%
        var baseNueMicro = inputs.loyerAnnuelBrut*0.7;
        var impotNueMicro = baseNueMicro*tauxGlobal;
        var netNueMicro = inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - impotNueMicro;

        // Nue réel : charges réelles déductibles (pas d'amortissement en foncier)
        var baseNueReel = Math.max(0, inputs.loyerAnnuelBrut - inputs.chargesAnnuelles);
        var impotNueReel = baseNueReel*tauxGlobal;
        var netNueReel = inputs.loyerAnnuelBrut - inputs.chargesAnnuelles - impotNueReel;

        var meilleurLmnp = netLmnpReel >= netLmnpMicro ? {net:netLmnpReel, regime:"réel (amortissement)", impot:impotLmnpReel} : {net:netLmnpMicro, regime:"micro-BIC (abattement 50%)", impot:impotLmnpMicro};
        var meilleurNue = netNueReel >= netNueMicro ? {net:netNueReel, regime:"réel", impot:impotNueReel} : {net:netNueMicro, regime:"micro-foncier (abattement 30%)", impot:impotNueMicro};

        return {
          keyFigures:[
            {label:"LMNP — net décaissé (meilleur régime)", value: euro.format(meilleurLmnp.net)},
            {label:"Location nue — net décaissé (meilleur régime)", value: euro.format(meilleurNue.net)},
            {label:"Écart en faveur du LMNP", value: (meilleurLmnp.net-meilleurNue.net>=0?"+":"") + euro.format(meilleurLmnp.net-meilleurNue.net)}
          ],
          details:[
            {label:"LMNP — régime le plus favorable", value: meilleurLmnp.regime},
            {label:"LMNP micro-BIC — net décaissé", value: euro.format(netLmnpMicro)},
            {label:"LMNP réel — net décaissé", value: euro.format(netLmnpReel)},
            {label:"Location nue — régime le plus favorable", value: meilleurNue.regime},
            {label:"Nue micro-foncier — net décaissé", value: euro.format(netNueMicro)},
            {label:"Nue réel — net décaissé", value: euro.format(netNueReel)},
            {label:"Amortissement annuel retenu (LMNP réel)", value: euro.format(amortissementAnnuel)}
          ],
          chart:{
            type:"bar",
            labels:["LMNP micro-BIC","LMNP réel","Nue micro-foncier","Nue réel"],
            datasets:[{label:"Net décaissé (€/an)", data:[netLmnpMicro,netLmnpReel,netNueMicro,netNueReel].map(Math.round), backgroundColor:["#9c7a3c","#122b46","#c9a87c","#0f7a72"]}]
          },
          warnings:["Comparaison simplifiée : ne modélise pas le report de déficit foncier/BIC sur les années suivantes, la CFE (LMNP), ni la reprise d'amortissement à la revente (le LMNP réel diffère l'impôt, il ne l'annule pas forcément à long terme). Amortissement en ligne droite simplifié (un seul taux, sans distinguer structure/mobilier/équipements)."]
        };
      }
    },
    /* ---------- 7. Plus-value immobilière ---------- */
    {
      id:"plus-value-immo", category:"immobilier", status:"ready", icon:"📈",
      name:"Plus-value immobilière",
      desc:"Calcule l'impôt sur la plus-value de cession (IR 19% + prélèvements sociaux 17,2% + surtaxe éventuelle), avec abattements pour durée de détention (exonération IR à 22 ans, PS à 30 ans).",
      fields:[
        {id:"prixVente", label:"Prix de vente", type:"number", suffix:"€", default:350000, step:1000},
        {id:"prixAchat", label:"Prix d'acquisition initial", type:"number", suffix:"€", default:200000, step:1000},
        {id:"fraisAcquisitionPct", label:"Frais d'acquisition (forfait, % du prix d'achat)", type:"number", suffix:"%", default:7.5, step:0.5, help:"7,5% forfaitaire usuel si les frais réels sont inconnus/inférieurs."},
        {id:"montantTravaux", label:"Travaux (montant réel, optionnel)", type:"number", suffix:"€", default:0, step:1000, help:"Ou forfait de 15% du prix d'achat si détention > 5 ans et sans factures : à saisir manuellement."},
        {id:"dureeDetention", label:"Durée de détention", type:"number", suffix:"ans", default:15, step:1},
        {id:"residencePrincipale", label:"Résidence principale du vendeur", type:"select", default:"non", options:[
          {value:"non", label:"Non (exonération non applicable)"},
          {value:"oui", label:"Oui (exonération totale)"}
        ]}
      ],
      compute:function(inputs){
        var warnings = ["Calcul simplifié (régime des particuliers, Art. 150 U à 150 VH et 1609 nonies G du CGI). Ne couvre pas les autres cas d'exonération (1re cession hors RP sous condition, retraités/invalides de condition modeste, terrains à bâtir spécifiques...). À valider avec un notaire avant toute décision."];

        if(inputs.residencePrincipale === "oui"){
          var plusValueIndicative = Math.max(0, inputs.prixVente - (inputs.prixAchat*(1+inputs.fraisAcquisitionPct/100) + inputs.montantTravaux));
          return {
            keyFigures:[
              {label:"Impôt total sur la plus-value", value: euro.format(0)},
              {label:"Plus-value brute", value: euro.format(plusValueIndicative)},
              {label:"Montant net après impôt", value: euro.format(inputs.prixVente)}
            ],
            details:[{label:"Motif", value:"Résidence principale : exonération totale (Art. 150 U II-1° CGI)"}],
            chart:null,
            warnings: warnings
          };
        }

        var prixAcquisitionMajore = inputs.prixAchat*(1+inputs.fraisAcquisitionPct/100) + inputs.montantTravaux;
        var plusValueBrute = Math.max(0, inputs.prixVente - prixAcquisitionMajore);

        function abattementIR(n){ if(n<6) return 0; if(n<22) return (n-5)*6; return 100; }
        function abattementPS(n){
          if(n<6) return 0;
          if(n<=21) return (n-5)*1.65;
          if(n===22) return 28;
          if(n<30) return 28 + (n-22)*9;
          return 100;
        }
        var n = inputs.dureeDetention;
        var gainsIR = plusValueBrute*(1-abattementIR(n)/100);
        var gainsPS = plusValueBrute*(1-abattementPS(n)/100);
        var impotIR = gainsIR*0.19;
        var prelevSociaux = gainsPS*0.172;

        // Surtaxe sur les plus-values élevées (Art. 1609 nonies G CGI), assise sur la plus-value imposable à l'IR.
        function computeSurtaxe(pv){
          if(pv<=50000) return 0;
          if(pv<=60000) return 0.02*pv - (60000-pv)*1/20;
          if(pv<=100000) return 0.02*pv;
          if(pv<=110000) return 0.03*pv - (110000-pv)*1/10;
          if(pv<=150000) return 0.03*pv;
          if(pv<=160000) return 0.04*pv - (160000-pv)*15/100;
          if(pv<=200000) return 0.04*pv;
          if(pv<=210000) return 0.05*pv - (210000-pv)*20/100;
          if(pv<=250000) return 0.05*pv;
          if(pv<=260000) return 0.06*pv - (260000-pv)*25/100;
          return 0.06*pv;
        }
        var surtaxe = computeSurtaxe(gainsIR);
        var totalImpot = impotIR + prelevSociaux + surtaxe;
        var net = inputs.prixVente - totalImpot;

        return {
          keyFigures:[
            {label:"Impôt total sur la plus-value", value: euro.format(totalImpot)},
            {label:"Plus-value brute", value: euro.format(plusValueBrute)},
            {label:"Montant net après impôt", value: euro.format(net)}
          ],
          details:[
            {label:"Prix d'acquisition majoré (frais + travaux)", value: euro.format(prixAcquisitionMajore)},
            {label:"Abattement pour durée de détention (IR)", value: pct(Math.min(100,abattementIR(n)), 1)},
            {label:"Abattement pour durée de détention (PS)", value: pct(Math.min(100,abattementPS(n)), 1)},
            {label:"Plus-value imposable à l'IR (19%)", value: euro.format(gainsIR)},
            {label:"Plus-value imposable aux PS (17,2%)", value: euro.format(gainsPS)},
            {label:"Impôt sur le revenu (19%)", value: euro.format(impotIR)},
            {label:"Prélèvements sociaux (17,2%)", value: euro.format(prelevSociaux)},
            {label:"Surtaxe plus-values élevées", value: euro.format(surtaxe)}
          ],
          chart:{
            type:"doughnut",
            labels:["Net perçu","Impôt sur le revenu","Prélèvements sociaux","Surtaxe"],
            datasets:[{data:[net, impotIR, prelevSociaux, surtaxe], backgroundColor:["#0f7a72","#b3422c","#9c7a3c","#5b6b7c"]}]
          },
          warnings: warnings
        };
      }
    },

      ],

        // 3 trajectoires : sans aucun frais / avec frais de gestion seuls / avec frais de gestion + frais sur versement

        var m10 = milestone(10), m20 = milestone(20), m30 = milestone(30);

    {

      fields:[
        {id:"capitalVerse", label:"Capital versé (total des versements)", type:"number", suffix:"€", default:50000, step:1000},
        {id:"gains", label:"Gains (plus-value) au moment de la sortie", type:"number", suffix:"€", default:20000, step:500},

        {id:"situationFamiliale", label:"Situation familiale (abattement AV après 8 ans)", type:"select", default:"seul", options:[
          {value:"seul", label:"Célibataire (abattement 4 600 €)"},
          {value:"couple", label:"Couple imposé en commun (abattement 9 200 €)"}
        ]},
        {id:"perVersementsDeduits", label:"PER : versements déduits du revenu imposable à l'entrée ?", type:"select", default:"oui", options:[
          {value:"oui", label:"Oui (cas le plus fréquent)"},
          {value:"non", label:"Non (versements non déduits)"}
        ]},
        {id:"tmiEntree", label:"TMI au moment du versement (déduction PER)", type:"number", suffix:"%", default:30, step:1, help:"Souvent plus élevée qu'à la retraite : c'est l'avantage recherché du PER (déduire à un TMI haut, sortir à un TMI plus bas)."},
        {id:"regimeChoisi", label:"Régime d'imposition des gains (PFU ou barème)", type:"select", default:"pfu", options:[

          {value:"bareme", label:"Barème progressif de l'IR + 17,2% PS"}
        ]},
        {id:"tmiSortie", label:"TMI à la sortie", type:"number", suffix:"%", default:30, step:1}
      ],
      compute:function(inputs){
        var montantTotal = inputs.capitalVerse + inputs.gains;

        // Assurance-vie : réutilise la même logique que le calculateur dédié.
        var av = computeFiscaliteAV(inputs.gains, inputs.dureeDetention, inputs.situationFamiliale, inputs.capitalVerse, inputs.regimeChoisi, inputs.tmiSortie);
        var netAV = montantTotal - av.total;

        // PER (sortie en capital) : part correspondant aux versements déductibles imposée au barème (sans PS) ; gains au PFU/barème + PS (Art. 158 CGI).
        var impotCapitalPER = inputs.perVersementsDeduits === "oui" ? inputs.capitalVerse*(inputs.tmiSortie/100) : 0;
        var impotGainsPER = inputs.regimeChoisi === "pfu" ? inputs.gains*0.30 : inputs.gains*(inputs.tmiSortie/100 + 0.172);

        var economieImpotEntree = inputs.perVersementsDeduits === "oui" ? inputs.capitalVerse*(inputs.tmiEntree/100) : 0;

        // CTO : gains toujours au PFU/barème + PS, aucun abattement lié à la durée, aucune déduction à l'entrée.
        var impotGainsCTO = inputs.regimeChoisi === "pfu" ? inputs.gains*0.30 : inputs.gains*(inputs.tmiSortie/100 + 0.172);

            {label:"PER — impôt sur le capital à la sortie (TMI sortie)", value: euro.format(impotCapitalPER)},
            {label:"PER — impôt sur les gains à la sortie", value: euro.format(impotGainsPER)},
            {label:"PER — économie d'impôt à l'entrée (TMI entrée)", value: euro.format(economieImpotEntree)}
          ],
          chart:{
            type:"bar",
            labels:["Assurance-vie","CTO","PER — sortie seule","PER — bilan global"],
            datasets:[{label:"Net perçu (€)", data:[Math.round(netAV), Math.round(netCTO), Math.round(netPERSortie), Math.round(netPERGlobal)], backgroundColor:["#0f7a72","#122b46","#c9a87c","#9c7a3c"]}]
          },
          warnings: warnings
        };
      }
    },

    /* ---------- 15. Simulateur DCA vs versement unique ---------- */

      fields:[

        {id:"rendementAnnuelMoyen", label:"Rendement annuel moyen (hypothèse)", type:"number", suffix:"%", default:6, step:0.5},

        {id:"dureeBaisseMois", label:"Durée de la baisse avant reprise de la tendance", type:"number", suffix:"mois", default:3, step:1}
      ],
      compute:function(inputs){

        var versementMensuel = inputs.montantTotal/n;
        var dureeBaisse = Math.min(inputs.dureeBaisseMois, n);
        var factorAuCreux = 1 - inputs.baisseInitiale/100;

        function factorConstant(t){ return Math.pow(1+tauxMensuel, t); }
        function factorCrash(t){
          if(dureeBaisse<=0) return factorConstant(t);
          if(t<=dureeBaisse){ return 1 + (factorAuCreux-1)*(t/dureeBaisse); }
          return factorAuCreux*Math.pow(1+tauxMensuel, t-dureeBaisse);
        }

        // Simule les deux stratégies pour un chemin de marché donné (indice de valeur, base 1 à t=0).
        function simuler(factorFn){
          var trajUnique = [inputs.montantTotal*factorFn(0)];
          var trajDCA = [0];
          var dcaValue = 0;
          for(var t=1; t<=n; t++){
            var rPeriode = factorFn(t)/factorFn(t-1) - 1;
            dcaValue = dcaValue*(1+rPeriode) + versementMensuel;
            trajDCA.push(dcaValue);
            trajUnique.push(inputs.montantTotal*factorFn(t));
          }
          return {unique: trajUnique[n], dca: trajDCA[n], trajUnique: trajUnique, trajDCA: trajDCA};
        }

        var constant = simuler(factorConstant);
        var crash = simuler(factorCrash);
        var ecartConstant = constant.unique - constant.dca;
        var ecartCrash = crash.unique - crash.dca;

        return {
          keyFigures:[
            {label:"Écart si baisse de " + inputs.baisseInitiale + "% au démarrage (unique − DCA)", value: (ecartCrash>=0?"+":"") + euro.format(ecartCrash)},
            {label:"Versement unique — scénario constant", value: euro.format(constant.unique)},
            {label:"DCA — scénario constant", value: euro.format(constant.dca)}
          ],
          details:[
            {label:"Versement mensuel en DCA", value: euro2.format(versementMensuel)},
            {label:"Écart en scénario constant (unique − DCA)", value: (ecartConstant>=0?"+":"") + euro.format(ecartConstant)},
            {label:"Versement unique — avec baisse au démarrage", value: euro.format(crash.unique)},
            {label:"DCA — avec baisse au démarrage", value: euro.format(crash.dca)},
            {label:"Niveau du marché au plus bas de la baisse", value: pct(-inputs.baisseInitiale, 0)}
          ],
          chart:{
            type:"line",
            labels: Array.from({length: n+1}, function(_,i){ return String(i); }),
            datasets:[
              {label:"Versement unique (avec baisse au démarrage)", data: crash.trajUnique.map(Math.round), borderColor:"#122b46", backgroundColor:"rgba(18,43,70,0.08)", tension:0.1},
              {label:"DCA (avec baisse au démarrage)", data: crash.trajDCA.map(Math.round), borderColor:"#0f7a72", backgroundColor:"rgba(15,122,114,0.08)", tension:0.1}
            ]
          },
          warnings:["Deux scénarios déterministes, pas une simulation de marché réelle (pas de volatilité aléatoire ni de rebond partiel) : ils illustrent un principe, pas une prévision. Scénario constant : sous rendement positif constant, le versement unique reste toujours au moins aussi favorable que le DCA, puisqu'il est investi plus longtemps — ce n'est pas un argument contre le DCA. Scénario avec baisse au démarrage : montre au contraire l'intérêt réel du DCA, qui n'a pas encore investi tout le capital au moment du creux et limite ainsi la perte, contrairement au versement unique qui encaisse la baisse en totalité dès le premier jour."]
        };
      }
    },

            {label:"Droits de succession", value: euro.format(droits)},
            {label:"Montant net transmis", value: euro.format(net)},
            {label:"Taux moyen d'imposition", value: pct(inputs.montantTransmis>0 ? droits/inputs.montantTransmis*100 : 0, 1)}
          ],
          details:[
            {label:"Part nette taxable reçue", value: euro.format(inputs.montantTransmis)},
            {label:"Abattement applicable", value: euro.format(Math.min(config.abattement, inputs.montantTransmis))},
            {label:"Base taxable après abattement", value: euro.format(baseTaxable)}
          ],
          chart:{
            type:"doughnut",
            labels:["Net transmis","Droits de succession"],
            datasets:[{data:[net, droits], backgroundColor:["#0f7a72","#b3422c"]}]
          },
          warnings: warnings
        };
      }
    },
    {
      id:"demembrement", category:"transmission", status:"ready", icon:"✂️",
      name:"Démembrement de propriété",
      desc:"Répartit la valeur d'un bien entre usufruit et nue-propriété selon l'âge de l'usufruitier, d'après le barème fiscal légal (Art. 669 CGI).",
      fields:[
        {id:"valeurPleinePropriete", label:"Valeur en pleine propriété du bien", type:"number", suffix:"€", default:400000, step:5000},
        {id:"ageUsufruitier", label:"Âge de l'usufruitier", type:"number", suffix:"ans", default:65, step:1}
      ],
      compute:function(inputs){
        var bareme = [
          {max:20, usufruit:90}, {max:30, usufruit:80}, {max:40, usufruit:70}, {max:50, usufruit:60},
          {max:60, usufruit:50}, {max:70, usufruit:40}, {max:80, usufruit:30}, {max:90, usufruit:20},
          {max:Infinity, usufruit:10}
        ];
        var age = inputs.ageUsufruitier;
        var tranche = bareme.filter(function(b){ return age<=b.max; })[0];
        var pctUsufruit = tranche.usufruit;
        var pctNuePropriete = 100-pctUsufruit;
        var valeurUsufruit = inputs.valeurPleinePropriete*pctUsufruit/100;
        var valeurNuePropriete = inputs.valeurPleinePropriete*pctNuePropriete/100;

        return {
          keyFigures:[
            {label:"Valeur de l'usufruit", value: euro.format(valeurUsufruit)},
            {label:"Valeur de la nue-propriété", value: euro.format(valeurNuePropriete)},
            {label:"Répartition appliquée", value: pctUsufruit + " % / " + pctNuePropriete + " %"}
          ],
          details:[
            {label:"Âge de l'usufruitier", value: age + " ans"},
            {label:"Valeur en pleine propriété", value: euro.format(inputs.valeurPleinePropriete)},
            {label:"Part usufruit (barème fiscal)", value: pct(pctUsufruit, 0)},
            {label:"Part nue-propriété (barème fiscal)", value: pct(pctNuePropriete, 0)}
          ],
          chart:{
            type:"doughnut",
            labels:["Usufruit","Nue-propriété"],
            datasets:[{data:[valeurUsufruit, valeurNuePropriete], backgroundColor:["#9c7a3c","#122b46"]}]
          },
          warnings:["Barème fiscal forfaitaire (Art. 669 CGI), utilisé pour les droits d'enregistrement et l'IFI — ne reflète pas la valeur économique réelle de l'usufruit (espérance de vie, rendement du bien), qui peut être évaluée différemment pour d'autres besoins (vente, partage)."]
        };
      }
    }
  ];

  var TOOLS_BY_ID = {};
  TOOLS.forEach(function(t){ TOOLS_BY_ID[t.id] = t; });

  /* ============================ Generic form rendering ============================ */
  function fieldHTML(f, value){
    var val = value !== undefined && value !== null ? value : f.default;
    var wrapAttrs = 'class="field" data-field-wrap="' + f.id + '"' +
      (f.visibleWhen ? ' data-visible-when-field="' + f.visibleWhen.field + '" data-visible-when-values="' + f.visibleWhen.values.join(",") + '"' : '');
    if(f.type === "select"){
      var opts = f.options.map(function(o){
        return '<option value="' + escapeHTML(o.value) + '" ' + (String(o.value)===String(val)?"selected":"") + '>' + escapeHTML(o.label) + '</option>';
      }).join("");
      return '<div ' + wrapAttrs + '><label for="f_' + f.id + '">' + escapeHTML(f.label) + '</label>' +
        '<select id="f_' + f.id + '">' + opts + '</select>' +
        (f.help ? '<div class="help">' + escapeHTML(f.help) + '</div>' : '') + '</div>';
    }
    return '<div ' + wrapAttrs + '><label for="f_' + f.id + '">' + escapeHTML(f.label) + '</label>' +
      '<div class="input-suffix"><input type="number" id="f_' + f.id + '" value="' + escapeHTML(val) + '" step="' + (f.step||"any") + '">' +
      '<span class="suffix">' + escapeHTML(f.suffix||"") + '</span></div>' +
      (f.help ? '<div class="help">' + escapeHTML(f.help) + '</div>' : '') + '</div>';
  }

  // Affiche/masque les champs conditionnels (f.visibleWhen = {field, values}) selon la valeur actuelle du champ contrôleur.
  function applyFieldVisibility(formEl){
    formEl.querySelectorAll("[data-visible-when-field]").forEach(function(wrap){
      var controllerId = wrap.getAttribute("data-visible-when-field");
      var allowedValues = wrap.getAttribute("data-visible-when-values").split(",");
      var controllerEl = document.getElementById("f_" + controllerId);
      var currentValue = controllerEl ? controllerEl.value : null;
      wrap.hidden = allowedValues.indexOf(currentValue) === -1;
    });
  }

  function readInputs(fields){
    var out = {};
    fields.forEach(function(f){
      var elm = document.getElementById("f_" + f.id);
      if(f.type === "select"){ out[f.id] = elm.value; }
      else { out[f.id] = parseFloat(elm.value) || 0; }
    });
    return out;
  }

  function formatInputForPrint(f, v){
    if(f.type === "select"){
      var opt = f.options.filter(function(o){ return String(o.value)===String(v); })[0];
      return opt ? opt.label : v;
    }
    return v + (f.suffix ? (" " + f.suffix) : "");
  }

  /* ============================ Chart rendering ============================ */
  var chartInstance = null;
  function renderChart(chartDef){
    var wrap = document.getElementById("chartWrap");
    if(!chartDef || typeof Chart === "undefined"){
      wrap.style.display = "none";
      if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
      return;
    }
    wrap.style.display = "";
    var ctx = document.getElementById("resultChart").getContext("2d");
    if(chartInstance){ chartInstance.destroy(); }
    chartInstance = new Chart(ctx, {
      type: chartDef.type,
      data: {labels: chartDef.labels, datasets: chartDef.datasets},
      options: Object.assign({
        responsive:true,
        plugins:{legend:{position:"bottom", labels:{boxWidth:14, font:{size:11}}}}
      }, chartDef.options||{})
    });
  }

  /* ============================ Presentation mode ============================ */
  function enterPresentationMode(){
    document.body.classList.add("presenting");
    document.getElementById("presentBar").hidden = false;
    var elDoc = document.documentElement;
    if(elDoc.requestFullscreen){ elDoc.requestFullscreen().catch(function(){}); }
  }
  function exitPresentationMode(){
    document.body.classList.remove("presenting");
    document.getElementById("presentBar").hidden = true;
    if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
  }

  /* ============================ PDF export (print) ============================ */
  function exportPDF(tool, inputs, result, clientName){
    if(!result) return;
    var reportEl = document.getElementById("printReport");
    var dateStr = new Date().toLocaleDateString("fr-FR", {year:"numeric", month:"long", day:"numeric"});
    var chartImg = "";
    var canvas = document.getElementById("resultChart");
    if(canvas && result.chart){
      try{ chartImg = '<img src="' + canvas.toDataURL("image/png", 1.0) + '" class="print-chart">'; }
      catch(e){ chartImg = ""; }
    }
    reportEl.innerHTML =
      '<div class="print-header"><h1>CGP Pro</h1><div class="print-sub">' + escapeHTML(tool.name) + '</div></div>' +
      '<div class="print-meta">' +
        (clientName ? '<div><strong>Client :</strong> ' + escapeHTML(clientName) + '</div>' : '') +
        '<div><strong>Date :</strong> ' + dateStr + '</div>' +
      '</div>' +
      '<div class="print-keyfigures">' +
        result.keyFigures.map(function(k){
          return '<div class="print-kf"><div class="print-kf-value">' + escapeHTML(k.value) + '</div><div class="print-kf-label">' + escapeHTML(k.label) + '</div></div>';
        }).join("") +
      '</div>' +
      chartImg +
      '<div class="print-details"><h3>Détail du calcul</h3><table>' +
        (result.details||[]).map(function(d){ return '<tr><td>' + escapeHTML(d.label) + '</td><td>' + escapeHTML(d.value) + '</td></tr>'; }).join("") +
      '</table></div>' +
      '<div class="print-inputs"><h3>Paramètres saisis</h3><table>' +
        tool.fields.map(function(f){ return '<tr><td>' + escapeHTML(f.label) + '</td><td>' + escapeHTML(formatInputForPrint(f, inputs[f.id])) + '</td></tr>'; }).join("") +
      '</table></div>' +
      '<div class="print-footer">Simulation indicative réalisée avec CGP Pro — document à valider avec un conseiller avant toute décision.</div>';
    window.print();
  }

  /* ============================ Calculator page ============================ */
  function mountCalculator(tool, opts){
    var main = document.getElementById("main");
    var prefill = opts.prefill || null;

    main.innerHTML =
      '<div class="container calc-page">' +
        '<a href="#/" class="back-link">← Retour aux outils</a>' +
        '<h1>' + escapeHTML(tool.name) + '</h1>' +
        '<p class="tool-desc">' + escapeHTML(tool.desc) + '</p>' +
        '<form id="calcForm" class="calc-form"><div class="form-grid">' +
          tool.fields.map(function(f){ return fieldHTML(f, prefill ? prefill[f.id] : undefined); }).join("") +
        '</div><button type="submit" class="btn btn-primary">Calculer</button></form>' +
        (tool.referenceHTML ? '<div class="reference-panel tech-detail">' + tool.referenceHTML + '</div>' : '') +
        '<div id="resultsArea" hidden>' +
          '<hr class="sep">' +
          '<div class="key-figures" id="keyFigures"></div>' +
          '<div class="chart-wrap tech-detail" id="chartWrap"><canvas id="resultChart"></canvas></div>' +
          '<div class="tech-detail" id="detailsArea"></div>' +
          '<div class="warnings" id="warningsArea"></div>' +
          '<div class="actions-bar">' +
            '<div class="field client-field"><label for="clientName">Nom du client (optionnel)</label>' +
            '<input type="text" id="clientName" placeholder="ex. M. Dupont"></div>' +
            '<div class="actions-buttons">' +
              '<button class="btn btn-outline" id="presentBtn" type="button">🖥 Mode présentation</button>' +
              '<button class="btn btn-outline" id="pdfBtn" type="button">⤓ Exporter en PDF</button>' +
              '<button class="btn btn-primary" id="saveBtn" type="button">💾 Enregistrer pour ce client</button>' +
            '</div>' +
            '<div class="save-msg" id="saveMsg"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    var lastInputs = null, lastResult = null;

    function runCompute(){
      lastInputs = readInputs(tool.fields);
      lastResult = tool.compute(lastInputs);
      renderResults(lastResult);
    }

    function renderResults(result){
      document.getElementById("resultsArea").hidden = false;
      document.getElementById("keyFigures").innerHTML = result.keyFigures.map(function(k){
        return '<div class="key-figure"><div class="value">' + escapeHTML(k.value) + '</div><div class="label">' + escapeHTML(k.label) + '</div></div>';
      }).join("");
      var details = result.details || [];
      document.getElementById("detailsArea").innerHTML = details.length ?
        '<table class="details-table">' + details.map(function(d){ return '<tr><td>' + escapeHTML(d.label) + '</td><td>' + escapeHTML(d.value) + '</td></tr>'; }).join("") + '</table>' : '';
      document.getElementById("warningsArea").innerHTML = (result.warnings||[]).map(function(w){ return '<div class="warning">' + escapeHTML(w) + '</div>'; }).join("");
      renderChart(result.chart);
    }

    var calcFormEl = document.getElementById("calcForm");
    applyFieldVisibility(calcFormEl);
    calcFormEl.querySelectorAll("[data-visible-when-field]").forEach(function(wrap){
      var controllerId = wrap.getAttribute("data-visible-when-field");
      var controllerEl = document.getElementById("f_" + controllerId);
      if(controllerEl){ controllerEl.addEventListener("change", function(){ applyFieldVisibility(calcFormEl); }); }
    });

    calcFormEl.addEventListener("submit", function(e){ e.preventDefault(); runCompute(); });
    document.getElementById("presentBtn").addEventListener("click", enterPresentationMode);
    document.getElementById("pdfBtn").addEventListener("click", function(){
      exportPDF(tool, lastInputs, lastResult, document.getElementById("clientName").value.trim());
    });
    document.getElementById("saveBtn").addEventListener("click", function(){
      if(!lastResult) return;
      var clientName = document.getElementById("clientName").value.trim();
      var entry = {
        id: "sim_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
        toolId: tool.id,
        toolName: tool.name,
        clientName: clientName || "(sans nom)",
        timestamp: new Date().toISOString(),
        inputs: lastInputs,
        keyFigures: lastResult.keyFigures
      };
      saveSimulation(entry);
      var msg = document.getElementById("saveMsg");
      msg.textContent = "Simulation enregistrée ✓";
      setTimeout(function(){ msg.textContent = ""; }, 2500);
    });

    if(prefill && opts.autoCompute){ runCompute(); }
  }

  /* ============================ Home view ============================ */
  function renderHome(){
    var main = document.getElementById("main");
    main.innerHTML = '<div class="container home">' +
      '<div class="home-intro"><h1>Boîte à outils CGP</h1><p>Sélectionnez un simulateur pour préparer ou animer votre rendez-vous client.</p></div>' +
      CATEGORIES.map(function(cat){
        var tools = TOOLS.filter(function(t){ return t.category === cat.id; });
        if(!tools.length) return "";
        return '<section class="category-section">' +
          '<h2 class="category-title"><span class="cat-icon">' + cat.icon + '</span>' + escapeHTML(cat.name) + '</h2>' +
          '<div class="tool-grid">' +
            tools.map(function(t){
              return '<div class="tool-card ' + (t.status==="soon"?"soon":"") + '" data-tool="' + t.id + '">' +
                '<div class="icon">' + t.icon + '</div>' +
                '<div class="tool-name">' + escapeHTML(t.name) + '</div>' +
                '<div class="tool-desc-short">' + escapeHTML(t.desc) + '</div>' +
                (t.status==="soon" ? '<span class="badge-soon">Bientôt disponible</span>' : '') +
              '</div>';
            }).join("") +
          '</div></section>';
      }).join("") +
    '</div>';

    main.querySelectorAll(".tool-card:not(.soon)").forEach(function(card){
      card.addEventListener("click", function(){ location.hash = "#/calc/" + card.dataset.tool; });
    });
  }

  /* ============================ History view ============================ */
  function renderHistorique(){
    var main = document.getElementById("main");
    main.innerHTML = '<div class="container historique">' +
      '<a href="#/" class="back-link">← Retour aux outils</a>' +
      '<h1>Historique des simulations</h1>' +
      '<div class="field"><label for="searchClient">Filtrer par client</label><input type="text" id="searchClient" placeholder="Nom du client..."></div>' +
      '<div id="simList"></div>' +
    '</div>';

    var sims = getSimulations();

    function draw(filter){
      var list = document.getElementById("simList");
      var filtered = filter ? sims.filter(function(s){ return s.clientName.toLowerCase().indexOf(filter.toLowerCase()) !== -1; }) : sims;
      if(!filtered.length){ list.innerHTML = '<p class="empty">Aucune simulation enregistrée.</p>'; return; }
      list.innerHTML = filtered.map(function(s){
        var kf = (s.keyFigures||[]).map(function(k){ return escapeHTML(k.label) + ' : <strong>' + escapeHTML(k.value) + '</strong>'; }).join(" · ");
        return '<div class="sim-row">' +
          '<div class="sim-main">' +
            '<div class="sim-client">' + escapeHTML(s.clientName) + '</div>' +
            '<div class="sim-tool">' + escapeHTML(s.toolName) + ' — ' + new Date(s.timestamp).toLocaleString("fr-FR") + '</div>' +
            '<div class="sim-kf">' + kf + '</div>' +
          '</div>' +
          '<div class="sim-actions">' +
            '<button class="btn btn-outline btn-sm" data-open="' + s.id + '">Ouvrir</button>' +
            '<button class="btn btn-danger btn-sm" data-del="' + s.id + '">Supprimer</button>' +
          '</div>' +
        '</div>';
      }).join("");

      list.querySelectorAll("[data-open]").forEach(function(b){
        b.addEventListener("click", function(){
          var sim = sims.filter(function(s){ return s.id === b.dataset.open; })[0];
          if(sim) location.hash = "#/calc/" + sim.toolId + "/" + sim.id;
        });
      });
      list.querySelectorAll("[data-del]").forEach(function(b){
        b.addEventListener("click", function(){
          if(confirm("Supprimer cette simulation ?")){
            deleteSimulation(b.dataset.del);
            renderHistorique();
          }
        });
      });
    }

    draw("");
    document.getElementById("searchClient").addEventListener("input", function(e){ draw(e.target.value); });
  }

  /* ============================ Router ============================ */
  function parseHash(){
    var h = location.hash.replace(/^#\/?/, "");
    var parts = h.split("/").filter(Boolean);
    if(parts[0] === "calc" && parts[1]) return {name:"calc", toolId:parts[1], simId:parts[2]};
    if(parts[0] === "historique") return {name:"historique"};
    return {name:"home"};
  }

  function render(){
    exitPresentationMode();
    var v = parseHash();
    if(v.name === "calc"){
      var tool = TOOLS_BY_ID[v.toolId];
      if(!tool || tool.status === "soon"){ location.hash = ""; return; }
      var prefill = null;
      if(v.simId){
        var sim = getSimulations().filter(function(s){ return s.id === v.simId; })[0];
        if(sim) prefill = sim.inputs;
      }
      mountCalculator(tool, {prefill: prefill, autoCompute: !!prefill});
    } else if(v.name === "historique"){
      renderHistorique();
    } else {
      renderHome();
    }
  }

  window.addEventListener("hashchange", render);
  document.addEventListener("DOMContentLoaded", function(){
    render();
    document.getElementById("exitPresentBtn").addEventListener("click", exitPresentationMode);
    document.addEventListener("fullscreenchange", function(){
      if(!document.fullscreenElement && document.body.classList.contains("presenting")){
        exitPresentationMode();
      }
    });
  });
})();
</script>
</body>
</html>
