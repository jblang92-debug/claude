  /* ============================ Composant réutilisable : composition du foyer ============================ */
  // Monte l'éditeur adultes + enfants dans `container`, pré-rempli depuis `client`. Utilisé par la fiche
  // client et par l'étape "Identité" du Bilan patrimonial. Retourne {getData()} pour récupérer l'état saisi.
  function mountFoyerEditor(container, client){
    var adulte1 = Object.assign({prenom:"", nom:"", age:null, profession:"", revenusPropres:0}, client.adultes && client.adultes[0]);
    var hasAdulte2 = !!(client.adultes && client.adultes[1]);
    var adulte2 = Object.assign({prenom:"", nom:"", age:null, profession:"", revenusPropres:0}, client.adultes && client.adultes[1]);
    var statutCouple = client.statutCouple || "celibataire";
    var regimeMatrimonial = client.regimeMatrimonial || "communaute";
    var regimePacs = client.regimePacs || "separation_patrimoines";
    var enfants = (client.enfants || []).map(function(e){ return Object.assign({prenom:"", age:null, aCharge:true, gardeAlternee:false}, e); });

    function selectHTML(id, list, value){
      return '<select id="' + id + '">' + list.map(function(o){ return '<option value="' + o.value + '" ' + (o.value===value?"selected":"") + '>' + escapeHTML(o.label) + '</option>'; }).join("") + '</select>';
    }

    function adulteBlockHTML(prefix, a, titre){
      return '<div class="subsection-title">' + escapeHTML(titre) + '</div>' +
        '<div class="form-grid">' +
          '<div class="field"><label for="' + prefix + '_prenom">Prénom</label><input type="text" id="' + prefix + '_prenom" value="' + escapeHTML(a.prenom||"") + '"></div>' +
          '<div class="field"><label for="' + prefix + '_nom">Nom</label><input type="text" id="' + prefix + '_nom" value="' + escapeHTML(a.nom||"") + '"></div>' +
          '<div class="field"><label for="' + prefix + '_age">Âge</label><input type="number" id="' + prefix + '_age" value="' + (a.age!=null?a.age:"") + '" step="1"></div>' +
          '<div class="field"><label for="' + prefix + '_profession">Profession</label><input type="text" id="' + prefix + '_profession" value="' + escapeHTML(a.profession||"") + '"></div>' +
          '<div class="field"><label for="' + prefix + '_revenus">Revenus propres (nets mensuels)</label><div class="input-suffix"><input type="number" id="' + prefix + '_revenus" value="' + (a.revenusPropres||0) + '" step="50"><span class="suffix">€</span></div></div>' +
        '</div>';
    }

    function render(){
      container.innerHTML =
        '<div class="subsection-title">Statut du couple</div>' +
        '<div class="form-grid">' +
          '<div class="field"><label for="foyer_statutCouple">Statut</label>' + selectHTML("foyer_statutCouple", STATUTS_COUPLE, statutCouple) + '</div>' +
          '<div class="field" id="foyer_regimeMariageWrap" hidden><label for="foyer_regimeMariage">Régime matrimonial</label>' + selectHTML("foyer_regimeMariage", REGIMES_MARIAGE, regimeMatrimonial) + '</div>' +
          '<div class="field" id="foyer_regimePacsWrap" hidden><label for="foyer_regimePacs">Régime du PACS</label>' + selectHTML("foyer_regimePacs", REGIMES_PACS, regimePacs) + '</div>' +
        '</div>' +
        adulteBlockHTML("foyer_a1", adulte1, "Adulte 1") +
        '<div class="field" style="margin-top:14px;"><label class="checkbox-inline"><input type="checkbox" id="foyer_hasAdulte2" ' + (hasAdulte2?"checked":"") + '> Foyer à deux adultes</label></div>' +
        '<div id="foyer_a2Wrap" ' + (hasAdulte2?"":"hidden") + '>' + adulteBlockHTML("foyer_a2", adulte2, "Adulte 2") + '</div>' +
        '<div class="subsection-title">Enfants</div>' +
        '<div class="repeat-list" id="foyer_enfantsList"></div>' +
        '<button type="button" class="btn btn-outline btn-sm" id="foyer_addEnfant">+ Ajouter un enfant</button>';

      function updateRegimeVisibility(){
        var v = document.getElementById("foyer_statutCouple").value;
        document.getElementById("foyer_regimeMariageWrap").hidden = v !== "marie";
        document.getElementById("foyer_regimePacsWrap").hidden = v !== "pacse";
      }
      updateRegimeVisibility();
      document.getElementById("foyer_statutCouple").addEventListener("change", updateRegimeVisibility);

      document.getElementById("foyer_hasAdulte2").addEventListener("change", function(e){
        document.getElementById("foyer_a2Wrap").hidden = !e.target.checked;
      });

      renderEnfants();
      document.getElementById("foyer_addEnfant").addEventListener("click", function(){
        enfants.push({prenom:"", age:null, aCharge:true, gardeAlternee:false});
        renderEnfants();
      });
    }

    function renderEnfants(){
      var listEl = document.getElementById("foyer_enfantsList");
      listEl.innerHTML = enfants.length ? enfants.map(function(e, i){
        return '<div class="repeat-row">' +
          '<input type="text" placeholder="Prénom" data-enfant-field="prenom" data-i="' + i + '" value="' + escapeHTML(e.prenom||"") + '">' +
          '<input type="number" placeholder="Âge" data-enfant-field="age" data-i="' + i + '" value="' + (e.age!=null?e.age:"") + '" style="max-width:90px;">' +
          '<label class="checkbox-inline"><input type="checkbox" data-enfant-field="aCharge" data-i="' + i + '" ' + (e.aCharge?"checked":"") + '> À charge fiscalement</label>' +

          '<button type="button" class="btn btn-danger btn-sm" data-remove-enfant="' + i + '">×</button>' +
        '</div>';

        };
        var hasA2 = document.getElementById("foyer_hasAdulte2").checked;
        var adultesOut = [a1];
        if(hasA2){
          adultesOut.push({
            prenom: document.getElementById("foyer_a2_prenom").value,

  /* ============================ Composant réutilisable : patrimoine détaillé (actifs) ============================ */
  // Monte la liste d'actifs + tableau récapitulatif croisé + camembert par catégorie. Utilisé par la fiche
  // client et par l'étape "Patrimoine" du Bilan patrimonial. Retourne {getData()}.
  // getOwnersInfo() -> {hasAdulte2, prenom1, prenom2} pilote les libellés propriétaire (Adulte 1/2/Indivision).
  // Par défaut, lit l'état figé de `client.adultes` au montage (cas du Bilan : le foyer a déjà été validé
  // à une étape précédente, sur une autre page). La fiche client passe une version qui lit le DOM en direct,
  // pour refléter immédiatement un changement de "Foyer à deux adultes" fait sur la même page.
  function mountActifsEditor(container, client, getOwnersInfo){
    var actifs = (client.actifs || []).map(function(a){ return Object.assign({libelle:"", montant:0, categorie:"disponibilites", proprietaire:"adulte1", modeDetention:"PP", dateAcquisition:"", notes:""}, a); });
    var recapChartInstance = null;

    getOwnersInfo = getOwnersInfo || function(){
      return {
        hasAdulte2: !!(client.adultes && client.adultes[1]),
        prenom1: (client.adultes && client.adultes[0] && client.adultes[0].prenom) || "Adulte 1",
        prenom2: (client.adultes && client.adultes[1] && client.adultes[1].prenom) || "Adulte 2"
      };
    };

    function proprietaireOptions(){
      var info = getOwnersInfo();
      var opts = [{value:"adulte1", label: info.prenom1 || "Adulte 1"}];
      if(info.hasAdulte2){ opts.push({value:"adulte2", label: info.prenom2 || "Adulte 2"}); }
      opts.push({value:"indivision", label:"Indivision"});
      return opts;
    }

    function render(){
      container.innerHTML =
        '<div class="subsection-title">Actifs détaillés</div>' +
        '<div class="repeat-list" id="actifsList"></div>' +
        '<button type="button" class="btn btn-outline btn-sm" id="actifs_add">+ Ajouter un actif</button>' +
        '<div class="subsection-title">Récapitulatif du patrimoine</div>' +
        '<div class="recap-table-wrap" id="recapTableWrap"></div>' +
        '<div class="recap-chart-wrap"><canvas id="recapChart"></canvas></div>';

      renderActifsList();
      renderRecap();
      document.getElementById("actifs_add").addEventListener("click", function(){
        actifs.push({libelle:"", montant:0, categorie:"disponibilites", proprietaire:"adulte1", modeDetention:"PP", dateAcquisition:"", notes:""});
        renderActifsList();
        renderRecap();
      });
    }

    function renderActifsList(){
      var listEl = document.getElementById("actifsList");
      var ownerOpts = proprietaireOptions();
      listEl.innerHTML = actifs.length ? actifs.map(function(a, i){
        return '<div class="repeat-row">' +

    function renderRecap(){
      var info = getOwnersInfo();
      var tempClient = Object.assign({}, client, {
        adultes: [
          {prenom: info.prenom1 || "Adulte 1"},
          info.hasAdulte2 ? {prenom: info.prenom2 || "Adulte 2"} : null
        ].filter(Boolean),
        actifs: actifs
      });
      var recap = computeRecapPatrimonial(tempClient);
      var wrap = document.getElementById("recapTableWrap");
      wrap.innerHTML = '<table class="recap-table"><thead><tr><th>Catégorie</th>' +
        recap.owners.map(function(o){ return '<th>' + escapeHTML(recap.ownerLabels[o]) + '</th>'; }).join("") +
        '<th>Total</th></tr></thead><tbody>' +
        recap.rows.map(function(r){
          return '<tr><td>' + escapeHTML(r.categorie) + '</td>' +
            recap.owners.map(function(o){ return '<td>' + euro.format(r.values[o]) + '</td>'; }).join("") +
            '<td>' + euro.format(r.total) + '</td></tr>';
        }).join("") +
        '</tbody><tfoot><tr><td>Total</td>' +
        recap.owners.map(function(o){ return '<td>' + euro.format(recap.colTotals[o]) + '</td>'; }).join("") +
        '<td>' + euro.format(recap.grandTotal) + '</td></tr></tfoot></table>';

      if(typeof Chart !== "undefined"){
        var ctx = document.getElementById("recapChart").getContext("2d");
        if(recapChartInstance){ recapChartInstance.destroy(); }
        var nonZero = recap.rows.filter(function(r){ return r.total>0; });
        recapChartInstance = new Chart(ctx, {
          type:"pie",
          data:{
            labels: nonZero.map(function(r){ return r.categorie; }),
            datasets:[{data: nonZero.map(function(r){ return Math.round(r.total); }), backgroundColor:["#122b46","#9c7a3c","#0f7a72","#b3422c","#5b6b7c","#c9a87c","#1c3f63"]}]
          },
          options:{responsive:true, plugins:{legend:{position:"bottom", labels:{boxWidth:12, font:{size:10}}}}}
        });
      }
    }

    render();

    return {
      getData: function(){ return actifs; },
      refreshOwners: function(){ renderActifsList(); renderRecap(); }
    };
  }

  function renderBilan(clientId){
    var client = getClientById(clientId);
    if(!client){ renderBilanPicker(); return; }

    var wip = Object.assign({}, client);
    var currentStep = 0; // index dans BILAN_STEPS

    function stepsIndicatorHTML(){
      return '<div class="wizard-steps">' + BILAN_STEPS.map(function(s, i){
        var cls = i===currentStep ? "active" : (i<currentStep ? "done" : "");
        return '<div class="wizard-step ' + cls + '">' + (i+1) + '. ' + escapeHTML(s) + '</div>';
      }).join("") + '</div>';
    }

    function renderStep(){
      var main = document.getElementById("main");
      var sectionName = BILAN_STEPS[currentStep];
      var isSynthesis = sectionName === "Synthèse";
      var bodyHTML;

      if(isSynthesis){
        var triggeredIds = getTriggeredToolIds(wip);
        var sections = triggeredIds.map(function(id){
          var tool = TOOLS_BY_ID[id];
          var inputs = buildFullInputsFromClient(wip, tool);
          var result = tool.compute(inputs);
          return {tool:tool, inputs:inputs, result:result};
        });

        bodyHTML = !sections.length
          ? '<p class="empty">Aucun projet coché à l\'étape précédente : cochez au moins un projet pour générer une synthèse, ou ouvrez directement un calculateur depuis l\'accueil.</p>'
          : sections.map(function(s){
              return '<div class="synthesis-card">' +
                '<h3>' + s.tool.icon + ' ' + escapeHTML(s.tool.name) + '</h3>' +
                '<div class="synthesis-kf">' + s.result.keyFigures.map(function(k){
                  return '<div class="synthesis-kf-item"><div class="value">' + escapeHTML(k.value) + '</div><div class="label">' + escapeHTML(k.label) + '</div></div>';
                }).join("") + '</div>' +
                '<a class="synthesis-open-link" href="#/calc/' + s.tool.id + '?client=' + client.id + '">Ouvrir le calculateur complet et l\'affiner →</a>' +
              '</div>';
            }).join("");

        main.innerHTML = '<div class="container bilan-page">' +
          '<a href="#/clients" class="back-link">← Retour aux clients</a>' +
          '<h1>Bilan patrimonial — ' + escapeHTML(clientFullName(wip)) + '</h1>' +
          stepsIndicatorHTML() +
          '<div id="bilanStepBody">' + bodyHTML + '</div>' +
          '<div class="wizard-nav">' +
            '<button class="btn btn-outline" id="bilanBackBtn">← Précédent</button>' +
            '<a class="btn btn-primary" id="bilanRapportBtn" href="#/bilan/' + client.id + '/rapport">📄 Générer le rapport complet →</a>' +
          '</div>' +
        '</div>';

        document.getElementById("bilanBackBtn").addEventListener("click", function(){ currentStep--; renderStep(); });
        return;
      }

      var isIdentite = sectionName === "Identité";
      var isPatrimoine = sectionName === "Patrimoine";
      var stepFields = CLIENT_FIELDS.filter(function(f){ return f.section === sectionName; });

      bodyHTML = '<div class="calc-form">' +
        (isIdentite ? '<div id="bilanFoyerContainer"></div>' : '') +
        (stepFields.length ? '<div class="form-grid">' + stepFields.map(function(f){ return fieldHTML(f, wip[f.id]); }).join("") + '</div>' : '') +
        (isPatrimoine ? '<div id="bilanActifsContainer" style="margin-top:16px;"></div>' : '') +
      '</div>';

      main.innerHTML = '<div class="container bilan-page">' +
        '<a href="#/clients" class="back-link">← Retour aux clients</a>' +
        '<h1>Bilan patrimonial — ' + escapeHTML(clientFullName(wip)) + '</h1>' +
        stepsIndicatorHTML() +
        '<div id="bilanStepBody">' + bodyHTML + '</div>' +
        '<div class="wizard-nav">' +
          (currentStep>0 ? '<button class="btn btn-outline" id="bilanBackBtn">← Précédent</button>' : '<span></span>') +
          '<button class="btn btn-primary" id="bilanNextBtn">' + (currentStep===BILAN_STEPS.length-2 ? "Voir la synthèse →" : "Suivant →") + '</button>' +
        '</div>' +
      '</div>';

      var foyerEditor = isIdentite ? mountFoyerEditor(document.getElementById("bilanFoyerContainer"), wip) : null;
      var actifsEditor = isPatrimoine ? mountActifsEditor(document.getElementById("bilanActifsContainer"), wip) : null;

      function collectStepData(){
        var data = readInputs(stepFields);
        if(foyerEditor){
          var foyerData = foyerEditor.getData();
          Object.assign(data, foyerData);
          data.prenom = foyerData.adultes[0].prenom;
          data.nom = foyerData.adultes[0].nom;
          data.age = foyerData.adultes[0].age;
        }
        if(actifsEditor){ data.actifs = actifsEditor.getData(); }
        return data;
      }

      if(currentStep>0){
        document.getElementById("bilanBackBtn").addEventListener("click", function(){
          Object.assign(wip, collectStepData());
          currentStep--;
          renderStep();
        });
      }
      document.getElementById("bilanNextBtn").addEventListener("click", function(){
        Object.assign(wip, collectStepData());
        saveClient(Object.assign({}, wip, {updatedAt:new Date().toISOString()}));
        currentStep++;
        renderStep();
      });
    }

    renderStep();
  }

  /* ============================ Écran de configuration du rapport patrimonial ============================ */
  function renderRapportConfig(clientId){
    var main = document.getElementById("main");
    var client = getClientById(clientId);
    if(!client){ location.hash = "#/clients"; return; }
    var config = getRapportConfig(client);
    var selected = config.sections.slice();
    var textes = Object.assign({}, config.textes);
    var objectifsCategories = config.objectifsCategories.slice();

    function isSelected(id){ return selected.indexOf(id) !== -1; }
    function toggle(id, on){
      var idx = selected.indexOf(id);
      if(on && idx===-1) selected.push(id);
      if(!on && idx!==-1) selected.splice(idx, 1);
    }
    function toggleCategorie(value, on){
      var idx = objectifsCategories.indexOf(value);
      if(on && idx===-1) objectifsCategories.push(value);
      if(!on && idx!==-1) objectifsCategories.splice(idx, 1);
    }

    function sectionRowHTML(s){
      var extra = "";
      if(s.id === "objectifsPreconisations"){
        extra = '<div class="rapport-tag-checks">' + OBJECTIFS_CATEGORIES.map(function(c){
          return '<label class="rapport-tag-check"><input type="checkbox" class="rapport-objectif-cat" value="' + c.value + '" ' + (objectifsCategories.indexOf(c.value)!==-1?"checked":"") + '> ' + escapeHTML(c.label) + '</label>';
        }).join("") + '</div>';
      }
      return '<div class="rapport-section-row">' +
        '<label><input type="checkbox" class="rapport-section-check" data-section="' + s.id + '" ' + (isSelected(s.id)?"checked":"") + '> ' + escapeHTML(s.label) + '</label>' +
        (s.freeText ? '<div class="rapport-freetext-wrap">' + extra +
          '<textarea data-section-text="' + s.id + '" rows="' + (s.id==="lettre"?8:4) + '" placeholder="' + escapeHTML(s.placeholder || "Texte libre pour cette section (non calculée automatiquement)...") + '">' + escapeHTML(textes[s.id]||"") + '</textarea></div>' : '') +
      '</div>';
    }

    var topSections = RAPPORT_SECTIONS.filter(function(s){ return !s.group; });
    var groupsHTML = RAPPORT_GROUPS.map(function(g){
      var gSections = RAPPORT_SECTIONS.filter(function(s){ return s.group === g.id; });
      var allOn = gSections.every(function(s){ return isSelected(s.id); });
      return '<details class="rapport-group" open><summary><label><input type="checkbox" class="rapport-group-check" data-group="' + g.id + '" ' + (allOn?"checked":"") + '> ' + escapeHTML(g.label) + '</label></summary>' +
        '<div class="rapport-group-body">' + gSections.map(sectionRowHTML).join("") + '</div></details>';
    }).join("");

    var allOnGlobal = RAPPORT_SECTIONS.every(function(s){ return isSelected(s.id); });

    main.innerHTML = '<div class="container rapport-config-page">' +
      '<a href="#/bilan/' + client.id + '" class="back-link">← Retour au bilan</a>' +
      '<h1>Rapport patrimonial — ' + escapeHTML(clientFullName(client)) + '</h1>' +
      '<p class="tool-desc">Sélectionnez les sections à inclure dans le rapport PDF. Les sections adossées à un calculateur (Patrimoine, IFI, Retraite...) sont calculées automatiquement depuis la fiche client ; les autres proposent un espace de texte libre.</p>' +
      '<div class="rapport-toolbar"><label><input type="checkbox" id="rapportSelectAll" ' + (allOnGlobal?"checked":"") + '> Tout sélectionner</label></div>' +
      '<div class="rapport-toplevel">' + topSections.map(sectionRowHTML).join("") + '</div>' +
      groupsHTML +
      '<div class="rapport-toplevel"><div class="rapport-mentions-note">✓ Mentions légales — section toujours incluse dans le rapport (non désactivable).</div></div>' +
      '<div class="wizard-nav">' +
        '<button class="btn btn-primary" id="rapportGenerateBtn">⤓ Générer le rapport PDF</button>' +
      '</div>' +
    '</div>';

    function refreshGroupCheckbox(groupId){
      var cb = main.querySelector('.rapport-group-check[data-group="' + groupId + '"]');
      if(!cb) return;
      var gSections = RAPPORT_SECTIONS.filter(function(s){ return s.group === groupId; });
      var allOn = gSections.every(function(s){ return isSelected(s.id); });
      var noneOn = gSections.every(function(s){ return !isSelected(s.id); });
      cb.checked = allOn;
      cb.indeterminate = !allOn && !noneOn;
    }
    function refreshGlobalCheckbox(){
      var cb = document.getElementById("rapportSelectAll");
      var allOn = RAPPORT_SECTIONS.every(function(s){ return isSelected(s.id); });
      var noneOn = RAPPORT_SECTIONS.every(function(s){ return !isSelected(s.id); });
      cb.checked = allOn;
      cb.indeterminate = !allOn && !noneOn;
    }

    main.querySelectorAll(".rapport-section-check").forEach(function(cb){
      cb.addEventListener("change", function(){
        toggle(cb.dataset.section, cb.checked);
        var s = RAPPORT_SECTIONS.filter(function(x){ return x.id === cb.dataset.section; })[0];
        if(s.group) refreshGroupCheckbox(s.group);
        refreshGlobalCheckbox();
      });
    });
    main.querySelectorAll(".rapport-group-check").forEach(function(cb){
      cb.addEventListener("click", function(e){ e.stopPropagation(); });
      cb.addEventListener("change", function(){
        var groupId = cb.dataset.group;
        RAPPORT_SECTIONS.filter(function(s){ return s.group === groupId; }).forEach(function(s){
          toggle(s.id, cb.checked);
          var rowCb = main.querySelector('.rapport-section-check[data-section="' + s.id + '"]');
          if(rowCb) rowCb.checked = cb.checked;
        });
        cb.indeterminate = false;
        refreshGlobalCheckbox();
      });
    });
    document.getElementById("rapportSelectAll").addEventListener("change", function(){
      var on = this.checked;
      RAPPORT_SECTIONS.forEach(function(s){ toggle(s.id, on); });
      main.querySelectorAll(".rapport-section-check").forEach(function(cb2){ cb2.checked = on; });
      RAPPORT_GROUPS.forEach(function(g){ refreshGroupCheckbox(g.id); });
    });
    main.querySelectorAll("[data-section-text]").forEach(function(ta){
      ta.addEventListener("input", function(){ textes[ta.dataset.sectionText] = ta.value; });
    });
    main.querySelectorAll(".rapport-objectif-cat").forEach(function(cb){
      cb.addEventListener("click", function(e){ e.stopPropagation(); });
      cb.addEventListener("change", function(){ toggleCategorie(cb.value, cb.checked); });
    });

    document.getElementById("rapportGenerateBtn").addEventListener("click", function(){
      var newConfig = {sections: selected.slice(), textes: Object.assign({}, textes), objectifsCategories: objectifsCategories.slice()};
      saveClient(Object.assign({}, client, {rapportConfig: newConfig, updatedAt: new Date().toISOString()}));
      generateRapportPDF(client, newConfig);
    });
  }

          '<label for="logoInput">Logo du cabinet</label>' +
          (profile.logo ? '<img src="' + profile.logo + '" class="logo-preview" id="logoPreview">' : '<img class="logo-preview" id="logoPreview" hidden>') +
          '<input type="file" id="logoInput" accept="image/*">' +
          '<div class="help">Image conservée localement (localStorage), jamais envoyée en ligne.</div>' +
        '</div>' +
        CABINET_FIELDS.map(function(f){ return fieldHTML(f, profile[f.id]); }).join("") +
      '</div><button type="submit" class="btn btn-primary">Enregistrer</button></form>' +
      '<div class="save-msg" id="cabinetSaveMsg"></div>' +
    '</div>';

    var logoDataUrl = profile.logo || null;
    document.getElementById("logoInput").addEventListener("change", function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        logoDataUrl = ev.target.result;
        var preview = document.getElementById("logoPreview");
        preview.src = logoDataUrl;
        preview.hidden = false;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("cabinetForm").addEventListener("submit", function(e){
      e.preventDefault();
      var values = readInputs(CABINET_FIELDS);
      var newProfile = Object.assign({}, profile, values, {logo: logoDataUrl});
      saveCabinetProfile(newProfile);
      applyCabinetBranding();
      var msg = document.getElementById("cabinetSaveMsg");
      msg.textContent = "Paramètres enregistrés ✓";
      setTimeout(function(){ msg.textContent = ""; }, 2500);
    });
  }

  /* ============================ Mentions légales ============================ */
  function renderMentionsLegales(){
    var main = document.getElementById("main");
    var cabinet = getCabinetProfile();
    main.innerHTML = '<div class="container mentions-page">' +
      '<a href="#/" class="back-link">← Retour aux outils</a>' +
      '<h1>Mentions légales</h1>' +
      '<div class="calc-form">' +
        '<h3 style="margin-top:0;">Objet de l\'application</h3>' +
        '<p>CGP Pro est un outil de simulation à but informatif, destiné à accompagner un conseiller en gestion de patrimoine dans la préparation et l\'animation de ses rendez-vous clients. Les calculateurs proposés (capacité d\'emprunt, fiscalité, retraite, transmission...) appliquent des formules et barèmes en vigueur au moment de leur conception.</p>' +
        '<h3>Portée des résultats</h3>' +
        '<p>Les résultats affichés sont indicatifs et simplifiés : ils ne constituent en aucun cas un conseil personnalisé, un engagement contractuel ou une simulation officielle. Les taux, seuils et barèmes fiscaux ou sociaux sont susceptibles d\'évoluer (lois de finances, revalorisations annuelles) et doivent être vérifiés auprès des sources officielles avant toute décision. Cet outil ne remplace pas l\'avis d\'un professionnel qualifié (conseiller en gestion de patrimoine, notaire, expert-comptable, avocat fiscaliste) tenant compte de la situation complète et actualisée du client.</p>' +
        '<h3>Confidentialité des données</h3>' +
        '<p>Toutes les données saisies (fiches clients, simulations, paramètres du cabinet) sont stockées exclusivement dans le navigateur de l\'utilisateur (localStorage) et ne sont transmises à aucun serveur. La suppression des données du navigateur entraîne la perte définitive de ces informations ; aucune sauvegarde externe n\'est réalisée par l\'application.</p>' +
        (cabinet.nomCabinet || cabinet.email || cabinet.telephone ?
          '<h3>Éditeur</h3><p>' + [cabinet.nomCabinet, cabinet.adresse, cabinet.telephone, cabinet.email].filter(Boolean).map(escapeHTML).join('<br>') + '</p>' : '') +
      '</div>' +
    '</div>';
  }

  /* ============================ Router ============================ */
  function parseHash(){
    var raw = location.hash.replace(/^#\/?/, "");
    var clientIdParam = null;
    var queryIdx = raw.indexOf("?");
    if(queryIdx !== -1){
      var query = raw.slice(queryIdx+1);
      raw = raw.slice(0, queryIdx);
      var m = query.match(/(?:^|&)client=([^&]*)/);
      if(m) clientIdParam = decodeURIComponent(m[1]);
    }
    var parts = raw.split("/").filter(Boolean);
    var result;
    if(parts[0] === "calc" && parts[1]) result = {name:"calc", toolId:parts[1], simId:parts[2]};
    else if(parts[0] === "historique") result = {name:"historique"};
    else if(parts[0] === "clients" && parts[1]) result = {name:"client-edit", clientId:parts[1]};
    else if(parts[0] === "clients") result = {name:"clients"};
    else if(parts[0] === "bilan" && parts[1] && parts[2] === "rapport") result = {name:"bilan-rapport", clientId:parts[1]};
    else if(parts[0] === "bilan" && parts[1]) result = {name:"bilan", clientId:parts[1]};
    else if(parts[0] === "bilan") result = {name:"bilan-picker"};
    else if(parts[0] === "parametres") result = {name:"parametres"};
    else if(parts[0] === "mentions-legales") result = {name:"mentions"};
    else result = {name:"home"};
    result.clientIdParam = clientIdParam;
    return result;
  }

  function render(){
    exitPresentationMode();
    var v = parseHash();
    if(v.name === "calc"){
      var tool = TOOLS_BY_ID[v.toolId];
      if(!tool || tool.status === "soon"){ location.hash = ""; return; }
      var prefill = null;
      if(v.simId){
        var sim = getSimulations().filter(function(s){ return s.id === v.simId; })[0];
        if(sim) prefill = sim.inputs;
      }
      if(tool.customRender){ tool.customRender({prefill: prefill, autoCompute: !!prefill, clientId: v.clientIdParam}); }
      else { mountCalculator(tool, {prefill: prefill, autoCompute: !!prefill, clientId: v.clientIdParam}); }
    } else if(v.name === "historique"){
      renderHistorique();
    } else if(v.name === "clients"){
      renderClients();
    } else if(v.name === "client-edit"){
      renderClientForm(v.clientId);
    } else if(v.name === "bilan-picker"){
      renderBilanPicker();
    } else if(v.name === "bilan"){
      renderBilan(v.clientId);
    } else if(v.name === "bilan-rapport"){
      renderRapportConfig(v.clientId);
    } else if(v.name === "parametres"){
      renderParametres();
    } else if(v.name === "mentions"){
      renderMentionsLegales();
    } else {
      renderHome();
    }
  }

  window.addEventListener("hashchange", render);
  document.addEventListener("DOMContentLoaded", function(){
    applyCabinetBranding();
    document.getElementById("legalFooterText").textContent = getLegalMention();
    render();
    document.getElementById("exitPresentBtn").addEventListener("click", exitPresentationMode);
    document.addEventListener("fullscreenchange", function(){
      if(!document.fullscreenElement && document.body.classList.contains("presenting")){
        exitPresentationMode();
      }
    });
  });
})();
</script>
