    /* ---------- 4. Impact des frais cumulés ---------- */
    {
      id:"impact-frais", category:"epargne", status:"ready", icon:"📉",
      name:"Impact des frais cumulés",
      desc:"Compare sur 10, 20 et 30 ans le capital final d'un placement avec et sans frais, à partir d'un capital initial, d'un rendement annuel, de frais sur versement et de frais de gestion.",
      comparable: true,
      compareMetrics:[
        {key:"capital30SansFrais", label:"Capital à 30 ans sans frais", format:"euro", better:"higher"},
        {key:"capital30AvecFrais", label:"Capital à 30 ans avec tous les frais", format:"euro", better:"higher"},
        {key:"ecart30", label:"Coût cumulé total des frais à 30 ans", format:"euro", better:"lower"}
      ],
      fields:[
        {id:"capitalInitial", label:"Capital initial investi", type:"number", suffix:"€", default:50000, step:1000, clientField:"patrimoineFinancier"},
        {id:"versementMensuel", label:"Versement mensuel (optionnel)", type:"number", suffix:"€", default:0, step:50},
        {id:"rendementAnnuel", label:"Taux de rendement annuel brut", type:"number", suffix:"%", default:5, step:0.1},
        {id:"fraisVersement", label:"Frais sur versement (frais d'entrée)", type:"number", suffix:"%", default:1.5, step:0.1, help:"Prélevés une fois sur chaque euro versé (capital initial et versements)."},
        {id:"fraisGestion", label:"Taux de frais de gestion annuel", type:"number", suffix:"%", default:1, step:0.1, help:"Prélevé chaque année sur l'encours, en réduction du rendement."}
      ],
      compute:function(inputs){
        var years = 30;
        var versementAnnuelBrut = inputs.versementMensuel*12;
        var versementAnnuelNet = versementAnnuelBrut*(1-inputs.fraisVersement/100);
        var capitalInitialNet = inputs.capitalInitial*(1-inputs.fraisVersement/100);

        // 3 trajectoires : sans aucun frais / avec frais de gestion seuls / avec frais de gestion + frais sur versement
        var sans = [inputs.capitalInitial];
        var avecGestionSeule = [inputs.capitalInitial];
        var avecTousFrais = [capitalInitialNet];
        for(var y=1; y<=years; y++){
          sans.push(sans[y-1]*(1+inputs.rendementAnnuel/100) + versementAnnuelBrut);
          avecGestionSeule.push(avecGestionSeule[y-1]*(1+(inputs.rendementAnnuel-inputs.fraisGestion)/100) + versementAnnuelBrut);
          avecTousFrais.push(avecTousFrais[y-1]*(1+(inputs.rendementAnnuel-inputs.fraisGestion)/100) + versementAnnuelNet);
        }
        function milestone(y){ return {sans:sans[y], gestion:avecGestionSeule[y], tous:avecTousFrais[y], ecart: sans[y]-avecTousFrais[y]}; }
        var m10 = milestone(10), m20 = milestone(20), m30 = milestone(30);
        var fraisEntreeTotal = (inputs.capitalInitial-capitalInitialNet) + (versementAnnuelBrut-versementAnnuelNet)*years;
        var coutGestionSeule30 = m30.sans - m30.gestion;
        var coutVersementSeul30 = m30.gestion - m30.tous;

        return {
          keyFigures:[
            {label:"Capital à 30 ans sans frais", value: euro.format(m30.sans)},
            {label:"Capital à 30 ans avec tous les frais", value: euro.format(m30.tous)},
            {label:"Coût cumulé total des frais à 30 ans", value: euro.format(m30.ecart)}
          ],
          details:[
            {label:"Capital à 10 ans (sans frais / gestion seule / tous frais)", value: euro.format(m10.sans) + " / " + euro.format(m10.gestion) + " / " + euro.format(m10.tous)},
            {label:"Capital à 20 ans (sans frais / gestion seule / tous frais)", value: euro.format(m20.sans) + " / " + euro.format(m20.gestion) + " / " + euro.format(m20.tous)},
            {label:"Capital à 30 ans (sans frais / gestion seule / tous frais)", value: euro.format(m30.sans) + " / " + euro.format(m30.gestion) + " / " + euro.format(m30.tous)},
            {label:"Écart total à 10 ans / 20 ans / 30 ans", value: euro.format(m10.ecart) + " / " + euro.format(m20.ecart) + " / " + euro.format(m30.ecart)},
            {label:"Dont coût des frais de gestion seuls (30 ans)", value: euro.format(coutGestionSeule30)},
            {label:"Dont coût des frais sur versement seuls (30 ans)", value: euro.format(coutVersementSeul30)},
            {label:"Frais sur versement prélevés en euros (30 ans)", value: euro.format(fraisEntreeTotal)}
          ],
          chart:{
            type:"line",
            labels: Array.from({length: years+1}, function(_, i){ return String(i); }),
            datasets:[
              {label:"Sans frais", data:sans, borderColor:"#0f7a72", backgroundColor:"rgba(15,122,114,0.1)", tension:0.15},
              {label:"Avec frais de gestion seuls", data:avecGestionSeule, borderColor:"#9c7a3c", backgroundColor:"rgba(156,122,60,0.1)", tension:0.15},
              {label:"Avec frais de gestion + frais sur versement", data:avecTousFrais, borderColor:"#b3422c", backgroundColor:"rgba(179,66,44,0.1)", tension:0.15}
            ]
          },
          warnings:[],
          extra:{capital30SansFrais:m30.sans, capital30AvecFrais:m30.tous, ecart30:m30.ecart}
        };
      }
    },

    /* ---------- 14. Comparateur assurance-vie vs PER vs CTO ---------- */
    {
      id:"av-per-cto", category:"epargne", status:"ready", icon:"🔀",
      name:"Comparateur assurance-vie vs PER vs CTO",
      desc:"Compare le bilan net global entre assurance-vie, PER (sortie en capital) et compte-titres ordinaire, pour un même capital versé et un même gain — y compris l'économie d'impôt à l'entrée du PER si les versements sont déductibles.",
      fields:[
        {id:"capitalVerse", label:"Capital versé (total des versements)", type:"number", suffix:"€", default:50000, step:1000},
        {id:"gains", label:"Gains (plus-value) au moment de la sortie", type:"number", suffix:"€", default:20000, step:500},
        {id:"dureeDetention", label:"Ancienneté du contrat (assurance-vie)", type:"number", suffix:"ans", default:10, step:1},
        {id:"situationFamiliale", label:"Situation familiale (abattement AV après 8 ans)", type:"select", default:"seul", clientField:"situationFamiliale", options:[
          {value:"seul", label:"Célibataire (abattement 4 600 €)"},
          {value:"couple", label:"Couple imposé en commun (abattement 9 200 €)"}
        ]},
        {id:"perVersementsDeduits", label:"PER : versements déduits du revenu imposable à l'entrée ?", type:"select", default:"oui", options:[
          {value:"oui", label:"Oui (cas le plus fréquent)"},
          {value:"non", label:"Non (versements non déduits)"}
        ]},
        {id:"tmiEntree", label:"TMI au moment du versement (déduction PER)", type:"number", suffix:"%", default:30, step:1, help:"Souvent plus élevée qu'à la retraite : c'est l'avantage recherché du PER (déduire à un TMI haut, sortir à un TMI plus bas).", clientField:"tmi"},
        {id:"regimeChoisi", label:"Régime d'imposition des gains (PFU ou barème)", type:"select", default:"pfu", options:[
          {value:"pfu", label:"PFU / flat tax (12,8% + 17,2% PS, taux réduit AV après 8 ans)"},
          {value:"bareme", label:"Barème progressif de l'IR + 17,2% PS"}
        ]},
        {id:"tmiSortie", label:"TMI à la sortie", type:"number", suffix:"%", default:30, step:1, clientField:"tmi"}
      ],
      compute:function(inputs){
        var montantTotal = inputs.capitalVerse + inputs.gains;
        var warnings = ["Comparaison à capital versé et gain identiques dans les 3 enveloppes : en pratique elles n'ont ni les mêmes règles de versement/déblocage (le PER est bloqué jusqu'à la retraite, sauf cas de déblocage anticipé), ni le même risque, ni les mêmes frais. L'économie d'impôt à l'entrée du PER est supposée constatée l'année du versement, au TMI saisi, sans tenir compte d'un éventuel plafond de déduction disponible ni d'une réinjection de cette économie dans un autre placement. À valider avec un professionnel."];

        // Assurance-vie : réutilise la même logique que le calculateur dédié.
        var av = computeFiscaliteAV(inputs.gains, inputs.dureeDetention, inputs.situationFamiliale, inputs.capitalVerse, inputs.regimeChoisi, inputs.tmiSortie);
        var netAV = montantTotal - av.total;

        // PER (sortie en capital) : part correspondant aux versements déductibles imposée au barème (sans PS) ; gains au PFU/barème + PS (Art. 158 CGI).
        var impotCapitalPER = inputs.perVersementsDeduits === "oui" ? inputs.capitalVerse*(inputs.tmiSortie/100) : 0;
        var impotGainsPER = inputs.regimeChoisi === "pfu" ? inputs.gains*0.30 : inputs.gains*(inputs.tmiSortie/100 + 0.172);
        var totalImpotPER = impotCapitalPER + impotGainsPER;
        var netPERSortie = montantTotal - totalImpotPER;

        // Économie d'impôt à l'entrée : le versement déductible réduit le revenu imposable l'année du versement.
        var economieImpotEntree = inputs.perVersementsDeduits === "oui" ? inputs.capitalVerse*(inputs.tmiEntree/100) : 0;
        var netPERGlobal = netPERSortie + economieImpotEntree;

        // CTO : gains toujours au PFU/barème + PS, aucun abattement lié à la durée, aucune déduction à l'entrée.
        var impotGainsCTO = inputs.regimeChoisi === "pfu" ? inputs.gains*0.30 : inputs.gains*(inputs.tmiSortie/100 + 0.172);
        var netCTO = montantTotal - impotGainsCTO;

        return {
          keyFigures:[
            {label:"Net perçu — Assurance-vie", value: euro.format(netAV)},
            {label:"Net perçu — CTO", value: euro.format(netCTO)},
            {label:"PER — bilan global (sortie + économie d'entrée)", value: euro.format(netPERGlobal)}
          ],
          details:[
            {label:"Montant total avant fiscalité", value: euro.format(montantTotal)},
            {label:"AV — prélèvements totaux (" + av.tauxAppliqueLabel + ")", value: euro.format(av.total)},
            {label:"CTO — impôt sur les gains", value: euro.format(impotGainsCTO)},
            {label:"PER — net perçu à la sortie (avant économie d'entrée)", value: euro.format(netPERSortie)},
            {label:"PER — impôt sur le capital à la sortie (TMI sortie)", value: euro.format(impotCapitalPER)},
            {label:"PER — impôt sur les gains à la sortie", value: euro.format(impotGainsPER)},
            {label:"PER — économie d'impôt à l'entrée (TMI entrée)", value: euro.format(economieImpotEntree)}
          ],
          chart:{
            type:"bar",
            labels:["Assurance-vie","CTO","PER — sortie seule","PER — bilan global"],
            datasets:[{label:"Net perçu (€)", data:[Math.round(netAV), Math.round(netCTO), Math.round(netPERSortie), Math.round(netPERGlobal)], backgroundColor:["#0f7a72","#122b46","#c9a87c","#9c7a3c"]}]
          },
          warnings: warnings
        };
      }
    },

    /* ---------- 14bis. Simulateur de plafond PER ---------- */
    {
      id:"plafond-per", category:"epargne", status:"ready", icon:"🧮",
      name:"Simulateur de plafond PER",
      desc:"Calcule le plafond de déduction fiscale disponible pour des versements sur un Plan d'Épargne Retraite (PER), selon le statut professionnel, avec mutualisation possible entre conjoints ou partenaires de PACS.",
      fields:[
        {id:"statutProfessionnel", label:"Statut professionnel", type:"select", default:"salarie", options:[
          {value:"salarie", label:"Salarié"},
          {value:"tns", label:"Travailleur non salarié (TNS)"},
          {value:"sans_activite", label:"Sans activité ou retraité"}
        ]},
        {id:"revenuNetImposableN1", label:"Revenu net imposable de l'année N-1", type:"number", suffix:"€", default:35000, step:500,
          help:"Figure sur l'avis d'imposition, ligne des traitements et salaires après abattement de 10%.",
          visibleWhen:{field:"statutProfessionnel", values:["salarie"]}},
        {id:"beneficeImposable", label:"Bénéfice imposable de l'année N (BIC/BNC)", type:"number", suffix:"€", default:35000, step:500,
          visibleWhen:{field:"statutProfessionnel", values:["tns"]}},
        {id:"reliquatCumule5Ans", label:"Plafonds non utilisés des 5 années précédentes (cumul)", type:"number", suffix:"€", default:0, step:500,
          help:"Cumul simplifié, indiqué sur l'avis d'imposition (rubrique \"Plafond Épargne Retraite\"). Chaque reliquat annuel n'est reportable que 3 ans : vérifier la ventilation par année avant d'utiliser un reliquat ancien."},
        {id:"montantDejaVerse", label:"Montant déjà versé sur un PER cette année", type:"number", suffix:"€", default:0, step:500},
        {id:"tmi", label:"Tranche marginale d'imposition (TMI) du foyer", type:"number", suffix:"%", default:30, step:1, clientField:"tmi",
          help:"Un seul TMI par foyer fiscal, même en cas de mutualisation (imposition commune)."},
        {id:"mutualiser", label:"Marié(e) ou pacsé(e) — mutualiser le plafond avec le conjoint", type:"checkbox", default:false,
          help:"Les époux et partenaires de PACS soumis à imposition commune peuvent utiliser le plafond non consommé de l'autre (Art. 163 quatervicies I-A CGI)."},
        {id:"statutProfessionnelConjoint", label:"Statut professionnel du conjoint", type:"select", default:"salarie",
          visibleWhen:{field:"mutualiser", values:["true"]},
          options:[
            {value:"salarie", label:"Salarié"},
            {value:"tns", label:"Travailleur non salarié (TNS)"},
            {value:"sans_activite", label:"Sans activité ou retraité"}
          ]},
        {id:"revenuNetImposableN1Conjoint", label:"Revenu net imposable du conjoint (N-1)", type:"number", suffix:"€", default:30000, step:500,
          visibleWhen:[{field:"mutualiser", values:["true"]}, {field:"statutProfessionnelConjoint", values:["salarie"]}]},
        {id:"beneficeImposableConjoint", label:"Bénéfice imposable du conjoint (N, BIC/BNC)", type:"number", suffix:"€", default:30000, step:500,
          visibleWhen:[{field:"mutualiser", values:["true"]}, {field:"statutProfessionnelConjoint", values:["tns"]}]},
        {id:"reliquatCumule5AnsConjoint", label:"Plafonds non utilisés du conjoint (5 ans, cumul)", type:"number", suffix:"€", default:0, step:500,
          visibleWhen:{field:"mutualiser", values:["true"]}},
        {id:"montantDejaVerseConjoint", label:"Montant déjà versé par le conjoint cette année", type:"number", suffix:"€", default:0, step:500,
          visibleWhen:{field:"mutualiser", values:["true"]}}
      ],
      compute:function(inputs){
        var PASS = 48060; // Plafond annuel de la sécurité sociale 2026

        function labelStatut(v){
          return v==="salarie" ? "Salarié" : v==="tns" ? "Travailleur non salarié" : "Sans activité ou retraité";
        }
        function plafondAnnuel(statut, revenu, benefice){
          if(statut === "salarie"){
            return Math.min(Math.max((revenu||0)*0.10, PASS*0.10), PASS*0.80);
          }
          if(statut === "tns"){
            var beneficeRetenu = Math.min(Math.max(0, benefice||0), 8*PASS);
            var base = beneficeRetenu*0.10 + Math.max(0, beneficeRetenu-PASS)*0.15;
            return Math.min(Math.max(base, PASS*0.10), PASS*1.85);
          }
          return PASS*0.10;
        }

        var plafondMoi = plafondAnnuel(inputs.statutProfessionnel, inputs.revenuNetImposableN1, inputs.beneficeImposable);
        var plafondDisponibleMoi = plafondMoi + inputs.reliquatCumule5Ans;
        var plafondConjoint = 0, plafondDisponibleConjoint = 0;

        var details = [
          {label:"Plafond de l'année (statut : " + labelStatut(inputs.statutProfessionnel) + ")", value: euro.format(plafondMoi)},
          {label:"Report des 5 années précédentes", value: euro.format(inputs.reliquatCumule5Ans)}
        ];

        var plafondDisponibleTotal = plafondDisponibleMoi;
        var montantVerseTotal = inputs.montantDejaVerse;

        if(inputs.mutualiser){
          plafondConjoint = plafondAnnuel(inputs.statutProfessionnelConjoint, inputs.revenuNetImposableN1Conjoint, inputs.beneficeImposableConjoint);
          plafondDisponibleConjoint = plafondConjoint + inputs.reliquatCumule5AnsConjoint;
          plafondDisponibleTotal = plafondDisponibleMoi + plafondDisponibleConjoint;
          montantVerseTotal = inputs.montantDejaVerse + inputs.montantDejaVerseConjoint;
          details.push({label:"Plafond disponible individuel (vous)", value: euro.format(plafondDisponibleMoi)});
          details.push({label:"Plafond de l'année du conjoint (statut : " + labelStatut(inputs.statutProfessionnelConjoint) + ")", value: euro.format(plafondConjoint)});
          details.push({label:"Report des 5 années précédentes (conjoint)", value: euro.format(inputs.reliquatCumule5AnsConjoint)});
          details.push({label:"Plafond disponible individuel (conjoint)", value: euro.format(plafondDisponibleConjoint)});
        }

        var margeRestante = plafondDisponibleTotal - montantVerseTotal;
        details.push({label:"Montant déjà versé cette année" + (inputs.mutualiser?" (couple)":""), value: euro.format(montantVerseTotal)});

        var warnings = [
          "Chaque reliquat annuel non utilisé n'est reportable que pendant 3 ans : le cumul saisi est une simplification, vérifiez la ventilation par année sur votre avis d'imposition avant d'utiliser un reliquat ancien.",
          "Le plafond exact figure sur votre avis d'imposition à la rubrique \"Plafond Épargne Retraite\". Ce simulateur donne une estimation basée sur le barème 2026 (PASS = 48 060 €)."
        ];
        if(montantVerseTotal > plafondDisponibleTotal){
          warnings.unshift("Le montant déjà versé dépasse le plafond disponible : l'excédent (" + euro.format(montantVerseTotal-plafondDisponibleTotal) + ") ne sera pas déductible du revenu imposable.");
        }

        var plafondAnneeAffiche = inputs.mutualiser ? plafondMoi+plafondConjoint : plafondMoi;
        var troisiemeFigure = (inputs.montantDejaVerse>0 || inputs.montantDejaVerseConjoint>0)
          ? {label:"Marge restante à verser", value: euro.format(margeRestante)}
          : {label:"Report des années précédentes", value: euro.format(plafondDisponibleTotal-plafondAnneeAffiche)};

        var plafondMensuelLisse = plafondDisponibleTotal/12;
        details.push({label:"Plafond mensuel lissé sur l'année (plafond disponible ÷ 12)", value: euro2.format(plafondMensuelLisse)});

        // Économie d'impôt : l'année 1 mobilise tout le disponible (report inclus), les années suivantes
        // ne reconduisent que le plafond annuel récurrent (hors report, à TMI et plafond constants).
        var tmiTaux = inputs.tmi/100;
        var economieAn1 = plafondDisponibleTotal*tmiTaux;
        var economieAnnuelleRecurrente = plafondAnneeAffiche*tmiTaux;
        function economieCumulee(nAnnees){ return economieAn1 + economieAnnuelleRecurrente*(nAnnees-1); }
        var horizons = [1, 5, 10, 20];
        var economies = horizons.map(economieCumulee);

        details.push({label:"Économie d'impôt sur 1 an (TMI " + pct(inputs.tmi,0) + ")", value: euro.format(economies[0])});
        details.push({label:"Économie d'impôt cumulée sur 5 ans", value: euro.format(economies[1])});
        details.push({label:"Économie d'impôt cumulée sur 10 ans", value: euro.format(economies[2])});
        details.push({label:"Économie d'impôt cumulée sur 20 ans", value: euro.format(economies[3])});

        warnings.push("Projection d'économie d'impôt à TMI, revenus et plafond annuel constants dans le temps, sans capitalisation des sommes économisées (pas de rendement supposé) : une approximation, pas un engagement.");

        var sujet = inputs.mutualiser ? "vous et votre conjoint disposez ensemble" : "vous disposez";
        var summaryHTML = "Avec un statut " + labelStatut(inputs.statutProfessionnel).toLowerCase() +
          (inputs.mutualiser ? " et une mutualisation avec votre conjoint (" + labelStatut(inputs.statutProfessionnelConjoint).toLowerCase() + ")" : "") +
          ", " + sujet + " d'un plafond de déduction PER disponible de <strong>" + euro.format(plafondDisponibleTotal) + "</strong> cette année" +
          (montantVerseTotal>0 ? ", dont <strong>" + euro.format(Math.max(0,margeRestante)) + "</strong> restent à verser au-delà des " + euro.format(montantVerseTotal) + " déjà versés" : "") +
          ". Soit environ <strong>" + euro2.format(plafondMensuelLisse) + "</strong> par mois lissé sur l'année, pour une économie d'impôt estimée à <strong>" + euro.format(economies[0]) + "</strong> cette année et <strong>" + euro.format(economies[2]) + "</strong> cumulée sur 10 ans à TMI constante.";

        return {
          keyFigures:[
            {label:"Plafond disponible total", value: euro.format(plafondDisponibleTotal)},
            {label:"Plafond mensuel lissé", value: euro2.format(plafondMensuelLisse)},
            {label:"Plafond de l'année en cours", value: euro.format(plafondAnneeAffiche)},
            troisiemeFigure
          ],
          details: details,
          chart:{
            type:"bar",
            labels:["1 an","5 ans","10 ans","20 ans"],
            datasets:[{label:"Économie d'impôt cumulée (€)", data: economies.map(Math.round), backgroundColor:["#c9a87c","#9c7a3c","#0f7a72","#122b46"]}]
          },
          summaryHTML: summaryHTML,
          warnings: warnings
        };
      }
    },

    /* ---------- 15. Calculateur d'intérêts composés ---------- */
    {
      id:"interets-composes", category:"epargne", status:"ready", icon:"📊",
      name:"Calculateur d'intérêts composés",
      desc:"Projette la croissance d'un capital avec versements mensuels réguliers, avec recalcul instantané et visualisation de la part des intérêts générés.",
      fields:[
        {id:"capitalInitial", label:"Capital initial", type:"number", suffix:"€", default:10000, step:500, clientField:"patrimoineFinancier",
          info:"Le montant que vous investissez dès le départ, avant tout versement complémentaire."},
        {id:"epargneMensuelle", label:"Épargne mensuelle", type:"number", suffix:"€", default:200, step:10,
          info:"Le montant versé chaque mois en plus du capital initial, supposé constant sur toute la durée."},
        {id:"horizonAnnees", label:"Horizon de placement", type:"number", suffix:"ans", default:20, step:1,
          info:"La durée pendant laquelle le capital reste investi avant d'être retiré."},
        {id:"tauxAnnuel", label:"Taux d'intérêt annuel", type:"number", suffix:"%", default:7, step:0.1,
          info:"Le rendement annuel moyen espéré du placement, supposé constant (hors fiscalité et frais)."}
      ],
      compute:function(inputs){
        var tauxMensuel = inputs.tauxAnnuel/100/12;
        var n = Math.max(0, Math.round(inputs.horizonAnnees*12));
        var totalVersements = inputs.capitalInitial + inputs.epargneMensuelle*n;
        var capitalFinal;
        if(tauxMensuel > 0){
          var facteur = Math.pow(1+tauxMensuel, n);
          capitalFinal = inputs.capitalInitial*facteur + inputs.epargneMensuelle*((facteur-1)/tauxMensuel);
        } else {
          capitalFinal = totalVersements;
        }
        var interetsGeneres = capitalFinal - totalVersements;

        var labels = [], versementsCumules = [], valeurTotale = [];
        for(var an=0; an<=inputs.horizonAnnees; an++){
          var mois = an*12;
          var f = tauxMensuel>0 ? Math.pow(1+tauxMensuel, mois) : 1;
          var vTotal = tauxMensuel>0
            ? inputs.capitalInitial*f + inputs.epargneMensuelle*((f-1)/tauxMensuel)
            : inputs.capitalInitial + inputs.epargneMensuelle*mois;
          labels.push(an);
          versementsCumules.push(inputs.capitalInitial + inputs.epargneMensuelle*mois);
          valeurTotale.push(vTotal);
        }
        var horizon = inputs.horizonAnnees;
        var milieu = Math.round(horizon/2);

        return {
          keyFigures:[
            {label:"Capital final", value: euro.format(capitalFinal)},
            {label:"Intérêts générés", value: euro.format(interetsGeneres)},
            {label:"Total versé", value: euro.format(totalVersements)}
          ],
          details:[
            {label:"Capital initial", value: euro.format(inputs.capitalInitial)},
            {label:"Épargne mensuelle", value: euro.format(inputs.epargneMensuelle)},
            {label:"Durée", value: horizon + " ans"},

    /* ---------- 15bis. Simulateur DCA vs versement unique ---------- */
    {
      id:"dca-vs-unique", category:"epargne", status:"ready", icon:"📆",
      name:"Simulateur DCA vs versement unique",
      desc:"Compare la valeur finale et la trajectoire d'un versement unique et d'un investissement programmé (DCA), sous une hypothèse de marché constant et sous un scénario de baisse au démarrage.",
      fields:[
        {id:"montantTotal", label:"Montant total à investir", type:"number", suffix:"€", default:60000, step:1000},
        {id:"dureeDCA", label:"Durée d'investissement programmé (DCA)", type:"number", suffix:"mois", default:12, step:1},
        {id:"rendementAnnuelMoyen", label:"Rendement annuel moyen (hypothèse)", type:"number", suffix:"%", default:6, step:0.5},
        {id:"baisseInitiale", label:"Baisse simulée en début de période", type:"number", suffix:"%", default:20, step:1, help:"Scénario de correction de marché juste après l'investissement, pour illustrer le risque de timing."},
        {id:"dureeBaisseMois", label:"Durée de la baisse avant reprise de la tendance", type:"number", suffix:"mois", default:3, step:1}
      ],
      compute:function(inputs){
        var tauxMensuel = Math.pow(1+inputs.rendementAnnuelMoyen/100, 1/12)-1;
        var n = inputs.dureeDCA;
        var versementMensuel = inputs.montantTotal/n;
        var dureeBaisse = Math.min(inputs.dureeBaisseMois, n);
        var factorAuCreux = 1 - inputs.baisseInitiale/100;

        function factorConstant(t){ return Math.pow(1+tauxMensuel, t); }
        function factorCrash(t){
          if(dureeBaisse<=0) return factorConstant(t);
          if(t<=dureeBaisse){ return 1 + (factorAuCreux-1)*(t/dureeBaisse); }
          return factorAuCreux*Math.pow(1+tauxMensuel, t-dureeBaisse);
        }

        // Simule les deux stratégies pour un chemin de marché donné (indice de valeur, base 1 à t=0).
        function simuler(factorFn){
          var trajUnique = [inputs.montantTotal*factorFn(0)];
          var trajDCA = [0];
          var dcaValue = 0;
          for(var t=1; t<=n; t++){
            var rPeriode = factorFn(t)/factorFn(t-1) - 1;
            dcaValue = dcaValue*(1+rPeriode) + versementMensuel;
            trajDCA.push(dcaValue);
            trajUnique.push(inputs.montantTotal*factorFn(t));
          }
          return {unique: trajUnique[n], dca: trajDCA[n], trajUnique: trajUnique, trajDCA: trajDCA};
        }

        var constant = simuler(factorConstant);
        var crash = simuler(factorCrash);
        var ecartConstant = constant.unique - constant.dca;
        var ecartCrash = crash.unique - crash.dca;

        return {
          keyFigures:[
            {label:"Écart si baisse de " + inputs.baisseInitiale + "% au démarrage (unique − DCA)", value: (ecartCrash>=0?"+":"") + euro.format(ecartCrash)},
            {label:"Versement unique — scénario constant", value: euro.format(constant.unique)},
            {label:"DCA — scénario constant", value: euro.format(constant.dca)}
          ],
          details:[
            {label:"Versement mensuel en DCA", value: euro2.format(versementMensuel)},
            {label:"Écart en scénario constant (unique − DCA)", value: (ecartConstant>=0?"+":"") + euro.format(ecartConstant)},
            {label:"Versement unique — avec baisse au démarrage", value: euro.format(crash.unique)},
            {label:"DCA — avec baisse au démarrage", value: euro.format(crash.dca)},
            {label:"Niveau du marché au plus bas de la baisse", value: pct(-inputs.baisseInitiale, 0)}
          ],
          chart:{
            type:"line",
            labels: Array.from({length: n+1}, function(_,i){ return String(i); }),
            datasets:[
              {label:"Versement unique (avec baisse au démarrage)", data: crash.trajUnique.map(Math.round), borderColor:"#122b46", backgroundColor:"rgba(18,43,70,0.08)", tension:0.1},
              {label:"DCA (avec baisse au démarrage)", data: crash.trajDCA.map(Math.round), borderColor:"#0f7a72", backgroundColor:"rgba(15,122,114,0.08)", tension:0.1}
            ]
          },
          warnings:["Deux scénarios déterministes, pas une simulation de marché réelle (pas de volatilité aléatoire ni de rebond partiel) : ils illustrent un principe, pas une prévision. Scénario constant : sous rendement positif constant, le versement unique reste toujours au moins aussi favorable que le DCA, puisqu'il est investi plus longtemps — ce n'est pas un argument contre le DCA. Scénario avec baisse au démarrage : montre au contraire l'intérêt réel du DCA, qui n'a pas encore investi tout le capital au moment du creux et limite ainsi la perte, contrairement au versement unique qui encaisse la baisse en totalité dès le premier jour."]
        };
      }
    },
    /* ---------- Simulateur d'avis d'imposition ---------- */
    {
      id:"avis-imposition", category:"epargne", status:"ready", icon:"🧾",
      name:"Simulateur d'avis d'imposition",
      desc:"Estime l'impôt sur le revenu du foyer à partir des revenus saisis par catégorie fiscale (salaires, pensions, fonciers, BIC, BNC, capitaux mobiliers, plus-values), avec méthode du quotient familial, plafonnement et décote — seul calculateur de l'impôt sur le revenu dans l'application ; les autres modules (Bilan patrimonial, comparateurs) réutilisent ce résultat au lieu de le recalculer.",
      fields:[], // Interface entièrement sur-mesure (mountAvisImposition) : catégories de revenus dépliables, pas de formulaire déclaratif à plat.
      referenceHTML:
        '<h3>Barème retenu (2026, revenus 2025)</h3>' +
        '<table>' +
        '<tr><td>Jusqu\'à 11 600 €</td><td>0 %</td></tr>' +
        '<tr><td>De 11 600 € à 29 579 €</td><td>11 %</td></tr>' +
        '<tr><td>De 29 579 € à 84 577 €</td><td>30 %</td></tr>' +
        '<tr><td>De 84 577 € à 181 917 €</td><td>41 %</td></tr>' +
        '<tr><td>Au-delà de 181 917 €</td><td>45 %</td></tr>' +
        '</table>' +
        '<h3>Abattements par catégorie</h3>' +
        '<table>' +
        '<tr><td>Traitements et salaires</td><td>10% (plancher 509 €/déclarant, plafond 14 555 €/foyer)</td></tr>' +
        '<tr><td>Pensions et retraites</td><td>10% (plancher 454 €/pensionné, plafond 4 439 €/foyer)</td></tr>' +
        '<tr><td>Revenus fonciers (micro-foncier, ≤ 15 000 €/an)</td><td>30%</td></tr>' +
        '<tr><td>BIC — vente/hébergement (micro-BIC)</td><td>71% (min. 305 €)</td></tr>' +
        '<tr><td>BIC — prestations de services (micro-BIC)</td><td>50% (min. 305 €)</td></tr>' +
        '<tr><td>BNC (micro-BNC)</td><td>34% (min. 305 €)</td></tr>' +
        '<tr><td>Dividendes, en cas d\'option barème (RCM)</td><td>40% (pas les intérêts)</td></tr>' +
        '</table>' +
        '<div class="ref-note">Décote (Art. 197 I 4° CGI) : céliba. si IR &lt; 1 982 € (897 € − 45,25 % × IR) ; couple si IR &lt; 3 277 € (1 483 € − 45,25 % × IR). Plafonnement du quotient familial (Art. 197 I 2° CGI) : avantage des parts au-delà de 1 part (céliba.) / 2 parts (couple) plafonné à 1 807 € par demi-part supplémentaire. PFU (prélèvement forfaitaire unique) sur capitaux mobiliers et plus-values : 30% (12,8% IR + 17,2% prélèvements sociaux), option barème progressif possible (globale, sur l\'ensemble des revenus et gains de capitaux mobiliers de l\'année) — les prélèvements sociaux de 17,2% restent dus dans tous les cas. Tous seuils revalorisés chaque année en loi de finances : à vérifier avant toute décision.</div>',
      compute:function(inputs){
        var BAREME = [
          {upTo:11600, rate:0},{upTo:29579, rate:0.11},{upTo:84577, rate:0.30},{upTo:181917, rate:0.41},{upTo:Infinity, rate:0.45}
        ];
        function trancheDe(qf){
          var precedent = 0;
          for(var i=0;i<BAREME.length;i++){
            if(qf <= BAREME[i].upTo) return {rate:BAREME[i].rate, upTo:BAREME[i].upTo};
            precedent = BAREME[i].upTo;
          }
          return BAREME[BAREME.length-1];
        }

        // Compatibilité ascendante : simulations enregistrées avant la ventilation par catégorie de revenu
        // (un seul champ "revenuNetImposable" à plat) — même pipeline barème/QF/plafonnement/décote ci-dessous,
        // simplement sans détail de catégories ni bloc PFU.
        var cat = inputs.revenusCategorises;
        var revenuDetail = (cat && hasAnyCategorieActive(cat)) ? computeRevenusCategorises(cat) : null;
        var revenuAvantCharges = revenuDetail ? revenuDetail.revenuNetImposableBareme : Math.max(0, inputs.revenuNetImposable||0);
        var chargesDeductibles = Math.max(0, inputs.chargesDeductibles||0);
        var revenu = Math.max(0, revenuAvantCharges - chargesDeductibles);

        var parts = Math.max(0.5, inputs.nombreParts||1);
        var partsDeBase = inputs.imposeCommun ? 2 : 1;

        var qf = revenu/parts;
        var irAvantPlafonnement = computeBaremeProgressif(qf, BAREME)*parts;

        var qfBase = revenu/partsDeBase;
        var irBase = computeBaremeProgressif(qfBase, BAREME)*partsDeBase;
        var demiPartsSupp = Math.max(0, (parts-partsDeBase)*2);
        var plafondAvantage = demiPartsSupp*1807;
        var avantageProcure = Math.max(0, irBase-irAvantPlafonnement);
        var irApresPlafonnement = avantageProcure>plafondAvantage ? (irBase-plafondAvantage) : irAvantPlafonnement;

        var seuilDecote = inputs.imposeCommun ? 3277 : 1982;
        var montantDecoteBase = inputs.imposeCommun ? 1483 : 897;
        var decote = irApresPlafonnement < seuilDecote ? Math.max(0, montantDecoteBase - irApresPlafonnement*0.4525) : 0;
        var irNet = Math.max(0, irApresPlafonnement - decote);

        var tranche = trancheDe(qf);
        var tmi = tranche.rate*100;
        var margeParPart = tranche.upTo===Infinity ? null : (tranche.upTo-qf);
        var margeFoyer = margeParPart===null ? null : margeParPart*parts;
        var rfrEstime = revenu/0.9;

        var warnings = [
          "Barème 2026 (revenus 2025) : tranches, abattements, décote et plafonnement du quotient familial sont revalorisés chaque année en loi de finances — vérifiez le barème en vigueur avant toute décision.",
          "Calcul simplifié : hors crédits/réductions d'impôt, prélèvement à la source (avance déjà versée), déficit foncier imputable sur le revenu global (plafond 10 700 €/an, non modélisé), abattement pour durée de détention sur plus-values de titres acquis avant 2018 (non modélisé), et cas particuliers (parent isolé, invalidité...).",
          "Nombre de parts fiscales à vérifier avec le client : la règle standard appliquée ici ne couvre pas tous les cas particuliers.",
          "En cas de concubinage, chaque personne du couple doit être imposée séparément (deux foyers fiscaux distincts) : ne cochez \"imposition commune\" que pour un couple marié ou pacsé."
        ];
        if(revenu>0 && irNet===0){ warnings.unshift("Foyer non imposable au barème avant prise en compte d'éventuels autres revenus ou crédits d'impôt."); }

        var summaryHTML = "Pour un revenu net imposable de <strong>" + euro.format(revenu) + "</strong> réparti sur <strong>" + parts + " part(s)</strong>, l'impôt sur le revenu net est estimé à <strong>" + euro.format(irNet) + "</strong>, avec une tranche marginale d'imposition de <strong>" + pct(tmi,0) + "</strong>" +
          (margeFoyer!==null ? ", et une marge de <strong>" + euro.format(margeFoyer) + "</strong> avant de basculer dans la tranche supérieure." : ", déjà dans la tranche marginale la plus élevée du barème.") +
          (revenuDetail && revenuDetail.totalPfuEtSocial>0 ? " À cela s'ajoutent <strong>" + euro.format(revenuDetail.totalPfuEtSocial) + "</strong> de PFU et prélèvements sociaux sur les revenus de capitaux mobiliers et plus-values non soumis au barème — une imposition distincte." : "");

        var creditsImpot = Math.max(0, inputs.creditsImpot||0);
        var retenueALaSource = Math.max(0, inputs.retenueALaSource||0);
        var totalDuAvantImputations = irNet + (revenuDetail ? revenuDetail.totalPfuEtSocial : 0);
        var soldeNet = totalDuAvantImputations - creditsImpot - retenueALaSource;

        var details = [];
        if(revenuDetail){
          details = details.concat(revenuDetail.lignes);
          details.push({label:"Revenu net imposable avant charges déductibles", value: euro.format(revenuAvantCharges)});
          if(chargesDeductibles>0){ details.push({label:"Charges déductibles du revenu global", value: euro.format(chargesDeductibles)}); }
          details.push({label:"Revenu net imposable total (barème)", value: euro.format(revenu)});
        }
        details = details.concat([
          {label:"Quotient familial (revenu ÷ parts)", value: euro.format(qf)},
          {label:"Nombre de parts retenues", value: String(parts)},
          {label:"IR avant plafonnement du quotient familial", value: euro.format(irAvantPlafonnement)},
          {label:"IR sur la base de " + partsDeBase + " part(s) (sans les parts supplémentaires)", value: euro.format(irBase)},
          {label:"Avantage procuré par les parts supplémentaires", value: euro.format(avantageProcure)},
          {label:"Plafond de l'avantage (" + demiPartsSupp + " demi-part(s) × 1 807 €)", value: euro.format(plafondAvantage)},
          {label:"IR après plafonnement du quotient familial", value: euro.format(irApresPlafonnement)},
          {label:"Décote appliquée", value: euro.format(decote)},
          {label:"Impôt net à payer (barème)", value: euro.format(irNet)}
        ]);
        if(revenuDetail && revenuDetail.totalPfuEtSocial>0){
          details.push(
            {label:"Assiette PFU (capitaux mobiliers/plus-values non optés au barème)", value: euro.format(revenuDetail.pfuAssiette)},
            {label:"Dont impôt forfaitaire 12,8% (part IR)", value: euro.format(revenuDetail.irPfu)},
            {label:"Prélèvements sociaux 17,2% sur revenus de capitaux (toujours dus)", value: euro.format(revenuDetail.psSurCapitaux)},
            {label:"Total PFU + prélèvements sociaux sur capitaux", value: euro.format(revenuDetail.totalPfuEtSocial)}
          );
        }
        if(creditsImpot>0 || retenueALaSource>0){
          details.push(
            {label:"Total dû avant imputations (barème + PFU/PS)", value: euro.format(totalDuAvantImputations)},
            {label:"Crédits et réductions d'impôt", value: euro.format(creditsImpot)},
            {label:"Retenue à la source déjà prélevée", value: euro.format(retenueALaSource)},
            {label: soldeNet>=0 ? "Solde restant à payer" : "Solde à rembourser", value: euro.format(Math.abs(soldeNet))}
          );
        }

        var keyFigures = [
          {label:"Impôt net à payer (barème)", value: euro.format(irNet)},
          {label:"TMI (taux marginal d'imposition)", value: pct(tmi,0)},
          {label:"RFR estimé", value: euro.format(rfrEstime)},
          margeFoyer!==null ? {label:"Marge avant tranche supérieure", value: euro.format(margeFoyer)} : {label:"Tranche marginale", value:"Déjà au taux maximal (45 %)"}
        ];
        if(revenuDetail && revenuDetail.totalPfuEtSocial>0){
          keyFigures.push({label:"PFU + prélèvements sociaux (capitaux, distinct du barème)", value: euro.format(revenuDetail.totalPfuEtSocial)});
        }

        return {
          keyFigures: keyFigures,
          details: details,
          chart:null,
          warnings: warnings,
          summaryHTML: summaryHTML,
          // Chiffres bruts (non formatés) pour l'export complet ("avis d'imposition" détaillé), qui a besoin
          // de composer ses propres rubriques sans reparser les chaînes déjà formatées ci-dessus.
          extra: {
            revenuDetail: revenuDetail,
            revenuNetImposableAvantCharges: revenuAvantCharges,
            chargesDeductibles: chargesDeductibles,
            revenuNetImposableBareme: revenu,
            parts: parts, partsDeBase: partsDeBase, imposeCommun: !!inputs.imposeCommun,
            qf: qf,
            irAvantPlafonnement: irAvantPlafonnement, irBase: irBase, demiPartsSupp: demiPartsSupp,
            plafondAvantage: plafondAvantage, irApresPlafonnement: irApresPlafonnement,
            decote: decote, irNet: irNet, tmi: tmi, margeFoyer: margeFoyer, rfrEstime: rfrEstime,
            creditsImpot: creditsImpot, retenueALaSource: retenueALaSource,
            totalDuAvantImputations: totalDuAvantImputations, soldeNet: soldeNet
          }
        };
      }
    },

  /* ============================ Generic form rendering ============================ */
  // idPrefix (optionnel) permet de générer plusieurs instances du même champ avec des id DOM distincts —
  // utilisé par le mode comparaison de scénarios (colonnes A/B/C du même outil sur une seule page).
  function fieldHTML(f, value, idPrefix){
    idPrefix = idPrefix || "";
    var val = value !== undefined && value !== null ? value : f.default;
    // visibleWhen accepte soit une condition unique {field,values}, soit un tableau de conditions (toutes requises, ET logique).
    var conditions = f.visibleWhen ? (Array.isArray(f.visibleWhen) ? f.visibleWhen : [f.visibleWhen]) : null;
    var wrapAttrs = 'class="field" data-field-wrap="' + f.id + '"' +
      (conditions ? " data-visible-when='" + JSON.stringify(conditions) + "'" : '');
    var id = "f_" + idPrefix + f.id;
    if(f.type === "select"){
      var opts = f.options.map(function(o){
        return '<option value="' + escapeHTML(o.value) + '" ' + (String(o.value)===String(val)?"selected":"") + '>' + escapeHTML(o.label) + '</option>';
      }).join("");
      return '<div ' + wrapAttrs + '><label for="' + id + '">' + escapeHTML(f.label) + '</label>' +
        '<select id="' + id + '">' + opts + '</select>' +
        (f.help ? '<div class="help">' + escapeHTML(f.help) + '</div>' : '') + '</div>';
    }
    if(f.type === "checkbox"){
      var checked = (value !== undefined && value !== null) ? !!value : !!f.default;
      return '<div ' + wrapAttrs + '><label class="checkbox-inline"><input type="checkbox" id="' + id + '" ' + (checked?"checked":"") + '> ' + escapeHTML(f.label) + '</label>' +
        (f.help ? '<div class="help">' + escapeHTML(f.help) + '</div>' : '') + '</div>';
    }
    if(f.type === "text"){
      return '<div ' + wrapAttrs + '><label for="' + id + '">' + escapeHTML(f.label) + '</label>' +
        '<input type="text" id="' + id + '" value="' + escapeHTML(val||"") + '">' +
        (f.help ? '<div class="help">' + escapeHTML(f.help) + '</div>' : '') + '</div>';
    }
    if(f.type === "color"){
      return '<div ' + wrapAttrs + '><label for="' + id + '">' + escapeHTML(f.label) + '</label>' +
        '<input type="color" id="' + id + '" value="' + escapeHTML(val||"#9c7a3c") + '" style="height:42px;padding:4px;width:100%;">' +
        (f.help ? '<div class="help">' + escapeHTML(f.help) + '</div>' : '') + '</div>';
    }
    if(f.type === "textarea"){
      return '<div ' + wrapAttrs + ' style="grid-column:1/-1;"><label for="' + id + '">' + escapeHTML(f.label) + '</label>' +
        '<textarea id="' + id + '" rows="' + (f.rows||6) + '">' + escapeHTML(val||"") + '</textarea>' +
        (f.help ? '<div class="help">' + escapeHTML(f.help) + '</div>' : '') + '</div>';
    }
    return '<div ' + wrapAttrs + '><label for="' + id + '">' + escapeHTML(f.label) + '</label>' +
      '<div class="input-suffix"><input type="number" id="' + id + '" value="' + escapeHTML(val) + '" step="' + (f.step||"any") + '">' +
      '<span class="suffix">' + escapeHTML(f.suffix||"") + '</span></div>' +
      (f.help ? '<div class="help">' + escapeHTML(f.help) + '</div>' : '') + '</div>';
  }

  // Affiche/masque les champs conditionnels. f.visibleWhen (sérialisé en JSON dans data-visible-when) est un
  // tableau de conditions {field, values} — le champ n'est visible que si TOUTES sont vraies (ET logique).
  // Un contrôleur de type checkbox est évalué sur son état coché (values:["true"]/["false"]), pas sur .value.
  function applyFieldVisibility(formEl){
    formEl.querySelectorAll("[data-visible-when]").forEach(function(wrap){
      var conditions = JSON.parse(wrap.getAttribute("data-visible-when"));
      var visible = conditions.every(function(cond){
        var controllerEl = document.getElementById("f_" + cond.field);
        if(!controllerEl) return false;
        var currentValue = controllerEl.type === "checkbox" ? String(controllerEl.checked) : controllerEl.value;
        return cond.values.indexOf(currentValue) !== -1;
      });
      wrap.hidden = !visible;
    });
  }

  // (Re)branche les listeners de visibilité conditionnelle sur un formulaire donné — utilisé au montage
  // initial et après un re-rendu des champs (ex. changement de client sélectionné).
  function wireFieldVisibility(formEl){
    applyFieldVisibility(formEl);
    var controllerIds = {};
    formEl.querySelectorAll("[data-visible-when]").forEach(function(wrap){
      JSON.parse(wrap.getAttribute("data-visible-when")).forEach(function(cond){ controllerIds[cond.field] = true; });
    });
    Object.keys(controllerIds).forEach(function(id){
      var controllerEl = document.getElementById("f_" + id);
      if(controllerEl){ controllerEl.addEventListener("change", function(){ applyFieldVisibility(formEl); }); }
    });
  }

  // Construit un objet de pré-remplissage pour les champs d'un outil à partir d'une fiche client,
  // en ne reprenant que les champs qui déclarent un `clientField` correspondant à une valeur renseignée.
  function mapClientToInputs(client, tool){
    var out = {};
    if(!client) return out;
    tool.fields.forEach(function(f){
      if(!f.clientField) return;
      var v = client[f.clientField];
      if(v === undefined || v === null || v === "") return;
      out[f.id] = v;
    });
    return out;
  }

  // Statut professionnel inféré de la ventilation des revenus par catégorie du client : présence de BIC
  // et/ou BNC actifs = travailleur non salarié. Utilisé pour ne pas redemander le statut manuellement au
  // Simulateur de plafond PER quand le Bilan patrimonial le déclenche automatiquement pour ce client.
  function inferStatutProfessionnelFromClient(client){
    var rc = client.revenusCategorises;
    if(rc && ((rc.bic && rc.bic.actif) || (rc.bnc && rc.bnc.actif))) return "tns";
    return "salarie";
  }
  // Bénéfice imposable BIC+BNC net (après abattement micro ou charges réelles), pour préremplir le champ
  // du Simulateur de plafond PER quand le statut TNS est inféré. Réutilise computeRevenusCategorises,
  // pas de recalcul séparé des abattements micro-BIC/micro-BNC.
  function estimateBeneficeImposableTns(client){
    var rc = client.revenusCategorises;
    if(!rc || !hasAnyCategorieActive(rc)) return null;
    var detail = computeRevenusCategorises(rc);
    var total = detail.netBicTns + detail.netBncTns;
    return total > 0 ? total : null;
  }

  // Variante complète pour le Bilan patrimonial : chaque champ reçoit la valeur de la fiche client si
  // disponible, sinon la valeur par défaut de l'outil — afin de pouvoir lancer tool.compute() sans saisie manuelle.
  function buildFullInputsFromClient(client, tool){
    var out = {};
    tool.fields.forEach(function(f){
      var v = f.clientField ? client[f.clientField] : undefined;
      out[f.id] = (v !== undefined && v !== null && v !== "") ? v : f.default;
    });
    // Le statut professionnel (salarié/TNS) du plafond PER n'a pas de clientField 1:1 : déduit ici des
    // revenus catégorisés du client plutôt que de redemander l'information à l'écran.
    if(tool.id === "plafond-per"){
      var statutInfere = inferStatutProfessionnelFromClient(client);
      if(statutInfere === "tns"){
        out.statutProfessionnel = "tns";
        var beneficeEstime = estimateBeneficeImposableTns(client);
        if(beneficeEstime !== null) out.beneficeImposable = beneficeEstime;
      }
    }
    return out;
  }

  // Nombre de parts fiscales estimé à partir du foyer : 1 part par adulte du foyer fiscal (2 si imposition
  // commune) + 0,5 part pour chacun des 2 premiers enfants à charge + 1 part à partir du 3e (moitié en cas
  // de garde alternée). Simplification (le rang retenu suit l'ordre de saisie, pas nécessairement l'ordre
  // de naissance réel) : sert de point de départ pour le Simulateur d'avis d'imposition, ajustable ensuite.
  function computePartsFiscalesEstimees(client){
    var couple = client.statutCouple === "marie" || client.statutCouple === "pacse";
    var partsAdultes = couple ? 2 : 1;
    var partsEnfants = 0;
    (client.enfants||[]).filter(function(e){ return e.aCharge; }).forEach(function(e, i){
      var partPleine = (i+1) <= 2 ? 0.5 : 1;
      partsEnfants += e.gardeAlternee ? partPleine/2 : partPleine;
    });
    return partsAdultes + partsEnfants;
  }

  // Paramètres du Simulateur d'avis d'imposition à partir des données déjà saisies dans la fiche client —
  // pour permettre à la section "Impôt sur le revenu" du rapport de calculer un ordre de grandeur sans
  // ressaisie préalable dans le simulateur dédié. Si le client a déjà une ventilation par catégorie
  // renseignée (revenusCategorises), elle est réutilisée telle quelle (même moteur de calcul, aucune
  // conversion) ; sinon, migration depuis l'ancien champ global "revenus nets mensuels" vers la seule
  // catégorie "Traitements et salaires" (brut annualisé, abattement 10% appliqué par le calculateur lui-même).
  function buildAvisImpositionInputsFromClient(client){
    var cat;
    if(hasAnyCategorieActive(client.revenusCategorises)){
      cat = client.revenusCategorises;
    } else {
      cat = defaultRevenusCategorises();
      if(client.revenusMensuelsNets){
        cat.salaires = {actif:true, montantBrut: Math.round(client.revenusMensuelsNets*12), fraisReels:false, montantFraisReels:0};
      }
    }
    return {
      imposeCommun: client.statutCouple === "marie" || client.statutCouple === "pacse",
      nombreParts: computePartsFiscalesEstimees(client),
      revenusCategorises: cat
    };
  }

  // Détermine, à partir des projets cochés et de quelques seuils de patrimoine, quels calculateurs
  // sont pertinents pour le Bilan patrimonial d'un client donné.
  function getTriggeredToolIds(client){
    var set = {};
    Object.keys(PROJET_TOOL_MAP).forEach(function(projetKey){
      if(client[projetKey]){ PROJET_TOOL_MAP[projetKey].forEach(function(id){ set[id] = true; }); }
    });
    var patrimoineImmoNet = (client.patrimoineImmobilierBrut||0) - (client.dettesImmobilieres||0);
    if(patrimoineImmoNet >= 1000000){ set["ifi"] = true; }
    if((client.chargesMensuellesCredits||0) > 0){ set["rachat-credit"] = true; }
    if((client.revenusMensuelsNets||0) > 0){ set["plafond-per"] = true; }
    return Object.keys(set).filter(function(id){ return TOOLS_BY_ID[id] && TOOLS_BY_ID[id].status === "ready"; });
  }

  function readInputs(fields, idPrefix){
    idPrefix = idPrefix || "";
    var out = {};
    fields.forEach(function(f){
      var elm = document.getElementById("f_" + idPrefix + f.id);
      if(f.type === "select"){ out[f.id] = elm.value; }
      else if(f.type === "checkbox"){ out[f.id] = elm.checked; }
      else if(f.type === "text" || f.type === "color" || f.type === "textarea"){ out[f.id] = elm.value; }
      else { out[f.id] = parseFloat(elm.value) || 0; }
    });
    return out;
  }

  function formatInputForPrint(f, v){
    if(f.type === "select"){
      var opt = f.options.filter(function(o){ return String(o.value)===String(v); })[0];
      return opt ? opt.label : v;
    }
    if(f.type === "checkbox"){ return v ? "Oui" : "Non"; }
    if(f.type === "text"){ return v || "—"; }
    return v + (f.suffix ? (" " + f.suffix) : "");
  }

  /* ============================ Chart rendering ============================ */
  var chartInstance = null;
  function renderChart(chartDef){
    var wrap = document.getElementById("chartWrap");
    if(!chartDef || typeof Chart === "undefined"){
      wrap.style.display = "none";
      if(chartInstance){ chartInstance.destroy(); chartInstance = null; }
      return;
    }
    wrap.style.display = "";
    var ctx = document.getElementById("resultChart").getContext("2d");
    if(chartInstance){ chartInstance.destroy(); }
    chartInstance = new Chart(ctx, {
      type: chartDef.type,
      data: {labels: chartDef.labels, datasets: chartDef.datasets},
      options: Object.assign({
        responsive:true,
        plugins:{legend:{position:"bottom", labels:{boxWidth:14, font:{size:11}}}}
      }, chartDef.options||{})
    });
  }

  /* ============================ Presentation mode ============================ */
  function enterPresentationMode(){
    document.body.classList.add("presenting");
    document.getElementById("presentBar").hidden = false;
    var elDoc = document.documentElement;
    if(elDoc.requestFullscreen){ elDoc.requestFullscreen().catch(function(){}); }
  }
  function exitPresentationMode(){
    document.body.classList.remove("presenting");
    document.getElementById("presentBar").hidden = true;
    if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(function(){}); }
  }

  /* ============================ PDF export (print) ============================ */
  // En-tête d'impression commune (logo + nom + coordonnées du cabinet si renseignés dans les Paramètres).
  function printHeaderHTML(subtitle){
    var profile = getCabinetProfile();
    var coordParts = [profile.telephone, profile.email, profile.adresse].filter(Boolean);
    return '<div class="print-header">' +
      (profile.logo ? '<img src="' + profile.logo + '" class="print-logo" alt="Logo">' : '') +
      '<h1>' + escapeHTML(profile.nomCabinet || "CGP Pro") + '</h1>' +
      '<div class="print-sub">' + escapeHTML(subtitle) + '</div>' +
      (coordParts.length ? '<div class="print-coord">' + escapeHTML(coordParts.join(" · ")) + '</div>' : '') +
    '</div>';
  }

  function exportPDF(tool, inputs, result, clientName, extraHTML){
    if(!result) return;
    var reportEl = document.getElementById("printReport");
    var dateStr = new Date().toLocaleDateString("fr-FR", {year:"numeric", month:"long", day:"numeric"});
    var chartImg = "";
    var canvas = document.getElementById("resultChart");
    if(canvas && result.chart){
      try{ chartImg = '<img src="' + canvas.toDataURL("image/png", 1.0) + '" class="print-chart">'; }
      catch(e){ chartImg = ""; }
    }
    reportEl.innerHTML =
      printHeaderHTML(tool.name) +
      '<div class="print-meta">' +
        (clientName ? '<div><strong>Client :</strong> ' + escapeHTML(clientName) + '</div>' : '') +
        '<div><strong>Date :</strong> ' + dateStr + '</div>' +
      '</div>' +
      '<div class="print-keyfigures">' +
        result.keyFigures.map(function(k){
          return '<div class="print-kf"><div class="print-kf-value">' + escapeHTML(k.value) + '</div><div class="print-kf-label">' + escapeHTML(k.label) + '</div></div>';
        }).join("") +
      '</div>' +
      chartImg +
      (result.summaryHTML ? '<p class="print-summary">' + result.summaryHTML + '</p>' : '') +
      '<div class="print-details"><h3>Détail du calcul</h3><table>' +
        (result.details||[]).map(function(d){ return '<tr><td>' + escapeHTML(d.label) + '</td><td>' + escapeHTML(d.value) + '</td></tr>'; }).join("") +
      '</table></div>' +
      (tool.fields.length ? '<div class="print-inputs"><h3>Paramètres saisis</h3><table>' +
        tool.fields.map(function(f){ return '<tr><td>' + escapeHTML(f.label) + '</td><td>' + escapeHTML(formatInputForPrint(f, inputs[f.id])) + '</td></tr>'; }).join("") +
      '</table></div>' : '') +
      (extraHTML || "") +
      '<div class="print-footer">' + escapeHTML(getLegalMention()) + '</div>';

  }

  // ======================= Rapport patrimonial complet (multi-sections) =======================
  // Chiffres clés + détail d'un résultat tool.compute(), au format impression (réutilisé par plusieurs sections).
  function rapportToolResultHTML(result){
    var kf = '<div class="print-keyfigures">' + result.keyFigures.map(function(k){
      return '<div class="print-kf"><div class="print-kf-value">' + escapeHTML(k.value) + '</div><div class="print-kf-label">' + escapeHTML(k.label) + '</div></div>';
    }).join("") + '</div>';
    var details = (result.details||[]).length ?
      '<table>' + result.details.map(function(d){ return '<tr><td>' + escapeHTML(d.label) + '</td><td>' + escapeHTML(d.value) + '</td></tr>'; }).join("") + '</table>' : '';
    var summary = result.summaryHTML ? '<p class="print-summary">' + result.summaryHTML + '</p>' : '';
    return kf + summary + details;
  }

  // Génère (hors DOM visible) un graphique camembert du patrimoine par catégorie et retourne son image en base64.
  function rapportPatrimoineChartImg(client){
    if(typeof Chart === "undefined") return "";
    var recap = computeRecapPatrimonial(client);
    var nonZero = recap.rows.filter(function(r){ return r.total > 0; });
    if(!nonZero.length) return "";
    var canvas = document.createElement("canvas");
    canvas.width = 420; canvas.height = 420;
    var chart = new Chart(canvas.getContext("2d"), {
      type:"pie",
      data:{
        labels: nonZero.map(function(r){ return r.categorie; }),
        datasets:[{data: nonZero.map(function(r){ return Math.round(r.total); }), backgroundColor:["#122b46","#9c7a3c","#0f7a72","#b3422c","#5b6b7c","#c9a87c","#1c3f63"]}]
      },
      options:{responsive:false, animation:false, plugins:{legend:{position:"bottom", labels:{boxWidth:12, font:{size:10}}}}}
    });
    var img = "";
    try{ img = canvas.toDataURL("image/png", 1.0); } catch(e){ img = ""; }
    chart.destroy();
    return img ? '<img src="' + img + '" class="print-chart">' : "";
  }

  // Diagnostic successoral personnalisé : simule la transmission aux enfants à charge en supposant que
  // l'un des deux adultes du foyer décède en premier (ordreInverse=false : adulte 1 ; true : adulte 2 —
  // pertinent car la composition du patrimoine propre de chacun diffère souvent). Réutilise le calculateur
  // "Droits de succession" (même compute(), pas de logique fiscale dupliquée) sur la part revenant à
  // chaque enfant. Masse retenue = patrimoine propre du défunt + moitié de l'indivision (simplification :
  // le conjoint survivant est exonéré, seule la transmission aux enfants est chiffrée ici).
  function rapportDiagnosticSuccessoralHTML(client, ordreInverse){
    var hasAdulte2 = !!(client.adultes && client.adultes[1]);
    if(ordreInverse && !hasAdulte2){
      return '<p class="print-freetext">Foyer à un seul adulte : le scénario "ordre inversé" (second adulte du couple décédant en premier) ne s\'applique pas ici.</p>';
    }
    var recap = computeRecapPatrimonial(client);
    var ownerKey = ordreInverse ? "adulte2" : "adulte1";
    var defuntLabel = recap.ownerLabels[ownerKey];
    var masseDefunt = (recap.colTotals[ownerKey]||0) + (recap.colTotals.indivision||0)/2;
    var intro = '<p><strong>Hypothèse : ' + escapeHTML(defuntLabel) + '</strong> décède en premier. Masse successorale retenue (patrimoine propre + moitié de l\'indivision) : <strong>' + euro.format(masseDefunt) + '</strong>. Conjoint survivant : exonération totale (Art. 796-0 bis CGI) — seule la transmission aux enfants est chiffrée ci-dessous.</p>';

    var enfants = (client.enfants||[]).filter(function(e){ return e.aCharge; });
    var succTool = TOOLS_BY_ID["succession"];
    if(!enfants.length || !succTool || succTool.status !== "ready"){
      return intro + '<p class="print-freetext">Aucun enfant à charge renseigné dans le foyer : la transmission aux enfants ne peut pas être simulée.</p>';
    }

    var partParEnfant = masseDefunt/enfants.length;
    var result = succTool.compute({montantTransmis: partParEnfant, lienParente:"enfant"});
    return intro +
      '<p style="margin-bottom:10px;">Répartition à parts égales entre les <strong>' + enfants.length + ' enfant(s)</strong> à charge, soit ' + euro.format(partParEnfant) + ' par enfant :</p>' +
      rapportToolResultHTML(result);
  }

  // Contenu (hors titre) d'une section du rapport. Les sections adossées à un calculateur existant sont
  // calculées à partir de la fiche client (buildFullInputsFromClient) ; les autres affichent le texte libre
  // saisi dans l'écran de configuration (config.textes[id]), faute de calculateur dédié dans l'application.
  function rapportSectionBodyHTML(client, sectionDef, config){
    var id = sectionDef.id;

    if(id === "situationFamiliale"){
      var adultesRows = (client.adultes||[]).map(function(a, i){
        return '<tr><td>' + (i===0?"Adulte 1":"Adulte 2") + '</td><td>' + escapeHTML(((a.prenom||"")+" "+(a.nom||"")).trim()||"—") + '</td>' +
          '<td>' + (a.age!==undefined && a.age!==null && a.age!=="" ? escapeHTML(String(a.age))+" ans" : "—") + '</td>' +
          '<td>' + escapeHTML(a.profession||"—") + '</td></tr>';
      }).join("");
      var statutLabel = labelFromList(STATUTS_COUPLE, client.statutCouple);
      var regimeLabel = client.statutCouple==="marie" ? labelFromList(REGIMES_MARIAGE, client.regimeMatrimonial)
        : client.statutCouple==="pacse" ? labelFromList(REGIMES_PACS, client.regimePacs) : "";
      var enfants = client.enfants || [];
      return '<p><strong>Statut du couple :</strong> ' + escapeHTML(statutLabel) + (regimeLabel ? " (" + escapeHTML(regimeLabel) + ")" : "") + '</p>' +
        '<table><thead><tr><th></th><th>Nom</th><th>Âge</th><th>Profession</th></tr></thead><tbody>' + adultesRows + '</tbody></table>' +
        (enfants.length ?
          '<p style="margin-top:14px;"><strong>Enfants (' + nombreEnfantsACharge(client) + ' à charge fiscalement) :</strong></p>' +
          '<table><thead><tr><th>Prénom</th><th>Âge</th><th>À charge</th><th>Garde alternée</th></tr></thead><tbody>' +
          enfants.map(function(e){
            return '<tr><td>' + escapeHTML(e.prenom||"—") + '</td><td>' + (e.age!==undefined && e.age!==null && e.age!=="" ? escapeHTML(String(e.age)) : "—") + '</td>' +
              '<td>' + (e.aCharge?"Oui":"Non") + '</td><td>' + (e.gardeAlternee?"Oui":"Non") + '</td></tr>';
          }).join("") + '</tbody></table>'
          : '<p class="print-freetext">Aucun enfant renseigné.</p>');
    }

    if(id === "patrimoine"){
      var recap = computeRecapPatrimonial(client);
      return '<table><thead><tr><th>Catégorie</th>' +
          recap.owners.map(function(o){ return '<th>' + escapeHTML(recap.ownerLabels[o]) + '</th>'; }).join("") + '<th>Total</th></tr></thead><tbody>' +
          recap.rows.map(function(r){
            return '<tr><td>' + escapeHTML(r.categorie) + '</td>' + recap.owners.map(function(o){ return '<td>' + euro.format(r.values[o]) + '</td>'; }).join("") + '<td>' + euro.format(r.total) + '</td></tr>';
          }).join("") +
        '</tbody><tfoot><tr><td><strong>Total</strong></td>' +
          recap.owners.map(function(o){ return '<td><strong>' + euro.format(recap.colTotals[o]) + '</strong></td>'; }).join("") +
          '<td><strong>' + euro.format(recap.grandTotal) + '</strong></td></tr></tfoot></table>' +
        rapportPatrimoineChartImg(client);
    }

    if(id === "ifiSection" || id === "retraiteSection"){
      var toolId = id==="ifiSection" ? "ifi" : "pension-retraite";
      var tool = TOOLS_BY_ID[toolId];
      if(!tool || tool.status !== "ready") return '<p class="print-freetext">Calculateur non disponible.</p>';
      return rapportToolResultHTML(tool.compute(buildFullInputsFromClient(client, tool)));
    }

    // Impôt sur le revenu : ne recalcule jamais l'IR ici — seule source de vérité, le calculateur dédié
    // "Simulateur d'avis d'imposition" (avis-imposition). On réutilise sa dernière simulation enregistrée
    // pour ce client (tool.compute() rejoué sur les MÊMES inputs déjà validés/enregistrés, pas de logique
    // dupliquée) ; à défaut de simulation existante, on invite à la compléter d'abord.
    // Impôt sur le revenu : ne recalcule jamais l'IR ici — seule source de vérité, le calculateur dédié
    // "Simulateur d'avis d'imposition" (avis-imposition), toujours via son propre tool.compute(). Si une
    // simulation a été enregistrée pour ce client, elle est rejouée telle quelle (précision maximale, basée
    // sur le véritable avis d'imposition). Sinon, pas besoin de la remplir au préalable : le rapport calcule
    // une estimation directement à partir des données déjà saisies dans la fiche du bilan (revenus nets
    // mensuels, statut du couple, enfants à charge), avec un lien pour affiner si besoin.
    if(id === "impotRevenu"){
      var irTool = TOOLS_BY_ID["avis-imposition"];
      if(!irTool || irTool.status !== "ready") return '<p class="print-freetext">Calculateur non disponible.</p>';
      var irSims = getSimulations().filter(function(s){ return s.clientId === client.id && s.toolId === "avis-imposition"; });
      var irNoteHTML, irResult;
      if(irSims.length){
        var lastIrSim = irSims[0]; // getSimulations() unshift => la plus récente est en tête
        irResult = irTool.compute(lastIrSim.inputs);
        irNoteHTML = '<p class="print-freetext" style="margin-top:0;">Basé sur la simulation d\'avis d\'imposition enregistrée le ' + new Date(lastIrSim.timestamp).toLocaleDateString("fr-FR") + '.</p>';
      } else {
        irResult = irTool.compute(buildAvisImpositionInputsFromClient(client));
        irNoteHTML = '<p class="print-freetext" style="margin-top:0;">Estimation calculée automatiquement à partir des données déjà saisies dans le bilan (revenus nets mensuels, situation du couple, enfants à charge) — revenu net imposable et parts fiscales approximés, à vérifier avec le client. Aucune simulation d\'avis d\'imposition enregistrée pour ce client : pour un calcul plus précis à partir du véritable avis d\'imposition, complétez le <a href="#/calc/avis-imposition?client=' + client.id + '">Simulateur d\'avis d\'imposition</a> pour ce client, puis régénérez le rapport.</p>';
      }
      return irNoteHTML + rapportToolResultHTML(irResult);
    }

    if(id === "diagnosticSuccessoral" || id === "diagnosticSuccessoralInverse"){
      return rapportDiagnosticSuccessoralHTML(client, id === "diagnosticSuccessoralInverse");
    }

    if(id === "synthese"){
      var triggeredIds = getTriggeredToolIds(client);
      var dashboardHTML = '<div class="print-dashboard-title">Vue d\'ensemble</div>' + rapportSyntheseDashboardHTML(client, config);
      if(!triggeredIds.length){
        return dashboardHTML + '<p class="print-freetext">Aucun projet coché pour ce client à l\'étape « Projets en cours » du bilan : aucun calculateur déclenché à détailler ci-dessous.</p>';
      }
      return dashboardHTML + triggeredIds.map(function(tid){
        var t = TOOLS_BY_ID[tid];
        var result = t.compute(buildFullInputsFromClient(client, t));
        return '<div style="margin-bottom:20px;"><h4 style="margin:0 0 8px;color:var(--navy);">' + t.icon + ' ' + escapeHTML(t.name) + '</h4>' + rapportToolResultHTML(result) + '</div>';
      }).join("");
    }

    if(id === "simulationsComplementaires"){
      var sims = getSimulations().filter(function(s){ return s.clientId === client.id; });
      if(!sims.length) return '<p class="print-freetext">Aucune simulation enregistrée pour ce client dans l\'historique.</p>';
      return '<table><thead><tr><th>Outil</th><th>Date</th><th>Résultat principal</th></tr></thead><tbody>' +
        sims.map(function(s){
          var kf = (s.keyFigures && s.keyFigures[0]) ? s.keyFigures[0] : null;
          return '<tr><td>' + escapeHTML(s.toolName||s.toolId) + '</td><td>' + new Date(s.timestamp).toLocaleDateString("fr-FR") + '</td>' +
            '<td>' + (kf ? escapeHTML(kf.value) + " — " + escapeHTML(kf.label) : "—") + '</td></tr>';
        }).join("") + '</tbody></table>';
    }

    // Objectifs : catégories cochées (étiquettes) + verbatims du client (texte libre) recueillis en RDV.
    if(id === "objectifsPreconisations"){
      var catLabels = (config.objectifsCategories || []).map(function(v){
        var c = OBJECTIFS_CATEGORIES.filter(function(o){ return o.value === v; })[0];
        return c ? c.label : v;
      });
      var tagsHTML = catLabels.length ? '<div class="print-tag-list">' + catLabels.map(function(l){ return '<span class="print-tag">' + escapeHTML(l) + '</span>'; }).join("") + '</div>' : '';
      var objText = (config.textes && config.textes[id]) || "";
      var objTextHTML = objText ? '<div class="print-freetext">' + escapeHTML(objText).replace(/\n/g, "<br>") + '</div>' : "";
      return tagsHTML + objTextHTML || '<p class="print-freetext">(Section non renseignée)</p>';
    }

    // Plan d'action : le texte libre saisi est affiché sous forme de liste à puces (une ligne = une puce).
    if(id === "planAction"){
      var planText = (config.textes && config.textes[id]) || "";
      var lines = planText.split(/\n+/).map(function(l){ return l.trim(); }).filter(Boolean);
      if(!lines.length) return '<p class="print-freetext">(Section non renseignée)</p>';
      return '<ul class="print-bullet-list">' + lines.map(function(l){ return '<li>' + escapeHTML(l) + '</li>'; }).join("") + '</ul>';
    }

    // Autres sections sans calculateur dédié dans l'application : texte libre saisi dans l'écran de configuration.
    var text = (config.textes && config.textes[id]) || "";
    return text ? '<div class="print-freetext">' + escapeHTML(text).replace(/\n/g, "<br>") + '</div>' : '<p class="print-freetext">(Section non renseignée)</p>';

  // Poids indicatif (en nombre de pages) d'une section, pour l'estimation de pagination du sommaire —
  // aucun navigateur ne permettant de connaître la pagination réelle avant impression effective.
  function rapportSectionWeight(client, sectionDef){
    if(sectionDef.id === "synthese"){ return Math.max(1, getTriggeredToolIds(client).length); }
    if(sectionDef.id === "simulationsComplementaires"){
      var n = getSimulations().filter(function(s){ return s.clientId === client.id; }).length;
      return Math.max(1, Math.ceil(n/10));
    }
    if(sectionDef.id === "patrimoine"){ return (client.actifs||[]).length > 12 ? 2 : 1; }
    return 1;
  }

  function rapportSommaireHTML(client, selectedDefs){
    var contentDefs = selectedDefs.filter(function(s){ return s.id!=="couverture" && s.id!=="lettre" && s.id!=="sommaire"; });
    var page = 1; // page de couverture
    if(selectedDefs.some(function(s){ return s.id==="couverture"; })){ page = 2; } else { page = 1; }
    if(selectedDefs.some(function(s){ return s.id==="lettre"; })){ page += 1; }
    page += 1; // page(s) du sommaire lui-même (estimation : 1)

    var rows = contentDefs.map(function(s){
      var startPage = page;
      page += rapportSectionWeight(client, s);
      return {label: s.label, group: s.group, page: startPage};
    });
    rows.push({label:"Mentions légales", group:null, page:page});

    var lastGroup = undefined;
    var rowsHTML = rows.map(function(r){
      var groupHeader = "";
      if(r.group !== lastGroup){
        lastGroup = r.group;
        if(r.group){
          var g = RAPPORT_GROUPS.filter(function(gr){ return gr.id===r.group; })[0];
          groupHeader = '<div class="print-toc-group">' + escapeHTML(g ? g.label : r.group) + '</div>';
        }
      }
      return groupHeader + '<div class="print-toc-row"><span>' + escapeHTML(r.label) + '</span><span class="toc-page">p. ' + r.page + '</span></div>';
    }).join("");

    return rowsHTML + '<p class="print-toc-note">Pagination indicative, donnée à titre de repère (les navigateurs ne permettent pas de calculer la pagination exacte avant impression).</p>';
  }

  function rapportSectionWrapperHTML(title, bodyHTML, isFirst){

    var dateStr = new Date().toLocaleDateString("fr-FR", {year:"numeric", month:"long", day:"numeric"});

    var html = "";
    var first = true;
    selectedDefs.forEach(function(s){
      if(s.id === "couverture"){
        html += '<div class="print-section print-cover-page' + (first ? ' print-section-first' : '') + '">' + rapportCoverHTML(client) + '</div>';
      } else if(s.id === "lettre"){
        html += rapportSectionWrapperHTML(s.label, rapportLettreHTML(client, config), first);
      } else if(s.id === "sommaire"){
        html += rapportSectionWrapperHTML(s.label, rapportSommaireHTML(client, selectedDefs), first);

    html += rapportSectionWrapperHTML("Mentions légales", '<p class="print-freetext">' + escapeHTML(getLegalMention()) + '</p>', first);

    reportEl.innerHTML = '<div class="print-running-footer">Document non contractuel · ' + dateStr + '</div>' + html;

  /* ============================ Comparaison de scénarios (composant générique) ============================ */
  // Active sur un outil via tool.comparable (+ tool.compareMetrics, optionnel, pour des écarts chiffrés
  // colorés) : duplique tool.fields en 1 à 3 colonnes indépendantes (scénarios A/B/C) réutilisant fieldHTML/
  // readInputs déjà rendus préfixables, calcule tool.compute() pour chacune, et affiche les résultats côte à
  // côte. Pour étendre à un autre outil plus tard, il suffit d'ajouter ces propriétés à sa définition — ce
  // composant ne connaît rien de spécifique aux 4 outils de départ.
  var SCENARIO_LABELS = ["A", "B", "C"];
  var SCENARIO_COLORS = {A:"#122b46", B:"#9c7a3c", C:"#0f7a72"};

  function formatCompareValue(value, format){
    if(format === "euro") return euro.format(value);
    if(format === "euro2") return euro2.format(value);
    if(format === "pct") return pct(value);
    return String(value);
  }
  function formatCompareDiff(diff, format){
    if(Math.abs(diff) < 0.005) return "identique";
    var sign = diff > 0 ? "+" : "−";
    if(format === "pct"){
      return sign + Math.abs(diff).toLocaleString("fr-FR", {minimumFractionDigits:2, maximumFractionDigits:2}) + " pts";
    }
    return sign + formatCompareValue(Math.abs(diff), format);
  }

  // Rend le tableau comparatif dans #compareKeyfigures (une colonne par scénario, écart coloré vs A).
  // Réutilisé par mountComparableCalculator ET par tout outil à rendu sur mesure (ex. Intérêts composés).
  function renderCompareKeyfigures(tool, scenarios, lastResults){
    var wrap = document.getElementById("compareKeyfigures");
    var metrics = tool.compareMetrics || [];
    var headHTML = '<tr><th></th>' + scenarios.map(function(sc){ return '<th><span class="scenario-badge scenario-badge-' + sc.label + '">Scénario ' + sc.label + '</span></th>'; }).join("") + '</tr>';

    if(!metrics.length){
      // Repli générique pour un futur outil comparable sans compareMetrics déclaré : keyFigures brutes,
      // côte à côte, sans écart chiffré (on ne connaît pas leur sens higher/lower-is-better).
      wrap.innerHTML = '<div class="compare-table-wrap"><table class="compare-table"><thead>' + headHTML + '</thead><tbody>' +
        lastResults.A.result.keyFigures.map(function(k, i){
          return '<tr><td>' + escapeHTML(k.label) + '</td>' + scenarios.map(function(sc){
            var kf = lastResults[sc.label].result.keyFigures[i];
            return '<td>' + escapeHTML(kf ? kf.value : "—") + '</td>';
          }).join("") + '</tr>';
        }).join("") + '</tbody></table></div>';
      return;
    }

    wrap.innerHTML = '<div class="compare-table-wrap"><table class="compare-table"><thead>' + headHTML + '</thead><tbody>' +
      metrics.map(function(m){
        var aVal = lastResults.A.result.extra ? lastResults.A.result.extra[m.key] : undefined;
        return '<tr><td>' + escapeHTML(m.label) + '</td>' +
          scenarios.map(function(sc){
            var e = lastResults[sc.label].result.extra;
            var val = e ? e[m.key] : undefined;
            if(val === undefined) return '<td>—</td>';
            var cell = '<div class="compare-value">' + escapeHTML(formatCompareValue(val, m.format)) + '</div>';
            if(sc.label !== "A" && aVal !== undefined){
              var diff = val - aVal;
              var favorable = (m.better==="higher" && diff>0) || (m.better==="lower" && diff<0);
              var unfavorable = (m.better==="higher" && diff<0) || (m.better==="lower" && diff>0);
              var cls = Math.abs(diff)<0.005 ? "neutral" : (favorable ? "positive" : (unfavorable ? "negative" : "neutral"));
              cell += '<div class="compare-diff compare-diff-' + cls + '">' + escapeHTML(formatCompareDiff(diff, m.format)) + '</div>';
            }
            return '<td>' + cell + '</td>';
          }).join("") +
        '</tr>';
      }).join("") + '</tbody></table></div>';
  }

  // Rend le graphique comparatif superposé dans #resultChart. Idem : partagé entre mountComparableCalculator
  // et les outils à rendu sur mesure.
  function renderCompareChart(tool, scenarios, lastResults){
    var firstChart = lastResults.A.result.chart;
    if(!firstChart){ renderChart(null); return; }
    var chartDef;
    if(firstChart.type === "line"){
      // Superpose une courbe représentative par scénario (le dernier jeu de données du graphique d'origine
      // — pour ces outils, la trajectoire la plus complète/réaliste), une couleur par scénario.
      var datasets = [];
      scenarios.forEach(function(sc){
        var c = lastResults[sc.label].result.chart;
        if(!c || !c.datasets.length) return;
        var ds = c.datasets[c.datasets.length-1];
        datasets.push(Object.assign({}, ds, {
          label: "Scénario " + sc.label + " — " + ds.label,
          borderColor: SCENARIO_COLORS[sc.label],
          backgroundColor: SCENARIO_COLORS[sc.label] + "22"
        }));
      });
      chartDef = {type:"line", labels: firstChart.labels, datasets: datasets};
    } else {
      // Graphiques en barres/anneau : compare les mêmes catégories (déjà dans la même unité, propres à
      // l'outil) entre scénarios plutôt que de mélanger des grandeurs hétérogènes (€, %) sur un même axe.
      chartDef = {
        type:"bar",
        labels: firstChart.labels,
        datasets: scenarios.map(function(sc){
          var c = lastResults[sc.label].result.chart;
          var data = c && c.datasets[0] ? c.datasets[0].data : [];
          return {label:"Scénario " + sc.label, backgroundColor: SCENARIO_COLORS[sc.label], data: data};
        })
      };
    }
    renderChart(chartDef);
  }

          '</form>' +
          (tool.referenceHTML ? '<div class="reference-panel tech-detail">' + tool.referenceHTML + '</div>' : '') +

      var calcFormEl = document.getElementById("calcForm");

      document.getElementById("clientSelect").addEventListener("change", function(e){
